<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotel — The World Manifesto</title>

    <!-- LÄNK TILL DEN SEPARERADE MENY-CSS:EN (ETT STEG UPP) -->
    <link rel="stylesheet" href="../menu.css">

    <style>
        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            line-height: 1.25;
            color: #1a1a1a;
            background-color: #fcfcfc;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
            justify-content: space-between;
        }
        main { text-align: center; }
        footer {
            margin-top: 60px;
            text-align: center;
            font-family: Georgia, serif;
        }
        .webmaster { font-size: 16px; margin-bottom: 15px; }
        .webmaster a { color: #1a1a1a; text-decoration: none; }
        .copyright { font-size: 14px; color: #666; }

        .icon {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 4px;
        }

        .dold { display: none; }

        .tanker {
            display: block;
            animation: pulsera 1.5s ease-in-out infinite;
        }

        @keyframes pulsera {
            0%   { opacity: 0.4; transform: scale(0.9); }
            50%  { opacity: 1;   transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }
    </style>
</head>
<body>

    <!-- HÄR INJECTAS DEN SEPARERADE MENYN AUTOMATISKT -->
    <div id="main-menu"></div>

    <div class="container">
        <main>
            <h1 style="font-size: 36px; font-weight: normal; margin-bottom: 20px;">Robotel</h1>

            <div id="chat-container" style="font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #ffffff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: left;">
                <div style="background: #f8fafc; padding: 15px; border-bottom: 1px solid #e2e8f0; font-weight: bold; color: #1e293b; display: flex; justify-content: space-between; align-items: center;">
                    <span>
                        <img src="../menu_icons/robotel.png" alt="Robotel" class="icon">
                        Robotel, the World Manifesto's answering robot.
                    </span>
                    <button onclick="clearChat()" style="background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 14px;">Rensa</button>
                </div>
                <div id="chat-box" style="height: 350px; overflow-y: auto; padding: 15px; background: #ffffff; display: flex; flex-direction: column; gap: 10px;">
                    <div id="greeting-message" style="background: #f1f5f9; color: #1e293b; padding: 10px 14px; border-radius: 8px; align-self: flex-start; max-width: 80%;">
                        <img src="../menu_icons/tropics.png" alt="Tropics" class="icon">
                        <span id="greeting-text">Write your question here below!</span>
                    </div>
                </div>
                <div style="display: flex; padding: 10px; border-top: 1px solid #e2e8f0; background: #f8fafc;">
                    <input type="text" id="user-input" placeholder="Ask your question..." style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;">
                    <button onclick="sendMessage()" style="margin-left: 8px; background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Send</button>
                </div>
            </div>
        </main>

    </div>

    <!-- ROBOTEL CHAT SKRIPT -->
    <script>
    // ============================================================
    // 1. ÖVERSÄTTNINGAR FÖR HÄLSNINGSFRASEN (42 SPRÅK)
    // ============================================================
    const greetingTranslations = {
        'sv': 'Skriv din fråga här nedan!',
        'en': 'Write your question here below!',
        'fi': 'Kirjoita kysymyksesi tähän alle!',
        'zh': '在此写下您的问题！',
        'hi': 'अपना प्रश्न नीचे लिखें!',
        'es': '¡Escribe tu pregunta aquí abajo!',
        'fr': 'Écrivez votre question ci-dessous !',
        'de': 'Schreiben Sie Ihre Frage hier unten!',
        'ar': 'اكتب سؤالك أدناه!',
        'id': 'Tulis pertanyaan Anda di bawah ini!',
        'bn': 'নীচে আপনার প্রশ্ন লিখুন!',
        'pt': 'Escreva sua pergunta aqui abaixo!',
        'ru': 'Напишите свой вопрос ниже!',
        'uk': 'Напишіть своє запитання нижче!',
        'bg': 'Напишете въпроса си по-долу!',
        'ur': 'اپنا سوال نیچے لکھیں!',
        'ja': '下に質問を書いてください！',
        'tl': 'Isulat ang iyong tanong sa ibaba!',
        'ko': '질문을 아래에 적으세요!',
        'th': 'เขียนคำถามของคุณด้านล่าง!',
        'vi': 'Viết câu hỏi của bạn bên dưới!',
        'tr': 'Sorunuzu aşağıya yazın!',
        'fa': 'سوال خود را در زیر بنویسید!',
        'sw': 'Andika swali lako hapa chini!',
        'it': 'Scrivi la tua domanda qui sotto!',
        'pl': 'Napisz swoje pytanie poniżej!',
        'nl': 'Schrijf uw vraag hieronder!',
        'ro': 'Scrieți întrebarea dvs. mai jos!',
        'el': 'Γράψτε την ερώτησή σας παρακάτω!',
        'af': 'Skryf u vraag hieronder!',
        'zu': 'Bhala umbuzo wakho ngezansi!',
        'xh': 'Bhala umbuzo wakho apha ngezantsi!',
        'cs': 'Napište svou otázku níže!',
        'hu': 'Írja le kérdését alább!',
        'he': 'כתבו את שאלתכם למטה!',
        'crs': 'Ekrir ou kestyon isi anba!',
        'no': 'Skriv spørsmålet ditt nedenfor!',
        'se': 'Čále iežat gažaldaga dás vuollelis!',
        'fit': 'Kirjoita kysymyksesi tähän alle!',
        'da': 'Skriv dit spørgsmål herunder!',
        'is': 'Skrifaðu spurninguna þína hér að neðan!',
        'fo': 'Skrivaðu spurningin tína her niðanfyri!',
        'hr': 'Napišite svoje pitanje ovdje ispod!',
        'sk': 'Napíšte svoju otázku nižšie!'
    };

    // ============================================================
    // 2. HÄMTA BESÖKARENS SPRÅK
    // ============================================================
    const browserLang = (navigator.language || 'en').split('-')[0].toLowerCase();
    const greeting = greetingTranslations[browserLang] || greetingTranslations['en'];

    // ============================================================
    // 3. UPPDATERA HÄLSNINGSFRASEN
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        const greetingText = document.getElementById('greeting-text');
        if (greetingText) {
            greetingText.textContent = greeting;
        }
    });

    // ============================================================
    // 4. CHATT-FUNKTIONER
    // ============================================================
    let currentLanguage = navigator.language || 'sv-SE';

    const inputEl = document.getElementById('user-input');
    const boxEl = document.getElementById('chat-box');

    if(inputEl){
        inputEl.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        boxEl.innerHTML += `<div style="background: #2563eb; color: white; padding: 10px 14px; border-radius: 8px; align-self: flex-end; max-width: 80%;">${escapeHtml(text)}</div>`;
        inputEl.value = '';
        boxEl.scrollTop = boxEl.scrollHeight;

        const thinkingDiv = document.createElement('div');
        thinkingDiv.id = 'thinking';
        thinkingDiv.style.cssText = 'background: #f1f5f9; color: #94a3b8; padding: 10px 14px; border-radius: 8px; align-self: flex-start; max-width: 80%; font-style: italic;';
        thinkingDiv.innerHTML = `<img id="bubbla" src="../robotel/robotel_pics/robotel_agent_thinking.png" alt="Thinking" class="icon dold" style="width:20px;height:20px;vertical-align:middle;"> ...`;
        boxEl.appendChild(thinkingDiv);
        boxEl.scrollTop = boxEl.scrollHeight;

        const bubbla = document.getElementById('bubbla');
        bubbla.classList.remove('dold');
        bubbla.classList.add('tanker');

        try {
            const response = await fetch('https://robotel-live-github.svenyngerstedt2.workers.dev/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    question: text,
                    language: currentLanguage
                })
            });
            const data = await response.json();
            
            const thinking = document.getElementById('thinking');
            if(thinking) thinking.remove();

            if (data.language && data.language !== currentLanguage) {
                currentLanguage = data.language;
            }

            let reply = data.reply || 'No reply';
            reply = reply.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color: #2563eb; text-decoration: underline;">$1</a>');
            reply = reply.replace(/\n/g, '<br>');

            boxEl.innerHTML += `<div style="background: #ffffff; color: #1e293b; padding: 10px 14px; border-radius: 8px; align-self: flex-start; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.05); max-width: 80%;">${reply}</div>`;
        } catch (err) {
            const thinking = document.getElementById('thinking');
            if(thinking) thinking.remove();
            boxEl.innerHTML += `<div style="background: #ef4444; color: white; padding: 10px 14px; border-radius: 8px; align-self: flex-start;"><img src="../robotel/robotel_pics/robotel_agent_error.png" alt="Error" class="icon" style="width:20px;height:20px;vertical-align:middle;"> Couldn't reach Robotel right now. (${escapeHtml(err.message)})</div>`;
        }
        boxEl.scrollTop = boxEl.scrollHeight;
    }

    function clearChat() {
        currentLanguage = navigator.language || 'sv-SE';
        boxEl.innerHTML = `
    <div id="greeting-message" style="background: #f1f5f9; color: #1e293b; padding: 10px 14px; border-radius: 8px; align-self: flex-start; max-width: 80%;">
        <img src="../menu_icons/tropics.png" alt="Tropics" class="icon">
        <span id="greeting-text">${greeting}</span>
    </div>`;
        // Uppdatera även "Rensa"-knappens funktion så att den använder rätt språk vid rensning
    }

    function escapeHtml(s){
        return s.replace(/[&<>"']/g, function(m){
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
        });
    }
    </script>

    <!-- Meny LÄNK TILL DEN SEPARERADE MENY-JS:EN (ETT STEG UPP) -->
    <script src="../menu.js"></script>

    <!-- Sidfot LÄNK TILL DEN SEPARERADE FOTNOT-JS:EN (ETTS STEG NER) -->
    <script src="../footer.js"></script>

</body>
</html>
