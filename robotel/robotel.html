        }

        .icon {

            height: 20px;
            vertical-align: middle;
            margin-right: 4px;
        }

        .dold { display: none; }

        .tanker {
            display: block;
            animation: pulsera 1.5s ease-in-out infinite;
        }

        @keyframes pulsera {
            0%   { opacity: 0.4; transform: scale(0.9); }

    const AVAILABLE = ['sv','en','zh','hi','es','fr','ar','id','bn','pt','ru','uk','bg','ur','ja','fil','de','ko','th','vi','tr','fa','sw','it','pl','nl','ro','el','af','zu','xh','cs','hu','he','crs','se','fit','no','fi','da','is','fo'];

    
function pickBestLanguage(available = AVAILABLE, preferred = []) {
  const prefs = (preferred.length ? preferred : (typeof navigator !== 'undefined' ? (navigator.languages || [navigator.language]) : [])).map(s => String(s).toLowerCase());
  for (const raw of prefs) {
    const tag = raw.toLowerCase().trim();
    if (!tag) continue;
    if (available.includes(tag)) return tag;
    const base = tag.split('-')[0];
    if (available.includes(base)) return base;
    if (RELATED_FALLBACK[tag] && available.includes(RELATED_FALLBACK[tag])) return RELATED_FALLBACK[tag];
    if (RELATED_FALLBACK[base] && available.includes(RELATED_FALLBACK[base])) return RELATED_FALLBACK[base];
    try { const max = new Intl.Locale(tag).maximize(); if (available.includes(max.language)) return max.language; } catch(e) {}
  }
  return available.includes('en') ? 'en' : available[0];
}


    const browserLang = pickBestLanguage();
    const t = translations[browserLang] || translations['en'];

    // ============================================================
    // 3. UPPDATERA ALLA TEXTER
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('robotel-title').textContent = t.title;
        document.getElementById('clear-btn').textContent = t.clear;
        document.getElementById('user-input').placeholder = t.placeholder;
        document.getElementById('send-btn').textContent = t.send;
        document.getElementById('greeting-text').textContent = t.greeting;
    });

    // ============================================================
    // 4. CHATT-FUNKTIONER
    // ============================================================
    let currentLanguage = navigator.language || 'sv-SE';

    const inputEl = document.getElementById('user-input');
    const boxEl = document.getElementById('chat-box');

    if(inputEl){
        inputEl.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        boxEl.innerHTML += `<div style="background: #2563eb; color: white; padding: 10px 14px; border-radius: 8px; align-self: flex-end; max-width: 80%;">${escapeHtml(text)}</div>`;
        inputEl.value = '';
        boxEl.scrollTop = boxEl.scrollHeight;

        const thinkingDiv = document.createElement('div');
        thinkingDiv.id = 'thinking';
        thinkingDiv.style.cssText = 'background: #f1f5f9; color: #94a3b8; padding: 10px 14px; border-radius: 8px; align-self: flex-start; max-width: 80%; font-style: italic;';
        thinkingDiv.innerHTML = `<img id="bubbla" src="../robotel/robotel_pics/robotel_agent_thinking.png" alt="Thinking" class="icon dold" style="width:20px;height:20px;vertical-align:middle;"> ...`;
        boxEl.appendChild(thinkingDiv);
        boxEl.scrollTop = boxEl.scrollHeight;

        const bubbla = document.getElementById('bubbla');
        bubbla.classList.remove('dold');
        bubbla.classList.add('tanker');

        try {
            const response = await fetch('https://robotel-svarsrobot-theworldmanifesto.svenyngerstedt2.workers.dev/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    question: text,
                    language: currentLanguage
                })
            });
            const data = await response.json();
            
            const thinking = document.getElementById('thinking');
            if(thinking) thinking.remove();

            if (data.language && data.language !== currentLanguage) {
                currentLanguage = data.language;
            }

            let reply = data.reply || 'No reply';
            reply = reply.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color: #2563eb; text-decoration: underline;">$1</a>');
            reply = reply.replace(/\n/g, '<br>');

            boxEl.innerHTML += `<div style="background: #ffffff; color: #1e293b; padding: 10px 14px; border-radius: 8px; align-self: flex-start; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.05); max-width: 80%;">${reply}</div>`;
        } catch (err) {
            const thinking = document.getElementById('thinking');
            if(thinking) thinking.remove();
            boxEl.innerHTML += `<div style="background: #ef4444; color: white; padding: 10px 14px; border-radius: 8px; align-self: flex-start;"><img src="../robotel/robotel_pics/robotel_agent_error.png" alt="Error" class="icon" style="width:20px;height:20px;vertical-align:middle;"> Couldn't reach Robotel right now. (${escapeHtml(err.message)})</div>`;
        }
        boxEl.scrollTop = boxEl.scrollHeight;
    }

    function clearChat() {
        currentLanguage = navigator.language || 'sv-SE';
        // Använd den aktuella översättningen för hälsningsfrasen
        const currentGreeting = translations[browserLang]?.greeting || translations['en'].greeting;
        boxEl.innerHTML = `
    <div id="greeting-message" style="background: #f1f5f9; color: #1e293b; padding: 10px 14px; border-radius: 8px; align-self: flex-start; max-width: 80%;">
        <img src="../menu_icons/tropics.png" alt="Tropics" class="icon">
        <span id="greeting-text">${currentGreeting}</span>
    </div>`;
    }

    function escapeHtml(s){
        return s.replace(/[&<>"']/g, function(m){
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
        });
    }
