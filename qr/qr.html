<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR - The World Manifesto</title>
<link rel="stylesheet" href="../menu.css">
<style>
    body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        background: #fafafa;
        color: #1a1a1a;
    }

    .page {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        text-align: center;
    }

    h1 {
        font-size: 24px;
        margin: 24px 0 8px;
    }

    .qr-box {
        display: inline-block;
        background: #fff;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        margin: 24px 0;
    }

    .qr-box img {
        display: block;
        width: 260px;
        height: 260px;
        image-rendering: pixelated;
    }

    .qr-caption {
        margin-top: 12px;
        font-size: 14px;
        color: #555;
    }

    .url {
        font-family: monospace;
        font-size: 13px;
        color: #333;
        word-break: break-all;
        margin-top: 8px;
    }

    .print-btn {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 22px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        color: #1a1a1a;
    }

    .print-btn:hover {
        border-color: #888;
    }

    @media print {
        body { background: #fff; }
        .print-btn, #main-menu { display: none !important; }
        .qr-box { box-shadow: none; border: 1px solid #ccc; }
        .page { max-width: 100%; }
    }
</style>
</head>
<body>

<div id="main-menu"></div>

<div class="page">
    <h1>QR</h1>

    <div class="qr-box">
        <img src="../menu_icons/qr_code.png" alt="QR-kod">
        <div class="qr-caption">The World Manifesto</div>
        <div class="url">https://theworldmanifesto.github.io/</div>
    </div>

    <div>
        <a class="print-btn" href="javascript:window.print()">A4 PDF - print</a>
    </div>
</div>

<script src="../menu.js"></script>
</body>
</html>
