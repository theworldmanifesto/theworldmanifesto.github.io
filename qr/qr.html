<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR - The World Manifesto</title>
    <link rel="icon" href="/pics/favicon.ico" sizes="32x32">
    <link rel="icon" href="/pics/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../lang/css/lang.css">
<link rel="stylesheet" href="../menu.css">
<style>
  .qr-container { text-align:center; padding:40px 20px; }
  .qr-container img.qr-big { width:min(80vw, 400px); height:auto; border:1px solid #eee; }
  .qr-container a[download] { display:inline-block; cursor:pointer; }
  .qr-container a[download]:hover img.qr-big { border-color:#FFD700; box-shadow:0 0 8px rgba(255,215,0,0.4); }
  .qr-container a.pdf-link { display:inline-block; margin-top:24px; font-family:Arimo, sans-serif; font-size:14pt; color:#1a1a1a; text-decoration:underline; }
  .qr-note { margin-top:16px; font-family:sans-serif; font-size:12px; color:#888; }
</style>
</head>
<body>
<div id="main-menu"></div>
<div class="page-container">
  <div class="qr-container">
    <div class="qr-title">The World Manifesto</div>
    <div class="qr-subtitle">QR</div>
    <a href="qr-worldmanifesto.svg" download>
        <img class="qr-big" src="qr-worldmanifesto.svg" alt="QR The World Manifesto">
    </a>
    <br>
    <a class="pdf-link" href="qr-worldmanifesto-a4.pdf" download>A4 PDF - print</a>
    <br>
    <a class="pdf-link" href="qr-worldmanifesto.png" download>PNG image</a>
    <div class="qr-note">https://theworldmanifesto.github.io/</div>
  </div>
</div>
<script type="module" src="../menu.js"></script>
