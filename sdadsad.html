",{id:"personer",className:"mt-20 scroll-mt-8",children:[p("div",{className:"flex items-center gap-3 mb-8",children:[u("span",{className:"text-[10px] tracking-[0.3em] font-bold opacity-40",children:"PERSONGALLERI"}),u("div",{className:"h-[1px] flex-1 bg-[#231d15]/10"})]}),u("div",{className:"grid gap-4",children:[{name:"Lennart Krans",role:"Borgmästare, 58",desc:'Har slips även när han klipper gräset. Blev borgmästare för att han var den enda som lämnade in CV. Har en pärm för varje känsla. Bra på att säga "vi får återkomma i frågan". Sämre på att faktiskt göra det.'},{name:"Holger Gustavsson",role:"Mannen med lösningar, 71",desc:'Pensionerad vaktmästare. Bor bakom macken i en husvagn som han kallar "kontoret". Röker inte men har alltid tändare. Har löst allt från läckande kommunhus till äktenskapskriser med meningen: "Har du provat att låta bli?"'},{name:"Agneta",role:"Kommunsekreterare, 54 — egentlig chef",desc:"Har jobbat i kommunen sedan faxen var ny teknik. Vet var alla lik ligger begravda — bokstavligen, hon sköter kyrkogårdsregistret också. Utan Agneta hade Skråmåla varit en grusgrop med en flagga i."},{name:"Bengt",role:"Ordförande i allt, 67",desc:'Ordförande i hembygdsföreningen, vägföreningen, bouleklubben och krisgruppen. Har aldrig sagt nej till ett uppdrag. Har aldrig läst ett protokoll klart. Äger en keps där det står "BOSS" men det är hans son som tryckt den.'}].map((t)=>p("div",{className:"bg-white/70 border border-[#231d15]/10 p-5 md:p-6 paper-shadow",children:[p("div",{className:"flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-2",children:[u("h3",{className:"display font-bold text-[18px]",children:t.name}),u("span",{className:"serif text-[12px] tracking-wide opacity-60 uppercase font-semibold",children:t.role})]}),u("p",{className:"serif text-[14.5px] leading-[1.7] opacity-80",children:t.desc})]},t.name))}),p("div",{className:"mt-6 text-[11px] serif opacity-50 flex gap-2",children:[u("span",{children:"†"}),u("span",{children:'Kommunens organisationsschema är egentligen bara Agneta med tre pilar som pekar på Lennart och texten "informera vid behov".'})]})]}),u("div",{className:"my-16 flex justify-center",children:u("span",{className:"display text-[22px] opacity-20",children:"— * —"})}),p("section",{id:"kap1",className:"scroll-mt-8",children:[p("header",{className:"mb-8",children:[u("p",{className:"text-[11px] tracking-[0.28em] font-bold opacity-40 mb-3",children:"KAPITEL I"}),u("h2",{className:"display text-[34px] md:text-[44px] font-extrabold leading-[0.92] tracking-[-0.01em]",children:"STATYN SOM INGEN VILLE HA"}),u("p",{className:"serif italic text-[16px] leading-[1.5] mt-4 opacity-70 max-w-[56ch]",children:"Om EU-bidrag som måste brännas på fjorton dagar och hur en borgmästare råkar bli fyra meter hög i brons och håller en falukorv som en olympisk fackla."})]}),p("div",{className:"serif text-[17px] leading-[1.86] space-y-6",children:[u("p",{className:"dropcap",children:'Det började, som allt ont i Skråmåla, med ett brev från en myndighet. Denna gång var det Tillväxtverket. "Kulturförhöjande åtgärd", stod det. 150 000 kronor. Måste användas inom 14 dagar annars återkrav plus ränta plus ett argt telefonsamtal från en handläggare i Stockholm som aldrig varit norr om Södertälje.'}),u("p",{children:'Lennart läste brevet tre gånger. Agneta läste det en gång och sa: "Vi beställer en staty."'}),u("p",{children:'"En staty av vad?" frågade Lennart. Han tänkte på Strindberg, eller i alla fall någon som sett Strindberg på TV.'}),u("p",{children:'"Av något kulturellt", sa Agneta. "Beställ innan Bengt hinner bli ordförande i statygruppen."'}),u("p",{children:"För sent. Bengt var redan ordförande i statygruppen. Han hade bildat den vid frukost."}),p("p",{children:['Konstnären hette Jean-Pierre, kom från Ulricehamn och hade en gång ställt ut på Borås Konstmuseum i korridoren utanför toaletterna. Lennart skickade ett mail: "Vi vill ha något som andas lokal förankring, tradition, framtidstro. Gärna mat."',u("sup",{className:"text-[10px] font-bold text-[#9a6a2f] ml-1",children:"1"})]}),u("p",{children:'Jean-Pierre svarade: "Jag känner dig." Lennart tog det som en komplimang.'}),u("p",{children:"På dag 13 kom lastbilen. Den var för stor för torget. Chauffören var för trött för att bry sig. Presenningen drogs av och där stod den: fyra meter Lennart Krans i brons, med mustasch som aldrig funnits i verkligheten, hållandes en falukorv som om han just vunnit OS i grillning."}),u("p",{children:'Agneta sa ingenting på 11 sekunder. Det är rekord. Sen sa hon: "Den läcker."'}),u("p",{children:'Mycket riktigt. Ur korven droppade det frityrolja. Jean-Pierre hade fått idén att fylla den med "äkta doft". Det hade blivit "äkta läckage".'}),p("div",{className:"bg-[#fff3d6] border border-[#e8c88a] p-5 my-8",children:[u("p",{className:"text-[12px] tracking-[0.18em] font-bold mb-2 opacity-60",children:"UTDRAG UR PROTOKOLL 2023-04-11 §42"}),u("p",{className:"text-[14px] leading-[1.6] italic",children:'"Beslut: Statyn anses kulturförhöjande i enlighet med EU:s definition. Falukorven symboliserar hållbar lokal livsmedelsproduktion. Att statyn läcker är ett konstnärligt grepp som belyser överflödssamhället. Bordet tar frågan om underhåll."'})]}),u("p",{children:'Tisdagen efter gick Lennart till macken. Holger satt i sin husvagn och värmde händerna på en mugg där det stod "Världens Bästa Mormor" fast med tippex ändrat till "Vaktmästare".'}),u("p",{children:'"Vad gör man?" sa Lennart.'}),u("p",{children:'Holger tittade ut på statyn som syntes över granarna. "Du har ju redan en lösning."'}),u("p",{children:'"Har jag?"'}),u("p",{children:'"Du har ju sagt att det är lokal mattradition. Säg det högre. Och döp om torget."'}),u("p",{children:'Sagt och gjort. Torget blev "Korvtorget". Invigningen hölls med gratis korv. Folk kom. Folk tog bilder. En tysk turist trodde det var ett krigsmonument över Wurst. Statyn blev viral i Borås. Tills den dag oljan tog slut och en mås byggde bo i korven. Det, sa Holger, "är ju också kultur".'})]}),u("div",{className:"mt-10 pt-6 border-t border-[#231d15]/10 space-y-2",children:p("p",{className:"serif text-[12.5px] leading-[1.6] opacity-60",children:[u("sup",{className:"font-bold mr-1",children:"1"}),' I mailet stod ordagrant "gärna mat". Detta har i efterhand tolkats av revisorerna som "gärna matnyttig information", men skadan var redan gjuten i brons.']})})]}),u("div",{className:"my-16 flex justify-center",children:u("span",{className:"display text-[22px] opacity-20",children:"— * —"})}),p("section",{id:"kap2",className:"scroll-mt-8",children:[p("header",{className:"mb-8",children:[u("p",{className:"text-[11px] tracking-[0.28em] font-bold opacity-40 mb-3",children:"KAPITEL II"}),u("h2",{className:"display text-[34px] md:text-[44px] font-extrabold leading-[0.92]",children:"RONDELLHUNDEN OCH TRAFIKVERKET"}),u("p",{className:"serif italic text-[16px] leading-[1.5] mt-4 opacity-70 max-w-[56ch]",children:"Om Sveriges enda raka vägsträcka, varför en mack hamnade mitt i en rondell, och hur korvförsäljning kan klassas som trafiksäkerhetsåtgärd."})]}),p("div",{className:"serif text-[17px] leading-[1.86] space-y-6",children:[u("p",{className:"dropcap",children:"Trafikverket har en karta där Skråmåla inte finns. De har också en plan där Skråmåla ska ha en rondell. Detta är fullt logiskt om man arbetar på Trafikverket. Vägen genom byn är den enda raka sträckan på sju mil, och den hade råkat bli för säker. Noll olyckor på tolv år. Sånt kan man inte ha."}),u("p",{children:'"Vi bygger en rondell för att öka trafiksäkerheten och flödet", sa en man i väst.'}),u("p",{children:'"Vilket flöde?" sa Agneta. "Vi har ett flöde. Det heter Bengt när han cyklar till Konsum."'}),u("p",{children:"Problemet: Mitt i den planerade rondellen stod Holgers mack. Sedan 1978. Med bygglov från en tid då bygglov var en handskakning och en pilsner."}),u("p",{children:'Trafikverket sa: "Macken måste bort." Holger sa: "Jag var här först. Asfalten kom sen." Båda hade rätt, vilket är det värsta som kan hända i en förhandling.'}),u("p",{children:'Lennart gick till macken. Han hade med sig två pärmar denna gång. En märkt "RONDELL - JURIDIK" och en märkt "RONDELL - KÄNSLOR". Holger öppnade bara den andra.'}),u("p",{children:'"Varför ska ni flytta macken när ni kan flytta rondellen runt macken?" sa Holger.'}),u("p",{children:'Lennart blinkade. "Går det?"'}),u("p",{children:'"Allt går om man ritar tillräckligt fult", sa Holger. Han tog en servett och ritade en cirkel med en fyrkant i mitten. "Bilarna kör runt. Folk stannar. Du får en rondell. Jag får kunder. Trafikverket får en pin på kartan."'}),u("p",{children:'Så blev det. Sveriges första drive-in-drive-around. Bilarna kör i sakta mak runt korvkiosken. Man beställer i fönster ett, betalar i fönster två, och får en trafikregel i fönster tre. Olyckor: 0. Korvförsäljning: +400%. Trafikverket skickade en delegation. De tog bilder. De sa "innovativt". Sen åkte de vilse på vägen hem för att GPS:en inte kände igen rondellen.'}),u("p",{className:"italic opacity-80",children:'På macken sitter nu en skylt: "Kör sakta. Korven är varm och livet är kort." Under har någon skrivit med spritpenna: "Gäller även Trafikverket."'})]})]}),u("div",{className:"my-16 flex justify-center",children:u("span",{className:"display text-[22px] opacity-20",children:"— * —"})}),p("section",{id:"kap3",className:"scroll-mt-8",children:[p("header",{className:"mb-8",children:[u("p",{className:"text-[11px] tracking-[0.28em] font-bold opacity-40 mb-3",children:"KAPITEL III"}),u("h2",{className:"display text-[34px] md:text-[44px] font-extrabold leading-[0.92]",children:"FESTIVALEN SOM SPÅRADE UR"}),u("p",{className:"serif italic text-[16px] leading-[1.5] mt-4 opacity-70 max-w-[56ch]",children:"Om hur man lockar turister från Borås genom att erkänna att man misslyckats, och varför autenticitet luktar lite stekt lök."})]}),p("div",{className:"serif text-[17px] leading-[1.86] space-y-6",children:[u("p",{className:"dropcap",children:'Skråmåla har försökt ha festival i 20 år. Den hette först "Skråmåla Dagarna", sen "Skråmåla Kulturdagar", sen "Skråmåla Upplev!". Ingen upplevde. 2019 kom tre besökare. En var vilse, en var Bengt, en var Bengts fru som letade efter Bengt.'}),u("p",{children:'2023 sa Region: "Gör något som lockar Borås." Lennart tog det personligt. Han bokade ett coverband som spelade Lasse Stefanz-covers fast sämre. Han tryckte 500 affischer. Han la upp ett evenemang på Facebook. 4 personer klickade "intresserad". Tre av dem var Holgers fejkkonton.'}),u("p",{children:"Lennart gick till macken en regnig torsdag."}),u("p",{children:'"Ingen kommer", sa han.'}),u("p",{children:'"Bra", sa Holger. "Då har ni något unikt."'}),p("p",{children:["Holger tog en röd spritpenna och strök över affischen. Han skrev: ",u("span",{className:"font-semibold",children:'"SKRÅMÅLA MISSLYCKADE KULTURFESTIVAL - KOM OCH SE HUR ILLA DET KAN BLI"'}),'. Under: "Inga foodtrucks. Bara Holgers korv. Ingen ljudtekniker. Bengt sköter micken. Vi lovar inget och håller det."']}),u("p",{children:"Agneta sa att det var karriärsjälvmord. Bengt blev ordförande i festivalens misslyckandegrupp. De lade ut affischen igen. Den delades 12 000 gånger."}),u("p",{children:'Lördagen kom 2000 personer. Alla influencers som ville visa "det äkta Sverige". De fotade den läckande statyn. De filmade rondell-macken. De köpte korv och skrev "så jävla autentiskt" med filter som gjorde allt sepia. En kille från Göteborg grät när han åt en halv special och sa att han äntligen kände något.'}),u("p",{children:'Kommunen gick plus för första gången sedan 1974. Överskottet var 3 200 kronor. Agneta köpte en ny kaffebryggare och en skylt till kommunhuset: "Vi är autentiska på riktigt nu. Sluta komma hit."'}),u("p",{className:"text-[14px] leading-[1.6] opacity-70 border-l-2 border-[#231d15]/15 pl-4 italic",children:'Fotnot från festivalprogrammet: "Parkering sker på eget ansvar och på grannens åker om man frågar snällt. Toalett finns bakom scenen, men det '}),u("p",{children:"Lennart blinkade. Den där blinkningen igen. Den som betyder att nu kommer en idé som kommer sluta i ett extra möte med Agneta."}),u("p",{children:'"Vi inför egen valuta", sa Holger. "SkråmåladaLern. Eller bara Daler. Alla bra ställen har ju egen valuta. Bitcoin har ni ju. Varför inte SkråmåladaLern?"'}),u("p",{children:'Lennart hade just lyssnat på tre avsnitt av en podd om krypto på tåget till Jönköping. Han förstod kanske 20 procent, men de 20 procenten var "decentraliserat", "framtiden" och "uppbackad av community". Det lät exakt som Skråmåla.'}),u("p",{children:'"Växelkurs då?" frågade han.'}),u("p",{children:'"1 Daler är 1 kram. Eller 3 ägg. Eller vad man känner för den dagen", sa Holger. "Inflationen blir känslostyrd. Är man ledsen är allt billigare."'}),u("p",{children:'På kommunfullmäktige samma kväll klubbade Lennart förslaget. Agneta sa "absolut inte". Bengt röstade ja, för han trodde att Daler var en ny äppelsort som skulle kunna odlas bakom PRO-lokalen. 3-1. Demokrati i Skråmåla.'}),p("div",{className:"bg-white border border-[#231d15]/10 p-5 my-8 paper-shadow rotate-[0.4deg]",children:[u("p",{className:"text-[11px] tracking-[0.18em] font-bold mb-3 opacity-60",children:"SKRÅMÅLA KOMMUN — FÖRORDNING NR 1/2024 — VALUTALAGEN"}),p("div",{className:"text-[14px] leading-[1.7] space-y-1",children:[p("p",{children:[u("span",{className:"font-bold",children:"§1"})," SkråmåladaLer (DALER) införs som officiell valuta jämte SEK."]}),p("p",{children:[u("span",{className:"font-bold",children:"§2"})," Sedlar trycks på kommunkontorets färgskrivare. Mynt utgörs av kapsyler från Holgers mack. 1 kapsyl = 0,5 Daler. Kapsyl med Elvis-fläck = 5 Daler."]}),p("p",{children:[u("span",{className:"font-bold",children:"§3"})," Växelkurs fastställs dagligen av Holger beroende på humör och väder."]}),p("p",{children:[u("span",{className:"font-bold",children:"§4"})," Kenneth älgen är riksbank."]})]})]}),u("p",{children:'Sedlarna trycktes på natten. Kommunkontorets Canon hade varit slut på cyan sedan 2022, så alla sedlar blev rödbruna. Som falukorv. Motivet var Kenneth som tuggar på kommunens budget — Agneta hade råkat skriva ut fel fil och tyckte det blev "konceptuellt". På baksidan: rondellen, uppifrån, tagen med drönare som Bengt köpt på Elgiganten för 799 kronor och kraschat två gånger.'}),u("p",{children:'Mynt fanns som sagt inte. Man använde kapsyler. Gamla Pripps Blå, nya Mariestads, en och annan utländsk som någon tagit från semestern. Agneta hade en burk där det stod "VÄXEL - EJ ÄTBAR".'}),p("p",{children:["Och Skråmåla accepterade. ICA Nära satte upp en lapp: ",u("span",{className:"font-semibold",children:'"Vi tar Daler. Mjölk: en bra historia + 2 Daler. Har du ingen historia går det bra med 20 kr också."'})," Barnen började betala skolmaten med kramar. Vilket gjorde matpersonalen förvirrad men glad."]}),u("p",{children:'Trafikverket fick sin betalning. Ett rekommenderat brev med 2,3 miljoner Daler. I små valörer. I två Ica-kassar. Lennart hade skrivit en post-it: "Stark lokal valuta, uppbackad av älg. Växelkurs idag: mycket fördelaktig."'}),u("p",{children:'De ringde efter tre dagar. "Vad är detta?" sa en kvinna som lät som om hon hade 47 andra kommuner på andra linjen.'}),u("p",{children:'"Lokal valuta. Mycket stark. Uppbackad av älg", sa Lennart och läste innantill från post-it-lappen.'}),u("p",{children:'Trafikverket skickade till inkasso. Inkasso skickade tillbaka det med en lapp: "Kan ej driva in, förstår ej valuta, hör av er när ni har riktiga pengar eller i alla fall Swish."'}),u("p",{children:"Då hände det som alltid händer när något är tillräckligt dumt i Sverige. En krypto-influencer från Stockholm hörde om det."}),p("p",{children:["Han hette Crypto-Kristoffer, hade vit keps inomhus och en ring light i bilen. Han åkte till Skråmåla, filmade rondellen i 12 varv, intervjuade Kenneth som åt upp hans mikrofonvindskydd, och laddade upp: ",u("span",{className:"font-bold italic",children:'"JAG HITTADE SVERIGES HEMLIGA BITCOIN - BORGMÄSTAREN ÄR MILJONÄR!!"'}),". Tumnagel: Lennart som håller en röd sedel och ser ut som han håller en parkeringsbot."]}),u("p",{children:'Videon fick 400 000 visningar. Kommentarsfältet: "Äntligen en valuta uppbackad av något riktigt!!!" Plötsligt kom bilar. Folk ville växla in riktiga kronor till Daler. "Till barnen", sa de. "Som souvenir." Agneta växlade. Hon har alltid tyckt om när folk kommer med riktiga pengar.'}),u("p",{children:"I en vecka var Skråmåla kommun rik på riktigt. De hade 312 000 kronor i lådan. De köpte en ny gräsklippare. De lagade hålet i ishallen. Bengt blev ordförande i valutafonden."}),u("p",{children:'Sen kom tisdagen. Agneta skulle skriva ut 40 sedlar till marknaden. Hon råkade ställa in antal kopior på "9999" och gick för att ta kaffe. Skrivaren, som hatat kommunen sedan 2019, gjorde sitt jobb. När Lennart kom tillbaka låg det 8 miljarder Daler på golvet. I knähöjd. Kenneth hade redan börjat äta.'}),u("p",{className:"font-semibold",children:'Hyperinflation i Skråmåla. En korv kostade 40 000 Daler på tisdag morgon. 400 000 på onsdag. På torsdag behövde man ta med Ica-kasse för att köpa tuggummi. ICA Nära ändrade skylten till "Vi tar inte Daler idag, vi är deppiga".'}),u("p",{children:"Holger kallade till krismöte på macken. Alla kom. Till och med Kenneth, som rapade bläck."}),u("p",{children:'"Vi gör en valutareform", sa Holger och hällde kaffe som om det var riksbankens räntebesked.'}),u("p",{children:"Så döptes Daler om till Nya Daler. Växelkurs: 1 Nya Daler = 1 miljon gamla Daler + en ursäkt till Trafikverket. Alla gamla sedlar eldades upp i grillen bakom macken. Korven den kvällen smakade lite bläck, lite ånger och lite Canon-toner, men det var okej. I Skråmåla har korven alltid smakat lite som kommunen mår."}),p("p",{children:["Trafikverket fick ett nytt brev, skrivet av Agneta på riktigt brevpapper denna gång: ",u("span",{className:"italic",children:'"Vi har genomfört en finansiell omstrukturering i linje med Riksbankens rekommendationer och erbjuder er 23 korvar och en klapp på Kenneth som slutlikvid. Med vänlig hälsning, Skråmåla kommun."'})]}),u("p",{children:'Trafikverket, som den veckan hade 400 andra kommuner som bråkade om bullerplank, viltstängsel och varför man inte kan ha en rondell med korvkiosk i mitten, orkade inte. De avskrev skulden som "kulturell förlust, ej prioriterad". Det finns ett dokument. Agneta har laminerat det.'}),u("p",{children:"Senare på kvällen, när grillen fortfarande glödde och Kenneth låg mätt på sedlar och såg ut som en sedelhög med ben, frågade Lennart:"}),u("p",{children:'"Varför funkar dina lösningar alltid, fast de inte borde funka?"'}),u("p",{children:"Holger petade i glöden med en pinne."}),u("p",{children:'"För att ingen annan orkar kolla om de är lagliga."'}),p("p",{className:"pt-4",children:["I kassaskåpet på kommunkontoret ligger en enda sedel kvar. 1 Daler. Rödbrun, lite snedskuren, med Kenneth som ser allvarlig ut. På baksidan har Agneta skrivit med spritpenna: ",u("span",{className:"font-bold",children:'"Aldrig mer"'}),". Den är värd mer än alla andra tillsammans."]})]})]}),u("div",{className:"my-16 flex justify-center",children:u("span",{className:"display text-[22px] opacity-20",children:"— * —"})}),p("section",{id:"kap10",className:"scroll-mt-8",children:[p("header",{className:"mb-8",children:[u("p",{className:"text-[11px] tracking-[0.28em] font-bold opacity-40 mb-3",children:"KAPITEL X"}),u("h2",{className:"display text-[34px] md:text-[44px] font-extrabold leading-[0.92] tracking-[-0.01em]",children:"ÅRETS KOMMUN"}),u("p",{className:"serif italic text-[16px] leading-[1.5] mt-4 opacity-70 max-w-[56ch]",children:"Och hur vi nästan klarade att verka normala. Priset för att vara bäst är att man måste låtsas att man inte är sämst."})]}),p("div",{className:"serif text-[17px] leading-[1.86] space-y-6",children:[u("p",{className:"dropcap",children:"Brevet kom på en onsdag. Vilket var första varningssignalen — viktiga brev kommer alltid på tisdag, det är en kommunal naturlag. Det här kom på onsdag, i ett kuvert som var för tjockt, för blankt och hade två loggor som aldrig borde vara i samma rum: SKR och Dagens Samhälle. Lennart öppnade. Agneta läste över axeln. Bengt hade redan bildat en mottagningsgrupp och laminerat en skylt där det stod VÄLKOMMEN VIKTIGT BREV."}),p("div",{className:"bg-white border border-[#231d15]/10 p-5 my-8 paper-shadow rotate-[-0.3deg]",children:[u("p",{className:"text-[11px] tracking-[0.18em] font-bold mb-3 opacity-60",children:"SKR / DAGENS SAMHÄLLE — UTNÄMNING ÅRETS KOMMUN 2025"}),u("p",{className:"text-[15px] leading-[1.6] italic",children:'"Skråmåla kommun har utsetts till ÅRETS KOMMUN 2025. Motivering: För innovativ platsutveckling, modigt cirkulärt tänkande (rondellen runt macken), nytänkande inom besöksnäring (misslyckad festival som blev succé), finansiell kreativitet (egen valuta) och exceptionell biologisk mångfald (anställd älg). Juryn har följt ert arbete med stor fascination."'}),u("p",{className:"text-[12px] leading-[1.5] mt-3 opacity-60",children:"Prisutdelning: Skråmåla torg, om 7 dagar. 50 journalister, 3 ministrar, SVT. Vi kommer och ser hur Sveriges mest innovativa kommun jobbar på plats. Vänligen var innovativa på plats."})]}),u("p",{children:'Lennart blev vit. Sen röd. Sen vit igen, vilket är hans tre standardlägen. "De tror att vi är... innovativa", viskade han.'}),u("p",{children:'Agneta sa: "Det värsta är att de har rätt. De vet bara inte att det var av misstag."'}),u("p",{children:"Samma eftermiddag sprang Lennart till macken. Han sprang. Igen. Andra gången på två kapitel, vilket i Skråmåla räknas som motionssatsning."}),u("p",{children:"Holger satt på ölbacken och sorterade kapsyler. Det lät som Riksbanken när den har dålig dag."}),u("p",{children:'"Holger! Vi har blivit Årets Kommun!"'}),u("p",{children:'"Grattis", sa Holger. "Vad är problemet?"'}),u("p",{children:'"Problemet är att 50 journalister, tre ministrar och SVT ska komma hit och titta på hur innovativa vi är i en vecka!"'}),u("p",{children:'Holger var tyst länge. Sen sa han: "Lennart, vi har ett större problem än att verka smarta. Vi måste verka normala."'}),u("p",{children:'Så föddes Projekt "Var Normal I Sju Dagar". Ledningsgrupp: Lennart, Agneta, Holger och Bengt, som omedelbart blev ordförande för normalitetsgruppen och tog fram en Powerpoint med ClipArt. Arbetsmaterial: en whiteboard från 1997 och en känsla av undergång.'}),p("div",{className:"bg-[#fff3d6] border border-[#e8c88a] p-5 my-8",children:[u("p",{className:"text-[12px] tracking-[0.18em] font-bold mb-3 opacity-60",children:"PROJEKTPLAN — VAR NORMAL I SJU DAGAR — HEMLIG — LAMINERA EJ"}),p("div",{className:"text-[14px] leading-[1.7] space-y-2",children:[p("p",{children:[u("span",{className:"font-bold",children:"1. Rondellen runt macken:"}),' Får absolut inte förklaras som den blev till. Lösning: "Medborgardialog i realtid. Vi ville testa cirkulär trafik med service i mitten."']}),p("p",{children:[u("span",{className:"font-bold",children:"2. Statyn som läcker:"})," Måste sluta läcka. Eller låtsas vara vattenkonst. Agneta köper fogskum. Bengt köper blå lampa."]}),p("p",{children:[u("span",{className:"font-bold",children:"3. Kenneth:"})," Arbetsmiljöverket kommer. Han måste ha byxor. Eller åtminstone slips. Bengt provar sin egen slips. Kenneth äter upp den. Vi provar med fluga. Kenneth ser ut som en professor som ångrar sitt yrkesval."]}),p("p",{children:[u("span",{className:"font-bold",children:"4. Valutan:"})," Göm allt. Agneta stoppar Daler-sedlarna i pappersåtervinningen. Kenneth har redan ätit upp hälften så det luktar sedel och ånger när han rapar."]}),p("p",{children:[u("span",{className:"font-bold",children:"5. Holgers mack:"}),' Får inte heta mack. Döps om till "Co-working space med fokus på korv och logistik". Holger skriver om menyn med Tipex.']})]})]}),u("p",{children:"Veckan kom. Som ett oväder. Som en revision fast med kameror."}),p("p",{children:[u("span",{className:"font-bold",children:"DAG 1:"}),' Allt går bra. Lennart har övat framför badrumsspegeln på att säga "hållbarhet" och "samverkan" i varje mening. "Vi har en hållbar samverkan kring vår hållbara samverkanshållbarhet", säger han till reportern från Dagens Samhälle. Hon nickar som om det betyder något. Holger har satt upp en skylt på macken: CO-WORKING HUB EST. 1978 — ARTISAN SAUSAGE & LOGISTICS. Ingen fattar, alla fotar.']}),p("p",{children:[u("span",{className:"font-bold",children:"DAG 2:"}),' SVT vill filma fotbollsplanen. "Visa er grönyteförvaltning". Kenneth ligger mitt på planen, exakt på straffpunkten, och vägrar flytta sig. Han har sovit där sedan han upptäckte att det är soligt. Lennart svettas. Bengt, som är snabb när det gäller att rädda något med ord, kliver fram: "Det här är vår nya strategi — minimal klippning, maximal vila. Biologisk mångfald behöver också ta en tupplur." Fotografen från SVT får tårar i ögonen. "Så naturnära! Så modigt att låta naturen bestämma!" Kenneth fiser i sömnen. Det luktar Daler.']}),p("p",{children:[u("span",{className:"font-bold",children:"DAG 3:"}),' Ministern kommer. Hon är från Stockholm, har vit skjorta och en medarbetare som skriver ner allt Lennart säger. Hon vill köpa korv på macken. Tar upp telefonen. "Kan jag Swisha?"']}),u("p",{children:'Holger, utan att blinka: "Vi tar bara Daler eller ägg."'}),u("p",{children:"Tystnad. Medarbetaren slutar skriva. Lennarts hela liv passerar förbi."}),u("p",{children:'Då kliver Lennart fram, med rösten från Jönköping-konferensen: "Det är en... eh... kontantfri pilot för cirkulär ekonomi där vi utforskar alternativa värdebärare och lokal resiliens. Ägg är extremt resilienta."'}),u("p",{children:'Ministern tittar på honom. Sen på Holger. Sen på Kenneth som står bakom macken i slips och ser ut som en chef som fått nog. Hon nickar långsamt och säger: "Intressant. Det där ska vi ta med till Rosenbad." Hon skriver ner ÄGG i versaler.'}),p("p",{children:[u("span",{className:"font-bold",children:"DAG 4:"}),' Direktsändning på Korvtorget. DN, SvD, P1. Lennart berättar om "vår kulturförhöjande offentliga gestaltning". Mitt i meningen — ',u("span",{className:"italic",children:"dropp"}),". Statyn börjar läcka igen. Svart olja rinner nerför falukorven, mitt i bild."]}),u("p",{children:"Lennart stelnar. Kameramannen zoomar in. Det här är slutet för Skråmåla."}),u("p",{children:"Holger går fram, lugn som en man som har släckt bränder med kaffe förut. Han tänder grillen som står bredvid — den gamla från 1974 med Elvis-fläcken — och ställer den under droppet. Oljan fräser."}),u("p",{children:'"Nu är det performance", säger han in i micken. "Vi smälter bort det gamla för att ge plats åt det nya. Det heter omställning."'}),u("p",{children:'Reportern från DN har tårar i ögonen. "Så starkt", viskar hon. "Så mycket samtid." Hon får med ljudet av fräs i sin podd. Den vinner pris.'}),p("p",{children:[u("span",{className:"font-bold",children:"DAG 5:"}),' Agneta skulle visa upp kommunens "styrande dokument". Hon råkar klicka fel — igen — och visar sin hemliga presentation där hon döpt om alla problem till attraktioner. På väggen, stort: "BUDGETUNDERSKOTT → UPPLEVELSE AV AUTENTICITET", "HÅL I VÄGEN UTANFÖR ICA → TRAFIKSÄKERHETSHÖJANDE RETARDATIONSEFFEKT", "AGNETAS RYGGONT → HÅLLBAR PERSONALNÄRVARO".']}),u("p",{children:"En ung journalist från Aftonbladet spärrar upp ögonen. Lennart tror att nu, nu åker vi dit. Han förbereder sig på att säga upp sig och börja sälja korv på riktigt."}),u("p",{children:'Men journalisten säger: "Äntligen en kommun som vågar vara transparent med sin storytelling! Äntligen någon som säger som det är — att ett underskott också är en berättelse!"'}),u("p",{children:'Agneta, som aldrig varit med om att få beröm för ett misstag hon gjort med flit: "Ja... vi... vi jobbar narrativt."'}),p("p",{children:[u("span",{className:"font-bold",children:"DAG 6:"})," Prisutdelning. Hela torget. Kenneth har fått en ny slips, för han åt upp den gamla. Den nya är av papper, laminerad av Bengt. Agneta har gömt Daler-högen så väl att hon själv inte hittar den. Holgers mack luktar som vanligt kaffe och gammal frityr, men nu står det WORK-LIFE-BALANCE 30 KR på svarta tavlan och alla tror det är ett koncept."]}),u("p",{children:"Lennart får en stor glasplakett. Den är tung, genomskinlig och helt omöjlig att ställa någonstans. På den står: ÅRETS KOMMUN 2025 — SKRÅMÅLA — FÖR MOD, INNOVATION OCH ÄLG. Plus en check på 100 000 kronor. Riktiga kronor. Agneta gråter nästan."}),p("p",{children:["Kenneth kliver fram för att gratulera. Han tror plaketten är is. Han slickar på den. Sen biter han. Sen äter han upp halva. ",u("span",{className:"italic",children:"Knastrar"}),". Glaset knastrar som knäckebröd."]}),u("p",{children:'Alla tystnar. Sen applåderar alla. "Innovativ återvinning av priset! Cirkulärt!" ropar ministern. SVT får sin slutbild. Kenneth rapar. Det luktar pengar.'}),u("p",{children:"På kvällen, när alla journalister åkt och rondellen äntligen får vara bara en rondell igen, sitter Lennart och Holger på macken. Plaketten ligger på bordet, eller det som är kvar av den. Halva, lite slickad."}),u("p",{children:'"Vi ljög ju hela veckan", säger Lennart. "Vi sa att allt var planerat."'}),u("p",{children:'Holger häller kaffe. Det är den där sorten som är så stark att den nästan är fast form. "Lennart", säger han, och nu säger han Lennart igen utan borgmästarn, "det är inte att ljuga. Det är att förklara efteråt varför det som råkade bli bra var meningen hela tiden. Det är så alla framgångsrika kommuner gör. Skillnaden är att vi är ärliga med att vi är oärliga."'}),u("p",{children:"Lennart tittar på resterna av priset. Kenneth ligger utanför och snarkar med en bit glasplakett som glittrar i pälsen."}),u("p",{children:'"Ska vi berätta sanningen någon gång?"'}),u("p",{children:'Holger petar i glöden med pinnen. "Nej. Men vi kan trycka upp det på en Daler-sedel så ingen tror på det."'}),u("p",{children:'Dagen efter får kommunen 20 mejl från andra
