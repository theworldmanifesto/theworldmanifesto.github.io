<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8fe3ff"/>
      <stop offset="45%" stop-color="#2fa8e0"/>
      <stop offset="100%" stop-color="#0d5fa8"/>
    </radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="sphereClip">
      <circle cx="50" cy="48" r="37"/>
    </clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="50" cy="90" rx="26" ry="6" fill="#0a1f33" opacity="0.35" filter="url(#blurShadow)"/>

  <!-- sphere -->
  <circle cx="50" cy="48" r="37" fill="url(#sphereGrad)"/>

  <!-- grid lines (clipped to sphere) -->
  <g clip-path="url(#sphereClip)" fill="none" stroke="#eaf8ff" stroke-width="2.2" opacity="0.9">
    <ellipse cx="50" cy="48" rx="13" ry="37"/>
    <ellipse cx="50" cy="48" rx="27" ry="37"/>
    <line x1="13" y1="48" x2="87" y2="48"/>
    <path d="M16 30 Q50 22 84 30"/>
    <path d="M16 66 Q50 74 84 66"/>
  </g>

  <!-- outline -->
  <circle cx="50" cy="48" r="37" fill="none" stroke="#083a63" stroke-width="2"/>

  <!-- glossy highlight -->
  <ellipse cx="37" cy="30" rx="16" ry="11" fill="url(#shine)"/>
</svg>
