svg_content = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="waveBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="foamWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="glossyHighlight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Back Wave -->
    <path d="M 120,310 C 180,250 250,290 320,250 C 390,210 430,270 430,340 C 430,390 380,430 250,430 C 120,430 90,360 120,310 Z" fill="#0284c7" opacity="0.5"/>
    
    <!-- Main Wave Body -->
    <path d="M 130,370 C 130,270 170,195 245,155 C 310,120 375,145 410,195 C 435,230 420,285 385,310 C 350,335 315,280 295,255 C 265,220 235,220 205,255 C 170,295 160,340 160,390 C 160,420 145,420 130,370 Z" fill="url(#waveBlue)" stroke="#0369a1" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Foam / Crest top -->
    <path d="M 410,195 C 385,160 335,140 285,148 C 265,151 255,165 268,178 C 281,191 305,182 325,195 C 345,208 385,225 410,195 Z" fill="url(#foamWhite)" stroke="#bae6fd" stroke-width="2"/>
    
    <!-- Glossy Highlight Overlay -->
    <path d="M 245,155 C 210,175 180,210 165,260 C 180,245 210,210 245,190 C 275,175 285,160 245,155 Z" fill="url(#glossyHighlight)"/>
  </g>
</svg>'''

with open("ocean.svg", "w", encoding="utf-8") as f:
    f.write(svg_content)
print("Ocean SVG generated successfully.")