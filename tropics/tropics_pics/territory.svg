<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="glossyRed" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ff8585"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="metalPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d1d5db"/>
      <stop offset="70%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Metallic Pin Tip pointing down -->
    <polygon points="235,260 265,260 250,440" fill="url(#metalPin)" stroke="#4b5563" stroke-width="2"/>
    
    <!-- Pushpin Head (Main sphere/cap) -->
    <circle cx="250" cy="180" r="90" fill="url(#glossyRed)" stroke="#991b1b" stroke-width="3"/>
    
    <!-- Specular Highlight for Glossy Plastic Look -->
    <ellipse cx="220" cy="140" rx="35" ry="20" transform="rotate(-30 220 140)" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>