                currentInfoItem.desc = data[lang].desc;
                
                document.getElementById('info-title').innerText = currentInfoItem.name;
                document.getElementById('info-desc').innerText = currentInfoItem.desc || (currentInfoItem.type === 'ocean' ? '' : 'Tropical destination');
                
                const texts = UI_TEXTS[lang];
                if (currentInfoItem.type === 'country') {
                    document.getElementById('info-badge').innerHTML = `🌎 ${texts.country}`;
                } else if (currentInfoItem.type === 'island') {
                    document.getElementById('info-badge').innerHTML = `🏝️ ${texts.island}`;
                } else if (currentInfoItem.type === 'territory') {
                    document.getElementById('info-badge').innerHTML = `📌 ${texts.territory}`;
                }
                
                document.querySelector('#climate-stat-container').innerHTML = `${texts.coldestMonth}<br><span id="info-coldest-temp" class="climate-val">${formatTemp(currentInfoItem.coldestWinter)}</span>`;
            }
        }
        
        // Switch language function
        function switchLanguage(lang) {
            currentLang = lang;
            
            // Rebuild PLACES array with new language
            const newPlaces = rebuildPlacesArray(lang);
            
            // Update existing place objects with new names and descriptions
            PLACES.forEach((place, idx) => {
                if (idx < newPlaces.length) {
                    place.name = newPlaces[idx].name;
                    place.desc = newPlaces[idx].desc;
                    place._data = PLACES_DATA[idx];
                    
                    // Update DOM element text
                    if (place.dom) {
                        place.dom.innerText = place.name;
                    }
                }
            });
            
            // Update UI texts
            updateUILanguage(lang);
            
            // Update info card if open
            if (currentInfoItem && currentInfoItem._data) {
                updateInfoCardLanguage(lang);
            }
        }

        // --- SEARCH FUNCTIONALITY ---
        const searchInput = document.getElementById('search-input');
        const autocompleteList = document.getElementById('autocomplete-list');
        
        function updateSearchResults() {
            const value = searchInput.value.toLowerCase().trim();
            autocompleteList.innerHTML = '';
            
            if (!value) {
                autocompleteList.style.display = 'none';
                return;
            }
            
            const searchablePlaces = PLACES.filter(p => p.type !== 'ocean');
            const matches = searchablePlaces.filter(place => 
                place.name.toLowerCase().includes(value)
            ).slice(0, 10);
            
            if (matches.length > 0) {
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.textContent = match.name;
                    div.addEventListener('click', function() {
                        searchInput.value = match.name;
                        autocompleteList.style.display = 'none';
                        stopTour();
                        openInfoCard(match);
                        flyToPlace(match);
                    });
                    autocompleteList.appendChild(div);
                });
                autocompleteList.style.display = 'block';
            } else {
                autocompleteList.style.display = 'none';
            }
        }
        
        // Language switcher - dropdown event
        const langDropdown = document.getElementById('lang-dropdown');
        langDropdown.addEventListener('change', (e) => {
            const lang = e.target.value;
            switchLanguage(lang);
            if (searchInput.value.trim()) {
                updateSearchResults();
            }
        });
        
        searchInput.addEventListener('input', updateSearchResults);
        
        document.addEventListener('click', function(e) {
            if (e.target !== searchInput && !autocompleteList.contains(e.target)) {
                autocompleteList.style.display = 'none';
            }
        });

        // --- THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1B0027');
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 12.5);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.8;
        controls.rotateSpeed = 0.8;
        controls.minDistance = 9.0;
        controls.maxDistance = 18.0;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(10, 15, 5);
        scene.add(dirLight);
        
        // --- GEMINI'S STARFIELD - no cubes, just beautiful points! ---
        function createStarfield() {
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ 
                color: 0xffffff,
                size: 0.15,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true
            });

            const starVertices = [];
            for (let i = 0; i < 5000; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                starVertices.push(x, y, z);
            }

            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
            return stars;
        }

        // Create the starfield
        const starField = createStarfield();

        // --- ROTATING SUN/PLANET (from DeepSeek version) ---
        const sunRadius = 0.65;
        const sunGeometrySphere = new THREE.SphereGeometry(sunRadius, 96, 96);
        
        // Canvas: 1150 × 400
        const textCanvas = document.createElement('canvas');
        textCanvas.width = 1150;
        textCanvas.height = 400;
        const ctx = textCanvas.getContext('2d');
        
        // Golden gradient background
        const gradient = ctx.createLinearGradient(0, 0, 0, textCanvas.height);
        gradient.addColorStop(0, '#FFD700');
        gradient.addColorStop(0.5, '#FFC107');
        gradient.addColorStop(1, '#FFD700');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, textCanvas.width, textCanvas.height);
        
        // Text settings
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#7A0000';
        ctx.font = 'bold 39px "Segoe UI", Arial, sans-serif';
        
        // Text: "✦   THE WORLD MANIFESTO   "
        const cleanText = "✦   THE WORLD MANIFESTO   ";
        ctx.fillText(cleanText, 30, textCanvas.height / 2);
        ctx.fillText(cleanText, 590, textCanvas.height / 2);
        
        // Create texture
        const sunTextTexture = new THREE.CanvasTexture(textCanvas);
        sunTextTexture.wrapS = THREE.ClampToEdgeWrapping;
        sunTextTexture.wrapT = THREE.ClampToEdgeWrapping;
        sunTextTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        sunTextTexture.minFilter = THREE.LinearMipmapLinearFilter;
        sunTextTexture.magFilter = THREE.LinearFilter;
        
        const sunMaterialTex = new THREE.MeshBasicMaterial({ 
            map: sunTextTexture,
            side: THREE.DoubleSide
        });
        
        const sunMesh = new THREE.Mesh(sunGeometrySphere, sunMaterialTex);
        const sunOrbitGroup = new THREE.Group();
        scene.add(sunOrbitGroup);
        sunMesh.position.set(8.5, 1.5, 0);
        sunOrbitGroup.add(sunMesh);

        // --- POLAR CAPS (from DeepSeek version) ---
        function createPolarCap(isNorth) {
            const capGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64, 0, Math.PI * 2, 0, (90 - 23.436) * Math.PI / 180);
            const capMat = new THREE.MeshBasicMaterial({
                color: 0xaae0ff,
                transparent: true,
                opacity: 0.0,
                side: THREE.DoubleSide
            });
            const cap = new THREE.Mesh(capGeo, capMat);
            if (!isNorth) cap.rotation.x = Math.PI;
            return cap;
        }
        
        // Globe
        const globeRadius = 5;
        const globeGroup = new THREE.Group();
        scene.add(globeGroup);
        const geometry = new THREE.SphereGeometry(globeRadius, 128, 128);
        const textureLoader = new THREE.TextureLoader();
        // ⚠️ REPLACE WITH YOUR OWN EARTH TEXTURE ⚠️
        const earthTex = textureLoader.load('earth-globe.png');
        const material = new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.5, metalness: 0.1 });
        const globeMesh = new THREE.Mesh(geometry, material);
        globeGroup.add(globeMesh);
        
        // Add polar caps to globe
        const northPolarCap = createPolarCap(true);
        const southPolarCap = createPolarCap(false);
        globeGroup.add(northPolarCap);
        globeGroup.add(southPolarCap);

        // Latitude lines
        function createSolidLatitudeLine(latitude, color) {
            const points = [];
            const radLat = (latitude * Math.PI) / 180;
            const y = globeRadius * Math.sin(radLat);
            const r = globeRadius * Math.cos(radLat);
            for (let i = 0; i <= 360; i++) {
                const theta = (i / 180) * Math.PI * 2;
                const x = -r * Math.sin(theta);
                const z = r * Math.cos(theta);
                points.push(new THREE.Vector3(x, y, z));
            }
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const lineMaterial = new THREE.LineBasicMaterial({ color: color });
            return new THREE.Line(lineGeometry, lineMaterial);
        }

        // --- EQUATOR - ENDAST HELDRAGEN LINJE (inga prickar) ---
        const equatorLat = 0;
        const radLatEq = (equatorLat * Math.PI) / 180;
        const yEq = globeRadius * Math.sin(radLatEq);
        const rEq = globeRadius * Math.cos(radLatEq);
        
        // Heldragen linje
        const equatorPoints = [];
        for (let i = 0; i <= 360; i++) {
            const theta = (i / 180) * Math.PI * 2;
            const x = -rEq * Math.sin(theta);
            const z = rEq * Math.cos(theta);
            equatorPoints.push(new THREE.Vector3(x, yEq, z));
        }
        const equatorGeometry = new THREE.BufferGeometry().setFromPoints(equatorPoints);
        const equatorMaterial = new THREE.LineBasicMaterial({ color: 0xffdd88, transparent: true, opacity: 0.3 });
        const equatorLine = new THREE.Line(equatorGeometry, equatorMaterial);
        globeGroup.add(equatorLine);
        // --- SLUT EQUATOR ---

        // Tropics - SOLID lines
        globeGroup.add(createSolidLatitudeLine(23.44, 0xff6666));
        globeGroup.add(createSolidLatitudeLine(-23.44, 0x77aaff));

        function latLonToVec(lat, lon, rad) {
            const phi = lat * Math.PI / 180;
            const theta = (180 - (lon - 90)) * Math.PI / 180;
            const x = -rad * Math.cos(phi) * Math.sin(theta);
            const y = rad * Math.sin(phi);
            const z = rad * Math.cos(phi) * Math.cos(theta);
            return new THREE.Vector3(x, y, z);
        }

        // Create labels
        const labelsContainer = document.getElementById('labels-container');
        PLACES.forEach(place => {
            const div = document.createElement('div');
            div.className = `globe-label label-${place.type}`;
            div.innerText = place.name;
            if (place.type !== 'ocean') {
                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    stopTour();
                    openInfoCard(place);
                    flyToPlace(place);
                });
            }
            labelsContainer.appendChild(div);
            const anchor = new THREE.Object3D();
            const pos = latLonToVec(place.lat, place.lon, globeRadius + 0.04);
            anchor.position.copy(pos);
            globeGroup.add(anchor);
            place.threeObj = anchor;
            place.dom = div;
        });

        // Fly-to animation
        let animating = false;
        let targetCamPos = null;
        let targetCtrlTarget = null;
        function flyToPlace(place) {
            const worldPos = place.threeObj.getWorldPosition(new THREE.Vector3());
            const dir = worldPos.clone().normalize();
            const distance = camera.position.length();
            targetCamPos = dir.multiplyScalar(distance);
            targetCtrlTarget = new THREE.Vector3(0,0,0);
            animating = true;
        }

        // Auto-rotate
        let autoRotateFlag = false;
        const rotateBtn = document.getElementById('rotate-btn');
        rotateBtn.addEventListener('click', () => {
            autoRotateFlag = !autoRotateFlag;
            const texts = UI_TEXTS[currentLang];
            if(autoRotateFlag) {
                rotateBtn.classList.add('active');
                rotateBtn.innerHTML = texts.rotateBtnActive;
                if(tourInterval) stopTour();
            } else {
                rotateBtn.classList.remove('active');
                rotateBtn.innerHTML = texts.rotateBtn;
            }
        });

        // Info Card
        const infoCard = document.getElementById('info-card');
        const infoTitle = document.getElementById('info-title');
        const infoBadge = document.getElementById('info-badge');
        const infoDesc = document.getElementById('info-desc');
        const climateStat = document.getElementById('climate-stat-container');
        
        function openInfoCard(item) {
            currentInfoItem = item;
            if(polarCard.style.display === 'block') polarCard.style.display = 'none';
            infoTitle.innerText = item.name;
            const texts = UI_TEXTS[currentLang];
            
            if(item.type === 'country') {
                infoBadge.innerHTML = `🌎 ${texts.country}`;
                infoBadge.className = 'badge country';
                infoDesc.innerText = item.desc || (item._data ? item._data[currentLang].desc : '');
                climateStat.style.display = 'block';
                document.querySelector('#climate-stat-container').innerHTML = `${texts.coldestMonth}<br><span id="info-coldest-temp" class="climate-val">${formatTemp(item.coldestWinter)}</span>`;
            } else if(item.type === 'island') {
                infoBadge.innerHTML = `🏝️ ${texts.island}`;
                infoBadge.className = 'badge island';
                infoDesc.innerText = item.desc || (item._data ? item._data[currentLang].desc : '');
                climateStat.style.display = 'block';
                document.querySelector('#climate-stat-container').innerHTML = `${texts.coldestMonth}<br><span id="info-coldest-temp" class="climate-val">${formatTemp(item.coldestWinter)}</span>`;
            } else if(item.type === 'territory') {
                infoBadge.innerHTML = `📌 ${texts.territory}`;
                infoBadge.className = 'badge territory';
                infoDesc.innerText = item.desc || (item._data ? item._data[currentLang].desc : '');
                climateStat.style.display = 'block';
                document.querySelector('#climate-stat-container').innerHTML = `${texts.coldestMonth}<br><span id="info-coldest-temp" class="climate-val">${formatTemp(item.coldestWinter)}</span>`;
            } else if(item.type === 'ocean') {
                infoBadge.innerHTML = `🌊 OCEAN`;
                infoBadge.className = 'badge';
                infoDesc.innerText = '';
                climateStat.style.display = 'none';
            }
            infoCard.style.display = 'block';
        }
        document.getElementById('info-close').addEventListener('click', () => { infoCard.style.display = 'none'; currentInfoItem = null; });

        // Tour System
        let tourInterval = null;
        let tourDestinations = PLACES.filter(p => p.type !== 'ocean');
        let visitedIdx = [];
        let currentTourDest = null;
        const tourBtn = document.getElementById('tour-btn');
        
        function getDistanceBetween(p1, p2) {
            const v1 = latLonToVec(p1.lat, p1.lon, 1);
            const v2 = latLonToVec(p2.lat, p2.lon, 1);
            return v1.distanceTo(v2);
        }
        
        function nextTourStep() {
            visitedIdx.push(currentTourDest);
            const texts = UI_TEXTS[currentLang];
            tourBtn.innerHTML = `🌐 ${visitedIdx.length}/${tourDestinations.length}`;
            flyToPlace(currentTourDest);
            openInfoCard(currentTourDest);
            if(visitedIdx.length >= tourDestinations.length) visitedIdx = [];
            let nearest = null;
            let minDist = Infinity;
            for(let d of tourDestinations) {
                if(visitedIdx.includes(d)) continue;
                const dist = getDistanceBetween(currentTourDest, d);
                if(dist < minDist) { minDist = dist; nearest = d; }
            }
            if(nearest) currentTourDest = nearest;
            else {
                visitedIdx = [];
                currentTourDest = tourDestinations[Math.floor(Math.random() * tourDestinations.length)];
            }
        }
        
        function startTour() {
            tourBtn.classList.add('active');
            visitedIdx = [];
            const rand = Math.floor(Math.random() * tourDestinations.length);
            currentTourDest = tourDestinations[rand];
            nextTourStep();
            tourInterval = setInterval(nextTourStep, 4800);
        }
        
        function stopTour() {
            if(tourInterval) { clearInterval(tourInterval); tourInterval = null; }
            tourBtn.classList.remove('active');
            const texts = UI_TEXTS[currentLang];
            tourBtn.innerHTML = texts.tourBtn;
        }
        tourBtn.addEventListener('click', () => { if(tourInterval) stopTour(); else startTour(); });

        // --- POLAR DETECTION (from DeepSeek version) ---
        const polarCard = document.getElementById('polar-card');
        const polarRecordDiv = document.getElementById('polar-record');
        const snowWeightSpan = document.getElementById('snow-weight');
        
        function updatePolarUI() {
            const cameraDirection = camera.position.clone().normalize();
            const threshold = 0.78;
            let polarActive = false;
            const texts = UI_TEXTS[currentLang];

            if (cameraDirection.y >= threshold) {
                polarActive = true;
                const intensity = (cameraDirection.y - threshold) / (1 - threshold);
                northPolarCap.material.opacity = intensity * 0.65;
                southPolarCap.material.opacity = 0;
                document.getElementById('polar-title').innerHTML = texts.polarArctic;
                const temp = -20.0 - (intensity * 20.0);
                document.getElementById('polar-temp').innerHTML = `${temp.toFixed(1)}°C`;
                polarRecordDiv.innerHTML = `<span class="record-normal">all-time cold record in 1991 </span><span class="record-temp">-69.6°C</span>`;
                document.getElementById('polar-desc').innerHTML = texts.polarArcticDesc;
                snowWeightSpan.innerText = "4 000 000 000 000";
            } else if (cameraDirection.y <= -threshold) {
                polarActive = true;
                const intensity = (Math.abs(cameraDirection.y) - threshold) / (1 - threshold);
                southPolarCap.material.opacity = intensity * 0.65;
                northPolarCap.material.opacity = 0;
                document.getElementById('polar-title').innerHTML = texts.polarAntarctic;
                const temp = -35.0 - (intensity * 30.0);
                document.getElementById('polar-temp').innerHTML = `${temp.toFixed(1)}°C`;
                polarRecordDiv.innerHTML = `<span class="record-normal">all-time cold record in 1983 </span><span class="record-temp">-89.2°C</span>`;
                document.getElementById('polar-desc').innerHTML = texts.polarAntarcticDesc;
                snowWeightSpan.innerText = "27 000 000 000 000 000";
            } else {
                northPolarCap.material.opacity = 0;
                southPolarCap.material.opacity = 0;
                polarRecordDiv.innerHTML = "";
                if (polarCard.style.display === 'block') {
                    polarCard.style.opacity = '0';
                    setTimeout(() => { if (polarCard.style.opacity === '0') polarCard.style.display = 'none'; }, 500);
                }
                return;
            }

            if (polarActive) {
                if (infoCard.style.display === 'block') { infoCard.style.display = 'none'; }
                polarCard.style.display = 'block';
                setTimeout(() => { polarCard.style.opacity = '1'; }, 10);
            }
        }

        // --- Animation Loop ---
        const vecHelper = new THREE.Vector3();
        function animate() {
            requestAnimationFrame(animate);
            if(autoRotateFlag && !animating && !tourInterval) {
                globeGroup.rotation.y += 0.003;
            }
            
            // Rotate the sun orbiter
            sunOrbitGroup.rotation.y += 0.003;
            
            // Stars rotate slowly
            starField.rotation.y += 0.00005;
            
            if(animating && targetCamPos) {
                camera.position.lerp(targetCamPos, 0.07);
                controls.target.lerp(targetCtrlTarget, 0.07);
                if(camera.position.distanceTo(targetCamPos) < 0.1) animating = false;
            }
            controls.update();
            updatePolarUI();
            
            PLACES.forEach(place => {
                if(!place.threeObj) return;
                const worldPos = place.threeObj.getWorldPosition(vecHelper);
                const dot = worldPos.clone().normalize().dot(camera.position.clone().normalize());
                if(dot < 0.15) { place.dom.style.display = 'none'; return; }
                worldPos.project(camera);
                const x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;
                place.dom.style.transform = `translate3d(${x}px, ${y}px, 0px) translate(-50%, -50%)`;
                place.dom.style.display = 'block';
            });
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initialize UI with English
        updateUILanguage('en');
        
        animate();
    </script>
</body>
</html>
