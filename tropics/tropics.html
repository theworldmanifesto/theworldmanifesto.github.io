<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The World Manifesto - Multilingual Tropical Globe | 3D Interactive Atlas</title>

    <!-- Global Menu CSS -->
    <link rel="stylesheet" href="../menu.css">

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background-color: #1B0027; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* --- ÖVRIGA UI-ELEMENT (nedre vänster, staplade) --- */
        .ui-element {
            position: fixed;
            z-index: 100;
            background: rgba(27, 0, 39, 0.85);
            color: #fff;
            border: 1px solid #4a154b;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        /* Språkmeny – längst ner */
        #language-selector {
            bottom: 10px;
            left: 10px;
            padding: 4px 8px;
            border-radius: 40px;
            background: rgba(27, 0, 39, 0.85);
            backdrop-filter: blur(8px);
            z-index: 110;
        }
        #lang-dropdown {
            background: rgba(27, 0, 39, 0.95);
            color: #fff;
            border: 1px solid #FFD700;
            border-radius: 30px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            outline: none;
            font-weight: 500;
        }
        #lang-dropdown:hover {
            background: #1B0027;
            border-color: #FFD700;
        }
        #lang-dropdown option {
            background: #1B0027;
            color: #fff;
        }
        
        /* Sökruta – ovanför språkmenyn */
        #search-panel {
            bottom: 70px;
            left: 10px;
            width: auto;
            min-width: 180px;
            max-width: 240px;
            padding: 5px 8px;
            border-radius: 40px;
            z-index: 100;
        }
        #search-input {
            width: 100%;
            padding: 5px 10px;
            border-radius: 30px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            font-size: 11px;
            outline: none;
        }
        #search-input:focus { border-color: #FFD700; }
        
        #autocomplete-list {
            background: #1f092a;
            border: 1px solid #4a154b;
            max-height: 160px;
            overflow-y: auto;
            position: absolute;
            width: calc(100% - 16px);
            left: 8px;
            margin-top: 6px;
            border-radius: 12px;
            display: none;
            z-index: 101;
        }
        .autocomplete-item {
            padding: 6px 10px;
            cursor: pointer;
            font-size: 11px;
            border-bottom: 1px solid #3a1a3f;
            color: #fff;
        }
        .autocomplete-item:hover { background: #ffd96633; }
        .autocomplete-item:last-child { border-bottom: none; }
        
        /* Kontrollpanel (knappar) – ovanför sökrutan */
        #control-panel {
            bottom: 120px;
            left: 10px;
            width: auto;
            padding: 5px 10px;
            display: flex;
            gap: 8px;
            border-radius: 40px;
        }
        .panel-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        #tour-btn { background: #059669; }
        #tour-btn.active { background: #e67e22; }
        #rotate-btn { background: #4b5563; }
        #rotate-btn.active { background: #3b82f6; }
        .panel-btn:active { transform: scale(0.95); }
        
        /* INFO-KORT */
        #info-card {
            top: 10px;
            right: 10px;
            width: 260px;
            max-width: calc(100vw - 20px);
            padding: 8px 12px;
            display: none;
            font-size: 11px;
            border-radius: 16px;
            z-index: 100;
        }
        #info-close { float: right; cursor: pointer; font-size: 16px; color: #aaa; line-height: 1; }
        #info-close:hover { color: #fff; }
        .badge {
            display: inline-block;
            padding: 2px 7px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .badge.country { background: #007bff; }
        .badge.island { background: #17a2b8; }
        .badge.territory { background: #8a2be2; }
        #info-title { margin: 0 0 5px 0; font-size: 1rem; }
        #info-desc { margin: 0; font-size: 10px; color: #ccc; line-height: 1.35; }
        .climate-stat {
            margin-top: 6px;
            padding-top: 5px;
            border-top: 1px solid #444;
            font-size: 9px;
            color: #FFD700;
        }
        .climate-val {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            font-family: monospace;
        }
        
        /* POLARKORT */
        #polar-card {
            top: 10px;
            right: 10px;
            width: 250px;
            max-width: calc(100vw - 20px);
            padding: 8px 12px;
            display: none;
            background: rgba(5, 25, 50, 0.96);
            border: 1px solid #4a90e2;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(74, 144, 226, 0.4);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        #polar-title { margin: 0 0 3px; font-size: 12px; }
        .polar-temp {
            font-size: 22px;
            font-weight: 800;
            color: #a5ecff;
            text-shadow: 0 0 10px rgba(165, 236, 255, 0.5);
            margin: 3px 0;
            font-family: monospace;
        }
        .polar-record { font-size: 8px; color: #cccccc; margin-top: 2px; }
        .record-normal { font-style: normal; }
        .record-temp { font-style: italic; }
        #polar-desc { margin: 3px 0 0; font-size: 10px; }
        .snow-mass {
            font-size: 10px;
            color: #ffffff;
            background: rgba(255,255,255,0.15);
            padding: 3px 8px;
            border-radius: 8px;
            margin-top: 5px;
            border-left: 3px solid #fff;
        }
        
        /* GLOBE-ETIKETTER */
        .globe-label {
            position: absolute;
            z-index: 15;
            pointer-events: auto;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
            display: none;
        }
        .label-country {
            color: #ffffff;
            font-weight: bold;
            font-size: 9px;
            background: rgba(0,0,0,0.65);
            padding: 1px 5px;
            border-radius: 16px;
            backdrop-filter: blur(2px);
            text-shadow: 1px 1px 1px #000;
            border-left: 2px solid gold;
        }
        .label-island {
            color: #a0e0ff;
            font-style: italic;
            font-size: 9px;
            background: rgba(0,0,0,0.55);
            padding: 1px 5px;
            border-radius: 16px;
            text-shadow: 1px 1px 1px #000;
        }
        .label-ocean {
            color: #6ba2ff;
            font-family: 'Times New Roman', Georgia, serif;
            font-style: italic;
            font-size: 10px;
            letter-spacing: 2px;
            pointer-events: none;
            font-weight: bold;
            background: none;
            text-shadow: 0px 0px 3px rgba(0,0,0,0.9);
        }
        
        @media (max-width: 600px) {
            .panel-btn { padding: 3px 10px; font-size: 9px; }
            #control-panel { gap: 5px; padding: 4px 8px; bottom: 115px; }
            #search-panel { min-width: 150px; padding: 4px 7px; bottom: 65px; }
            #search-input { font-size: 10px; padding: 4px 8px; }
            .globe-label { font-size: 8px; }
            .label-country, .label-island { padding: 1px 4px; }
            #language-selector { bottom: 8px; padding: 3px 6px; }
            #lang-dropdown { font-size: 9px; padding: 3px 6px; }
        }
        @media (max-width: 450px) {
            .panel-btn { padding: 3px 8px; font-size: 8px; }
            #lang-dropdown { font-size: 8px; padding: 2px 5px; }
        }
    </style>

    <script src="../tropics/Three_js_r128/three.min.js"></script>
    <script src="../tropics/Three_js_r128/OrbitControls.js"></script>
    <!-- Inläsning av centraliserad meny -->
    <script src="../menu.js"></script>
</head>
<body id="tropics-page">

    <!-- Behållare för dynamiskt genererad meny -->
    <div id="main-menu"></div>

    <div id="canvas-container"></div>
    <div id="labels-container" style="position: absolute; width:100%; height:100%; top:0; left:0; pointer-events:none; z-index:5;"></div>
    
    <!-- SPRÅKMENY (längst ner) -->
    <div id="language-selector" class="ui-element">
        <select id="lang-dropdown">
            <option value="en">🇬🇧 English</option>
            <option value="sv" selected>🇸🇪 Svenska</option>
            <option value="zh">🇨🇳 中文</option>
        </select>
    </div>
    
    <!-- SÖKRUTA (mitten) -->
    <div id="search-panel" class="ui-element">
        <input type="text" id="search-input" placeholder="Search tropical destination..." autocomplete="off">
        <div id="autocomplete-list"></div>
    </div>

    <!-- KONTROLLKNAPPAR (överst i gruppen) -->
    <div id="control-panel" class="ui-element">
        <button id="tour-btn" class="panel-btn">🌍 Round-Trip</button>
        <button id="rotate-btn" class="panel-btn">🔄 Rotate</button>
    </div>

    <div id="info-card" class="ui-element">
        <span id="info-close">×</span>
        <div id="info-badge" class="badge">Country</div>
        <h3 id="info-title">Name</h3>
        <p id="info-desc"></p>
        <div class="climate-stat" id="climate-stat-container">
            Coldest month:<br>
            <span id="info-coldest-temp" class="climate-val">--°C</span>
        </div>
    </div>

    <div id="polar-card" class="ui-element">
        <h3 id="polar-title">Polar Region</h3>
        <div id="polar-temp" class="polar-temp">-0.0°C</div>
        <div id="polar-record" class="polar-record"></div>
        <p id="polar-desc"></p>
        <div id="polar-snow" class="snow-mass">
            ❄️ Snow mass: <strong><span id="snow-weight">0</span> tons</strong>
        </div>
    </div>

        // Language Handling
        let currentLang = 'sv';

</body>
</html>
