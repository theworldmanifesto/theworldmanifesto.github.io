<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Vykort — Framsida</title>
<style>
    @font-face {
        font-family: 'Dancing Script';
        src: url('../fonts/DancingScript-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }
    @font-face {
        font-family: 'Dancing Script';
        src: url('../fonts/DancingScript-Bold.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
    }

    @page {
        size: 148.5mm 105mm;
        margin: 0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Arimo-VariableFont_wght', 'Roboto-Bold', Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #111111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 105mm;
        width: 148.5mm;
        text-align: center;
        padding: 10mm;
    }

    .innehall {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        height: 100%;
        width: 100%;
    }

    /* Översta delen: slogan + citat */
    .topp {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    .slogan {
        font-size: 16pt;
        font-weight: 900;
        line-height: 1.3;
        letter-spacing: -0.02em;
        margin-bottom: 8mm;
        text-transform: uppercase;
        color: #111111;
    }

    .subtext {
        font-family: 'EBGaramond-Regular', 'Georgia', serif;
        font-size: 11pt;
        font-style: italic;
        color: #444444;
        max-width: 90%;
    }

    /* Mitten: titel + linje + sökväg (alla grå) */
    .mitten {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    .manifesto-titel {
        font-family: 'Dancing Script', cursive;
        font-size: 24pt;
        font-weight: normal;
        color: #AAA;
        margin-bottom: 1.5mm;
    }

    .separator {
        width: 40mm;
        height: 0;
        border-top: 0.2mm solid #AAA;
        margin-bottom: 1.5mm;
    }

    .webbadress {
        font-size: 8pt;
        font-weight: normal;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #AAA;
    }

    /* Nedersta delen: QR-kod */
    .botten {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    .qr-block img {
        width: 20mm;
        height: 20mm;
        display: block;
    }

    .vattenstämpel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60mm;
        height: 60mm;
        opacity: 0.04;
        pointer-events: none;
        background-image: url('../pics/favicon.svg');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
    }

    @media print {
        body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
</style>
</head>
<body>
    <div class="vattenstämpel"></div>
    <div class="innehall">
        <div class="topp">
            <div class="slogan">
                Från skuld och slit<br>
                till frihet och överflöd.
            </div>
            <div class="subtext">
                "När maskinerna kan leverera allt gratis, är det inte längre ekonomi att ta betalt. Det är förtryck."
            </div>
        </div>
        <div class="mitten">
            <div class="manifesto-titel">The World Manifesto</div>
            <div class="separator"></div>
            <div class="webbadress">
                theworldmanifesto.github.io
            </div>
        </div>
        <div class="botten">
            <div class="qr-block">
                <img src="../qr/qr-worldmanifesto.svg" alt="QR">
            </div>
        </div>
    </div>
</body>
</html>
