<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Vykort — Framsida</title>
<style>
    @page {
        size: 148.5mm 105mm; /* Exakt vykortsformat */
        margin: 0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        /* Använder en av dina nedladdade typsnitt om tillgängligt, annars ett rent, kraftfullt systemtypsnitt */
        font-family: 'Arimo-VariableFont_wght', 'Roboto-Bold', Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #111111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 105mm;
        width: 148.5mm;
        text-align: center;
        padding: 10mm;
    }
    
    .innehall {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        width: 100%;
    }

    .slogan {
        font-size: 16pt;
        font-weight: 900; /* Extra fet för maximal kontrast utan bläckfyllnad */
        line-height: 1.3;
        letter-spacing: -0.02em;
        margin-bottom: 8mm;
        text-transform: uppercase;
    }

    .subtext {
        font-family: 'EBGaramond-Regular', 'Georgia', serif; /* Kontrast med ett elegant serif-typsnitt */
        font-size: 11pt;
        font-style: italic;
        color: #444444; /* Mörkgrå sparar lite bläck jämfört med helsvart, men är fortfarande läslig */
        margin-bottom: 12mm;
        max-width: 90%;
    }

    .webbadress {
        font-size: 10pt;
        font-weight: bold;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-top: 0.2mm solid #111;
        padding-top: 4mm;
        margin-top: auto; /* Pushar ner den mot botten */
    }

    /* Valfri: En minimalistisk, bläcksnål version av din ikon som vattenstämpel */
    .vattenstämpel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60mm;
        height: 60mm;
        opacity: 0.04; /* Nästan osynlig, kräver nästan inget bläck men ger djup */
        pointer-events: none;
        background-image: url('pics/favicon.svg'); /* Se till att sökvägen stämmer */
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
    }

    @media print {
        body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
</style>
</head>
<body>
    <div class="vattenstämpel"></div>
    <div class="innehall">
        <div class="slogan">
            Från skuld och slit<br>
            till frihet och överflöd.
        </div>
        <div class="subtext">
            "När maskinerna kan leverera allt gratis, är det inte längre ekonomi att ta betalt. Det är förtryck."
        </div>
        <div class="webbadress">
            theworldmanifesto.github.io
        </div>
    </div>
</body>
</html>
