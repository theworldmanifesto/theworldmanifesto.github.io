<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Vykort - Baksida</title>

<style>
@page {
    size: 148.5mm 105mm;
    margin: 0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    font-family: Georgia, "Times New Roman", serif;
}

.vykort {
    position: relative;
    width: 148.5mm;
    height: 105mm;
    background: white;
}

/* Frimärkesruta */
.frimarke {
    position: absolute;
    top: 5mm;
    right: 5mm;
    width: 25mm;
    height: 30mm;
    border: 0.3mm solid #000;
}

/* Adresslinjer */
.adresslinje {
    position: absolute;
    left: 90mm;
    right: 5mm;
    border-top: 0.3mm solid #000;
}

.l1 { top: 45mm; }
.l2 { top: 53mm; }
.l3 { top: 61mm; }
.l4 { top: 69mm; }

/* Mittlinje */
.mittlinje {
    position: absolute;
    top: 5mm;
    bottom: 5mm;
    left: 74.25mm;
    border-left: 0.3mm solid #ccc;
}

/* Sidtext */
.sidtext {
    position: absolute;
    left: 4mm;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg);
    transform-origin: left center;
    color: #888;
    font-size: 9pt;
    white-space: nowrap;
}
</style>
</head>

<body>

<div class="vykort">

    <div class="mittlinje"></div>

    <div class="frimarke"></div>

    <div class="adresslinje l1"></div>
    <div class="adresslinje l2"></div>
    <div class="adresslinje l3"></div>
    <div class="adresslinje l4"></div>

    <div class="sidtext">
        The World Manifesto · theworldmanifesto
