<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Vykort baksida - 4x A4</title>
<style>
    @page { size: 297mm 210mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #fff; }
    .ark { width: 297mm; height: 210mm; position: relative; background: #fff; }

    /* Klipplinjer */
    .skar-linje.vertikal { position: absolute; left: 148.5mm; top: 0; bottom: 0; width: 0; border-left: 0.35mm dashed #AAA; z-index:10; }
    .skar-linje.horisontell { position: absolute; top: 105mm; left: 0; right: 0; height: 0; border-top: 0.35mm dashed #AAA; z-index:10; }

    /* Vykort */
    .vykort { position: absolute; width: 148.5mm; height: 105mm; background: #fff; overflow: hidden; }

    /* Mittlinje */
    .mitt-linje { position: absolute; left: 64.25mm; top: 5mm; height: 85mm; width: 0; border-left: 0.3mm solid #111; z-index:1; }

    /* Roterad text */
    .roterad-text { position: absolute; left: 64.25mm; top: 47.5mm; transform: translate(-50%,-50%) rotate(-90deg); font-size: 6.8pt; color: #777; white-space: nowrap; letter-spacing: 0.3mm; background: #fff; padding: 1.5mm 0; z-index:2; }

    /* Frimärkesruta med mycket ljus "STAMP"-text */
    .frimarke {
        position: absolute;
        top: 5mm;
        right: 5mm;
        width: 25mm;
        height: 25mm;
        border: 0.3mm solid #111;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .frimarke::after {
        content: "STAMP";
        font-family: Georgia, serif;
        font-size: 6pt;
        color: #ddd;
        letter-spacing: 0.5mm;
        text-transform: uppercase;
    }

    /* Adresslinjer */
    .adress-linje { position: absolute; left: 70mm; right: 5mm; height: 0; border-top: 0.3mm solid #111; z-index:5; }
    .adress-linje.l1 { top: 50mm; }
    .adress-linje.l2 { top: 60mm; }
    .adress-linje.l3 { top: 70mm; }
    .adress-linje.l4 { top: 90mm; }

    /* Codierzone — tom 15 mm zon längst ned */
    .codierzone { position: absolute; left: 0; bottom: 0; width: 100%; height: 15mm; background: transparent; }
</style>
</head>
<body>
<div class="ark">
    <div class="skar-linje vertikal"></div>
    <div class="skar-linje horisontell"></div>

    <div class="vykort" style="top:0; left:0;">
        <div class="mitt-linje"></div>
        <div class="roterad-text">The World Manifesto · theworldmanifesto.github.io</div>
        <div class="frimarke"></div>
        <div class="adress-linje l1"></div>
        <div class="adress-linje l2"></div>
        <div class="adress-linje l3"></div>
        <div class="adress-linje l4"></div>
        <div class="codierzone"></div>
    </div>

    <div class="vykort" style="top:0; left:148.5mm;">
        <div class="mitt-linje"></div>
        <div class="roterad-text">The World Manifesto · theworldmanifesto.github.io</div>
        <div class="frimarke"></div>
        <div class="adress-linje l1"></div>
        <div class="adress-linje l2"></div>
        <div class="adress-linje l3"></div>
        <div class="adress-linje l4"></div>
        <div class="codierzone"></div>
    </div>

    <div class="vykort" style="top:105mm; left:0;">
        <div class="mitt-linje"></div>
        <div class="roterad-text">The World Manifesto · theworldmanifesto.github.io</div>
        <div class="frimarke"></div>
        <div class="adress-linje l1"></div>
        <div class="adress-linje l2"></div>
        <div class="adress-linje l3"></div>
        <div class="adress-linje l4"></div>
        <div class="codierzone"></div>
    </div>

    <div class="vykort" style="top:105mm; left:148.5mm;">
        <div class="mitt-linje"></div>
        <div class="roterad-text">The World Manifesto · theworldmanifesto.github.io</div>
        <div class="frimarke"></div>
        <div class="adress-linje l1"></div>
        <div class="adress-linje l2"></div>
        <div class="adress-linje l3"></div>
        <div class="adress-linje l4"></div>
        <div class="codierzone"></div>
    </div>
</div>
</body>
</html>
