        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        
        .outer {

          background: #EDE9E3;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 24px 16px 48px 16px;
          padding-top: var(--safe-area-inset-top, 24px);
          font-family: ui-sans-system, system-ui, -apple-system, sans-serif;
        }

        .topbar {
          width: 100%;
          max-width: 1122px;
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          margin-bottom: 18px;
          gap: 16px;
          flex-wrap: wrap;
        }

        .title-block h1 {
          font-family: Georgia, serif;
          font-size: 22px;
          line-height: 1.1;
          font-weight: 400;
          letter-spacing: -0.02em;
          margin: 0;
          color: #1a1a1a;
        }
        .title-block p {
          margin: 6px 0 0 0;
          font-size: 12.5px;
          line-height: 1.4;
          color: #6b6560;
          max-width: 34ch;
        }

        .sheet-viewport {
          width: 100%;
          max-width: 1122px;
          display: flex;
          justify-content: center;
          overflow: hidden;
        }

        .sheet-scaler {
          transform-origin: top center;
          flex-shrink: 0;
        }

        .ark {
          width: 297mm;
          height: 210mm;
          position: relative;
          background: #FFFFFF;
          box-shadow: 
            0 1px 2px rgba(0,0,0,0.06),
            0 8px 24px rgba(0,0,0,0.08),
            0 24px 48px rgba(0,0,0,0.06);
          overflow: hidden;
        }

        .skar-linje {
          position: absolute;
          pointer-events: none;
          z-index: 10;
        }
        .skar-linje.vertikal {
          top: 0;
          bottom: 0;
          left: 148.5mm;
          width: 0;
          border-left: 0.35mm dashed #999;
        }
        .skar-linje.horisontell {
          left: 0;
          right: 0;
          top: 105mm;
          height: 0;
          border-top: 0.35mm dashed #999;
        }

        .vykort {
          position: absolute;
          width: 148.5mm;
          height: 105mm;
          overflow: hidden;
          background: white;
        }

        /* mitt-linje: vertical solid line at 74.25mm, from 5mm to 90mm (stops at Codierzone top) */
        .mitt-linje {
          position: absolute;
          left: 74.25mm;
          top: 5mm;
          bottom: 15mm;
          width: 0;
          height: auto;
          border-left: 0.3mm solid #111;
          z-index: 1;
        }

        .roterad-text {
          position: absolute;
          left: 74.25mm;
          top: 47.5mm; /* centered in usable 5mm-90mm area: (5+90)/2 = 47.5mm */
          transform: translate(-50%, -50%) rotate(-90deg);
          transform-origin: center center;
          font-family: Georgia, serif;
          font-size: 9pt;
          color: #888;
          white-space: nowrap;
          letter-spacing: 0.5mm;
          line-height: 1;
          z-index: 2;
          background: white;
          padding: 2mm 0;
          user-select: text;
        }

        .frimarke {
          position: absolute;
          top: 5mm;
          right: 5mm;
          width: 30mm;
          height: 30mm;
          border: 0.3mm solid #111;
          z-index: 2;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .frimarke-inner {
          font-family: Georgia, serif;
          font-size: 6.5pt;
          color: #aaa;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          transform: rotate(0deg);
        }

        .adress-linje {
          position: absolute;
          left: 90mm;
          right: 5mm;
          height: 0;
          border-bottom: 0.3mm solid #111;
          z-index: 2;
        }
        /* exact measurements from bottom edge - card height 105mm */
        .adress-linje.l1 { top: 50mm; } /* 55mm from bottom */
        .adress-linje.l2 { top: 60mm; } /* 45mm from bottom, 10mm below l1 */
        .adress-linje.l3 { top: 70mm; } /* 35mm from bottom, 10mm below l2, 20mm above lowest */
        .adress-linje.l4 { top: 90mm; } /* 15mm from bottom - on top edge of Codierzone, 20mm below l3 */

        .codierzone {
          position: absolute;
          left: 0;
          bottom: 0;
          width: 100%;
          height: 15mm;
          background: rgba(240,240,240,0.55);
          border-top: 0.35mm dashed #bbb;
          z-index: 4;
          display: flex;
          align-items: center;
          justify-content: center;
          pointer-events: none;
        }
        .codierzone-label {
          font-family: ui-sans-system, system-ui, -apple-system, sans-serif;
          font-size: 6pt;
          line-height: 1;
          color: #9a9a9a;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          white-space: nowrap;
        }

        .safety-margin {
          position: absolute;
          top: 4mm;
          left: 4mm;
          right: 4mm;
          bottom: 4mm;
          border: 0.22mm dashed rgba(255,140,0,0.45);
          border-radius: 0.5mm;
          z-index: 0;
          pointer-events: none;
        }
        .safety-label {
          position: absolute;
          top: 4.5mm;
          left: 5mm;
          font-family: ui-sans-system, system-ui, sans-serif;
          font-size: 4.5pt;
          color: rgba(255,140,0,0.55);
          letter-spacing: 0.05em;
          text-transform: uppercase;
          z-index: 0;
          pointer-events: none;
        }

        /* optional faint corner marks for print alignment */
        .corner-mark {
          position: absolute;
          width: 3mm;
          height: 3mm;
          border-color: #999;
          border-style: solid;
          border-width: 0;
          z-index: 11;
          opacity: 0.5;
        }

        @media print {
          @page {
            size: A4 landscape;
            margin: 0;
          }
          html, body {
            background: white !important;
          }
          .outer {
            background: white !important;
            padding: 0 !important;
            min-height: auto !important;
            display: block !important;
          }
          .topbar { display: none !important; }
          .sheet-viewport {
            overflow: visible !important;
            max-width: none !important;
            display: block !important;
          }
          .sheet-scaler {
            transform: none !important;
            width: auto !important;
            height: auto !important;
          }
          .ark {
            box-shadow: none !important;
            width: 297mm !important;
            height: 210mm !important;
            margin: 0 !important;
          }
        }

        /* mobile refinement for the controls */
        @media (max-width: 640px) {
          .topbar {
            align-items: flex-start;
            flex-direction: column;
          }
          .title-block h1 { font-size: 20px; }
        }
