    <style>
        .language-name {
            font-family: 'Arimo', 'Arial', sans-serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            text-align: center;
        }
        .book-title {
            font-family: 'Dancing Script', cursive;
            font-size: 36pt;
            font-weight: normal;
            margin: 0 0 5px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        .book-subtitle {
            font-family: 'Homemade Apple', cursive;
            font-size: 13pt;
            font-weight: normal;
            margin: 0 0 10px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        .body-text {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(11pt, 2.5vw, 13pt);
            line-height: 1.6;
            margin: 10px 0;
            text-align: left;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #1a1a1a;
        }
        .flag-icon {
            display: inline-block;
            width: clamp(16px, 4vw, 24px);
            height: auto;
            vertical-align: middle;
        }
        #author-container {
            text-align: center;
            margin-top: 30px;
        }
        #author-container .author {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: 12pt;
            font-weight: bold;
            margin: 0;
        }
        .separator-line {
            border: none;
            border-top: 2px solid #ccc;
            max-width: 300px;
            margin: 25px auto;
        }
        .toc-title {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(16pt, 3vw, 20pt);
            font-weight: bold;
            text-align: center;
            margin: 30px 0 20px 0;
            color: #1a1a1a;
        }

.manifesto-table {
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    border-collapse: collapse;
    font-family: 'Gelasio', 'Georgia', serif;
    font-size: clamp(10pt, 2vw, 12pt);
    text-align: left;
    table-layout: fixed;
}
.manifesto-table th {
    font-weight: bold;
    padding: 10px 12px;
    border: 1px solid #ccc;
    text-align: center;
    width: 33.33%;
    word-wrap: break-word;
    white-space: normal;
    overflow-wrap: break-word;
    background-color: #f7f7f7;  /* ← NY: Väldigt ljusgrå */
}
.manifesto-table td {
    padding: 10px 12px;
    border: 1px solid #ccc;
    vertical-align: top;
    word-wrap: break-word;
    white-space: normal;
    overflow-wrap: break-word;
}
.manifesto-table td:first-child {
    font-weight: bold;
    text-align: center;
    width: 33.33%;
    word-wrap: break-word;
    white-space: normal;
    overflow-wrap: break-word;
}

        @media only screen and (max-width: 768px) {
            .book-title { font-size: 28pt !important; }
            .book-subtitle { font-size: 12pt !important; }
            .language-name { font-size: 9pt !important; }
            .body-text { padding: 0 15px; }
            .manifesto-table td, .manifesto-table th {
                padding: 6px 8px;
                font-size: 9pt;
            }
        }
        @media only screen and (max-width: 430px) {
            .book-title { font-size: 22pt !important; }
            .book-subtitle { font-size: 11pt !important; }
            .language-name { font-size: 8pt !important; }
            .manifesto-table td, .manifesto-table th {
                padding: 4px 6px;
                font-size: 8pt;
            }
        }
    </style>

        function getPreferredLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && languages[urlLang]) return urlLang;
            const browserLang = navigator.language || navigator.languages?.[0] || 'en';
            const langCode = browserLang.split('-')[0].toLowerCase();
            if (languages[langCode]) return langCode;
            return 'en';
        }

        const lang = getPreferredLanguage();
        const langData = languages[lang];

document.getElementById('flag-icon').src = langData.flag;

document.getElementById('language-label').textContent = langData.name;
document.getElementById('book-title').textContent = langData.title;
document.getElementById('book-subtitle').textContent = langData.subtitle;

        function getTranslation(langCode) {
            return tableTranslations[langCode] || tableTranslations['en'];
        }

function buildTable(translation) {
    if (!translation) return '<p class="body-text">Table translation not available.</p>';

    // ⭐ RUBRIKEN I BLÅTT
    let html = `<h2 style="font-family: 'Gelasio', 'Georgia', serif; font-size: clamp(16pt, 3vw, 20pt); font-weight: bold; text-align: center; margin: 30px 0 20px 0; color: #0055cc;">${translation.title}</h2>`;
    html += `<table class="manifesto-table"><thead><tr>`;
    html += `<th>${translation.col1}</th>`;
    html += `<th>${translation.col2}</th>`;
    html += `<th>${translation.col3}</th>`;
    html += `</tr></thead><tbody>`;

    translation.rows.forEach(row => {
        html += `<tr>`;
        html += `<td><strong>${row.gnr}</strong></td>`;
        html += `<td>${row.debt}</td>`;
        html += `<td>${row.share}</td>`;
        html += `</tr>`;
    });

    html += `</tbody></table>`;
    return html;
}

        // ============================================================
        // 3. LADDA TEXT – HOPPAR ÖVER TABELLEN I TEXTFILEN
        // ============================================================
        async function loadText() {
            try {
                const response = await fetch(`lang_texts/${lang}.txt`);
                if (!response.ok) throw new Error('Textfil saknas');
                const text = await response.text();

                const allLines = text.split('\n');
                const nonEmptyLines = allLines.filter(line => line.trim() !== '');

                const bodyContent = document.getElementById('body-content');
                let currentHtml = '';

                for (let i = 3; i < nonEmptyLines.length; i++) {
                    const line = nonEmptyLines[i].trim();

                    if (line === '') continue;

                    if (line === '--- START TABLE ---') {
                        while (i < nonEmptyLines.length && nonEmptyLines[i].trim() !== '--- END TABLE ---') {
                            i++;
                        }
                        const translation = getTranslation(lang);
                        currentHtml += buildTable(translation);
                        continue;
                    }

                    if (line.match(/^=+$/)) {
                        currentHtml += `<hr class="separator-line">`;
                    } else if (line.toLowerCase() === 'table of contents') {
                        currentHtml += `<h2 class="toc-title">${line}</h2>`;
                    } else if (line.startsWith('"') && line.endsWith('"')) {
                        currentHtml += `<p class="body-text" style="font-style: italic; text-align: center;">${line}</p>`;
                    } else if (line.toLowerCase() === 'to be done') {
                        currentHtml += `<h2 style="font-family: 'Dancing Script', cursive; font-size: clamp(20pt, 5vw, 32pt); font-weight: normal; text-align: center; margin: 40px 0 20px 0; color: #1a1a1a;">${line}</h2>`;
                    } else if (line === line.toUpperCase() && line.length > 3 && !line.includes(' ')) {
                        currentHtml += `<p class="body-text">${line}</p>`;
                    } else {
                        currentHtml += `<p class="body-text">${line}</p>`;
                    }
                }

                bodyContent.innerHTML = currentHtml;

            } catch (error) {
                console.error('Fel vid laddning:', error);
                document.getElementById('body-content').innerHTML = '<p class="body-text">Text could not be loaded.</p>';
            }
        }

        loadText();

        if (typeof getAuthorHTML === 'function') {
            document.getElementById('author-container').innerHTML = getAuthorHTML();
        }
    </script>
