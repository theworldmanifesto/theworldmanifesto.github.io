<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The World Manifesto</title>
    <link rel="stylesheet" href="css/lang.css">
    <style>
        .language-name {
            font-family: 'Arimo', 'Arial', sans-serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            text-align: center;
        }
        .book-title {
            font-family: 'Dancing Script', cursive;
            font-size: 36pt;
            font-weight: normal;
            margin: 0 0 5px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        .book-subtitle {
            font-family: 'Homemade Apple', cursive;
            font-size: 13pt;
            font-weight: normal;
            margin: 0 0 10px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        .body-text {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(11pt, 2.5vw, 13pt);
            line-height: 1.6;
            margin: 10px 0;
            text-align: left;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #1a1a1a;
        }
        .flag-icon {
            display: inline-block;
            width: clamp(16px, 4vw, 24px);
            height: auto;
            vertical-align: middle;
        }
        #author-container {
            text-align: center;
            margin-top: 30px;
        }
        #author-container .author {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: 12pt;
            font-weight: bold;
            margin: 0;
        }
        .separator-line {
            border: none;
            border-top: 2px solid #ccc;
            max-width: 300px;
            margin: 25px auto;
        }
        .toc-title {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(16pt, 3vw, 20pt);
            font-weight: bold;
            text-align: center;
            margin: 30px 0 20px 0;
            color: #1a1a1a;
        }
        .manifesto-table {
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
            border-collapse: collapse;
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(10pt, 2vw, 12pt);
            text-align: left;
            table-layout: fixed;
        }
        .manifesto-table th {
            font-weight: bold;
            padding: 10px 12px;
            border: 1px solid #ccc;
            text-align: center;
            width: 33.33%;
        }
        .manifesto-table td {
            padding: 10px 12px;
            border: 1px solid #ccc;
            vertical-align: top;
        }
        .manifesto-table td:first-child {
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            width: 33.33%;
        }
        @media only screen and (max-width: 768px) {
            .book-title { font-size: 28pt !important; }
            .book-subtitle { font-size: 12pt !important; }
            .language-name { font-size: 9pt !important; }
            .body-text { padding: 0 15px; }
            .manifesto-table td, .manifesto-table th {
                padding: 6px 8px;
                font-size: 9pt;
            }
        }
        @media only screen and (max-width: 430px) {
            .book-title { font-size: 22pt !important; }
            .book-subtitle { font-size: 11pt !important; }
            .language-name { font-size: 8pt !important; }
            .manifesto-table td, .manifesto-table th {
                padding: 4px 6px;
                font-size: 8pt;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <p class="language-name" id="language-name">
            <img id="flag-icon" src="" alt="" class="flag-icon" width="20" height="auto">
            <span id="language-label"></span>
        </p>
        <br>
        <h1 class="book-title" id="book-title">The World Manifesto</h1>
        <h2 class="book-subtitle" id="book-subtitle">The Manifesto for Definitive Abundance</h2>
        <br>
        <div id="author-container"></div>
        <br>
        <div id="body-content"></div>
    </div>

    <script src="js/author.js"></script>
    <script>
        // ============================================================
        // 1. SPRÅKDATA – 42 språk
        // ============================================================
        const languages = {
            'sv': { flag: 'flags/se.svg', name: 'Svenska' },
            'en': { flag: 'flags/gb.svg', name: 'English' },
            'zh': { flag: 'flags/cn.svg', name: '简体中文' },
            'hi': { flag: 'flags/in.svg', name: 'हिन्दी' },
            'es': { flag: 'flags/es.svg', name: 'Español' },
            'fr': { flag: 'flags/fr.svg', name: 'Français' },
            'ar': { flag: 'flags/sa.svg', name: 'العربية' },
            'id': { flag: 'flags/id.svg', name: 'Bahasa Indonesia' },
            'bn': { flag: 'flags/bd.svg', name: 'বাংলা' },
            'pt': { flag: 'flags/pt.svg', name: 'Português' },
            'ru': { flag: 'flags/ru.svg', name: 'Русский' },
            'uk': { flag: 'flags/ua.svg', name: 'Українська' },
            'bg': { flag: 'flags/bg.svg', name: 'Български' },
            'ur': { flag: 'flags/pk.svg', name: 'اردو' },
            'ja': { flag: 'flags/jp.svg', name: '日本語' },
            'tl': { flag: 'flags/ph.svg', name: 'Filipino' },
            'de': { flag: 'flags/de.svg', name: 'Deutsch' },
            'ko': { flag: 'flags/kr.svg', name: '한국어' },
            'th': { flag: 'flags/th.svg', name: 'ไทย' },
            'vi': { flag: 'flags/vn.svg', name: 'Tiếng Việt' },
            'tr': { flag: 'flags/tr.svg', name: 'Türkçe' },
            'fa': { flag: 'flags/ir.svg', name: 'فارسی' },
            'sw': { flag: 'flags/tz.svg', name: 'Kiswahili' },
            'it': { flag: 'flags/it.svg', name: 'Italiano' },
            'pl': { flag: 'flags/pl.svg', name: 'Polski' },
            'nl': { flag: 'flags/nl.svg', name: 'Nederlands' },
            'ro': { flag: 'flags/ro.svg', name: 'Română' },
            'el': { flag: 'flags/gr.svg', name: 'Ελληνικά' },
            'af': { flag: 'flags/za.svg', name: 'Afrikaans' },
            'zu': { flag: 'flags/za.svg', name: 'isiZulu' },
            'xh': { flag: 'flags/za.svg', name: 'isiXhosa' },
            'cs': { flag: 'flags/cz.svg', name: 'Čeština' },
            'hu': { flag: 'flags/hu.svg', name: 'Magyar' },
            'he': { flag: 'flags/il.svg', name: 'עברית' },
            'crs': { flag: 'flags/sc.svg', name: 'Seselwa' },
            'se': { flag: 'flags/dsg.svg', name: 'Davvisámegiella' },
            'fit': { flag: 'flags/fit.svg', name: 'Meänkieli' },
            'no': { flag: 'flags/no.svg', name: 'Norsk' },
            'fi': { flag: 'flags/fi.svg', name: 'Suomi' },
            'da': { flag: 'flags/dk.svg', name: 'Dansk' },
            'is': { flag: 'flags/is.svg', name: 'Íslenska' },
            'fo': { flag: 'flags/fo.svg', name: 'Føroyskt' }
        };

        function getPreferredLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && languages[urlLang]) return urlLang;
            const browserLang = navigator.language || navigator.languages?.[0] || 'en';
            const langCode = browserLang.split('-')[0].toLowerCase();
            if (languages[langCode]) return langCode;
            return 'en';
        }

        const lang = getPreferredLanguage();
        const langData = languages[lang];

        document.getElementById('flag-icon').src = langData.flag;
        document.getElementById('flag-icon').alt = langData.name;
        document.getElementById('language-label').textContent = langData.name;

        // ============================================================
        // 2. TABELLÖVERSÄTTNINGAR – lägg till språk här
        // ============================================================
        const tableTranslations = {
            'en': {
                title: 'The Freedom Staircase: From Debt to Sovereignty',
                col1: 'Gross National Resource (GNR)',
                col2: 'Debt Write-Off<br>(According to Constitutional Law)',
                col3: 'Sovereignty Share<br>(State Payout)',
                rows: [
                    { gnr: '25 %<br>(Basic Food, Energy & Electricity)', debt: '25 % of all private debts are written off immediately.', share: 'First payout is activated.<br>Citizens receive purchasing power for what is not yet free.' },
                    { gnr: '50 %<br>(Housing & Transport)', debt: '50 % of all remaining debts are written off.', share: 'The share increases in proportion to the national robot park\'s production capacity.' },
                    { gnr: '75 %<br>(Technology, Premium & Education)', debt: '75 % of all debts are written off from the banks\' books.', share: 'The share is optimized. The need for money drops dramatically as the luxury sphere shrinks.' },
                    { gnr: '100 %<br>(The Definitive Abundance)', debt: 'All debts and money have ceased to exist.', share: 'System complete. Currencies become obsolete; a total free economy prevails.' }
                ]
            },
            'sv': {
                title: 'Frihetstrappan: Från skuld till suveränitet',
                col1: 'Bruttonationalresurs (GNR)',
                col2: 'Skuldavskrivning<br>(Enligt konstitutionell lag)',
                col3: 'Suveränitetsandel<br>(Statlig utbetalning)',
                rows: [
                    { gnr: '25 %<br>(Basmat, Energi & El)', debt: '25 % av alla privata skulder skrivs av omedelbart.', share: 'Första utbetalningen aktiveras.<br>Medborgarna får köpkraft för det som ännu inte är gratis.' },
                    { gnr: '50 %<br>(Bostäder & Transport)', debt: '50 % av alla återstående skulder skrivs av.', share: 'Andelen ökar i proportion till den nationella robotparkens produktionskapacitet.' },
                    { gnr: '75 %<br>(Teknik, Premium & Utbildning)', debt: '75 % av alla skulder skrivs av från bankernas böcker.', share: 'Andelen optimeras. Behovet av pengar minskar dramatiskt när lyxsfären krymper.' },
                    { gnr: '100 %<br>(Det Definitiva Överflödet)', debt: 'Alla skulder och pengar har upphört att existera.', share: 'Systemet är komplett. Valutor blir föråldrade; en total fri ekonomi råder.' }
                ]
            },
            'es': {
                title: 'La Escalera de la Libertad: De la Deuda a la Soberanía',
                col1: 'Recurso Nacional Bruto (GNR)',
                col2: 'Condonación de Deuda<br>(Según la Ley Constitucional)',
                col3: 'Participación Soberana<br>(Pago del Estado)',
                rows: [
                    { gnr: '25 %<br>(Alimentos Básicos, Energía & Electricidad)', debt: 'El 25 % de todas las deudas privadas se cancela inmediatamente.', share: 'Se activa el primer pago.<br>Los ciudadanos reciben poder adquisitivo para lo que aún no es gratuito.' },
                    { gnr: '50 %<br>(Vivienda & Transporte)', debt: 'El 50 % de todas las deudas restantes se cancela.', share: 'La participación aumenta en proporción a la capacidad de producción del parque robótico nacional.' },
                    { gnr: '75 %<br>(Tecnología, Premium & Educación)', debt: 'El 75 % de todas las deudas se cancela de los libros de los bancos.', share: 'La participación se optimiza. La necesidad de dinero disminuye drásticamente a medida que se reduce la esfera del lujo.' },
                    { gnr: '100 %<br>(La Abundancia Definitiva)', debt: 'Todas las deudas y el dinero han dejado de existir.', share: 'Sistema completo. Las monedas se vuelven obsoletas; prevalece una economía totalmente libre.' }
                ]
            },
            'de': {
                title: 'Die Freiheitstreppe: Von der Schulden zur Souveränität',
                col1: 'Bruttonationalressource (GNR)',
                col2: 'Schuldenerlass<br>(Nach Verfassungsrecht)',
                col3: 'Souveränitätsanteil<br>(Staatliche Auszahlung)',
                rows: [
                    { gnr: '25 %<br>(Grundnahrung, Energie & Strom)', debt: '25 % aller privaten Schulden werden sofort erlassen.', share: 'Die erste Auszahlung wird aktiviert.<br>Die Bürger erhalten Kaufkraft für das, was noch nicht kostenlos ist.' },
                    { gnr: '50 %<br>(Wohnen & Verkehr)', debt: '50 % aller verbleibenden Schulden werden erlassen.', share: 'Der Anteil steigt proportional zur Produktionskapazität des nationalen Roboterparks.' },
                    { gnr: '75 %<br>(Technologie, Premium & Bildung)', debt: '75 % aller Schulden werden aus den Büchern der Banken gestrichen.', share: 'Der Anteil wird optimiert. Der Geldbedarf sinkt dramatisch, da die Luxussphäre schrumpft.' },
                    { gnr: '100 %<br>(Der Definitive Überfluss)', debt: 'Alle Schulden und Geld haben aufgehört zu existieren.', share: 'System abgeschlossen. Währungen werden obsolet; eine völlig freie Wirtschaft herrscht.' }
                ]
            },
            // 🆕 För övriga språk: använd 'en' som standard (fallback)
            // Du kan lägga till fler språk här genom att kopiera strukturen ovan
        };

        // Fallback: om språket inte finns, använd engelska
        function getTranslation(langCode) {
            return tableTranslations[langCode] || tableTranslations['en'];
        }

        // ============================================================
        // 3. FUNKTION FÖR ATT BYGGA TABELLEN
        // ============================================================
        function buildTable(translation) {
            if (!translation) return '<p class="body-text">Table translation not available.</p>';
            
            let html = `<h2 style="font-family: 'Gelasio', 'Georgia', serif; font-size: clamp(16pt, 3vw, 20pt); font-weight: bold; text-align: center; margin: 30px 0 20px 0; color: #1a1a1a;">${translation.title}</h2>`;
            html += `<table class="manifesto-table"><thead><tr>`;
            html += `<th>${translation.col1}</th>`;
            html += `<th>${translation.col2}</th>`;
            html += `<th>${translation.col3}</th>`;
            html += `</tr></thead><tbody>`;
            
            translation.rows.forEach(row => {
                html += `<tr>`;
                html += `<td><strong>${row.gnr}</strong></td>`;
                html += `<td>${row.debt}</td>`;
                html += `<td>${row.share}</td>`;
                html += `</tr>`;
            });
            
            html += `</tbody></table>`;
            return html;
        }

        // ============================================================
        // 4. LADDA TEXT – HOPPAR ÖVER TABELLEN I TEXTFILEN
        // ============================================================
        async function loadText() {
            try {
                const response = await fetch(`lang_texts/${lang}.txt`);
                if (!response.ok) throw new Error('Textfil saknas');
                const text = await response.text();

                const allLines = text.split('\n');
                const nonEmptyLines = allLines.filter(line => line.trim() !== '');

                const bodyContent = document.getElementById('body-content');
                let currentHtml = '';

                // Hoppa över de 3 första icke-tomma raderna
                for (let i = 3; i < nonEmptyLines.length; i++) {
                    const line = nonEmptyLines[i].trim();

                    if (line === '') continue;

                    // --- TABELL: HOPPA ÖVER och ersätt med hårdkodad ---
                    if (line === '--- START TABLE ---') {
                        // Hoppa över alla rader fram till --- END TABLE ---
                        while (i < nonEmptyLines.length && nonEmptyLines[i].trim() !== '--- END TABLE ---') {
                            i++;
                        }
                        // Lägg till den hårdkodade tabellen (översatt till rätt språk)
                        const translation = getTranslation(lang);
                        currentHtml += buildTable(translation);
                        continue;
                    }

                    // --- Övrig formatering ---
                    if (line.match(/^=+$/)) {
                        currentHtml += `<hr class="separator-line">`;
                    } else if (line.toLowerCase() === 'table of contents') {
                        currentHtml += `<h2 class="toc-title">${line}</h2>`;
                    } else if (line.startsWith('"') && line.endsWith('"')) {
                        currentHtml += `<p class="body-text" style="font-style: italic; text-align: center;">${line}</p>`;
                    } else if (line.toLowerCase() === 'to be done') {
                        currentHtml += `<h2 style="font-family: 'Dancing Script', cursive; font-size: clamp(20pt, 5vw, 32pt); font-weight: normal; text-align: center; margin: 40px 0 20px 0; color: #1a1a1a;">${line}</h2>`;
                    } else if (line === line.toUpperCase() && line.length > 3 && !line.includes(' ')) {
                        currentHtml += `<p class="body-text">${line}</p>`;
                    } else {
                        currentHtml += `<p class="body-text">${line}</p>`;
                    }
                }

                bodyContent.innerHTML = currentHtml;

            } catch (error) {
                console.error('Fel vid laddning:', error);
                document.getElementById('body-content').innerHTML = '<p class="body-text">Text could not be loaded.</p>';
            }
        }

        loadText();

        if (typeof getAuthorHTML === 'function') {
            document.getElementById('author-container').innerHTML = getAuthorHTML();
        }
    </script>
</body>
</html>
