<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The World Manifesto</title>
    <link rel="stylesheet" href="css/lang.css">
</head>
<body>
    <div class="page-container">
        <p class="language-name" id="language-name">
            <img id="flag-icon" src="" alt="" class="flag-icon" width="20" height="auto">
            <span id="language-label"></span>
        </p>
        <br><br>
        <h1 class="book-title" id="book-title">The World Manifesto</h1>
        <br>
        <p class="body-text" id="body-text"></p>
        <div id="author-container"></div>
    </div>

    <script src="js/author.js"></script>
    <script>
        // ALLA 42 SPRÅK med korrekta flaggor
        const languages = {
'sv': { flag: 'flags/sv.svg', name: 'Swedish (Svenska)' },
'en': { flag: 'flags/en.svg', name: 'English' },
'zh': { flag: 'flags/zh.svg', name: 'Chinese (简体中文)' },
'hi': { flag: 'flags/hi.svg', name: 'Hindi (हिंदी)' },
'es': { flag: 'flags/es.svg', name: 'Spanish (Español)' },
'fr': { flag: 'flags/fr.svg', name: 'French (Français)' },
'ar': { flag: 'flags/ar.svg', name: 'Arabic (العربية)' },
'id': { flag: 'flags/id.svg', name: 'Indonesian (Bahasa Indonesia)' },
'bn': { flag: 'flags/bn.svg', name: 'Bengali (বাংলা)' },
'pt': { flag: 'flags/pt.svg', name: 'Portuguese (Português)' },
'ru': { flag: 'flags/ru.svg', name: 'Russian (Русский)' },
'uk': { flag: 'flags/uk.svg', name: 'Ukrainian (Українська)' },
'bg': { flag: 'flags/bg.svg', name: 'Bulgarian (Български)' },
'ur': { flag: 'flags/ur.svg', name: 'Urdu (اردو)' },
'ja': { flag: 'flags/ja.svg', name: 'Japanese (日本語)' },
'tl': { flag: 'flags/tl.svg', name: 'Filipino' },
'de': { flag: 'flags/de.svg', name: 'German (Deutsch)' },
'ko': { flag: 'flags/ko.svg', name: 'Korean (한국어)' },
'th': { flag: 'flags/th.svg', name: 'Thai (ภาษาไทย)' },
'vi': { flag: 'flags/vi.svg', name: 'Vietnamese (Tiếng Việt)' },
'tr': { flag: 'flags/tr.svg', name: 'Turkish (Türkçe)' },
'fa': { flag: 'flags/fa.svg', name: 'Persian (فارسی)' },
'sw': { flag: 'flags/sw.svg', name: 'Swahili' },
'it': { flag: 'flags/it.svg', name: 'Italian (Italiano)' },
'pl': { flag: 'flags/pl.svg', name: 'Polish (Polski)' },
'nl': { flag: 'flags/nl.svg', name: 'Dutch (Nederlands)' },
'ro': { flag: 'flags/ro.svg', name: 'Romanian (Română)' },
'el': { flag: 'flags/el.svg', name: 'Greek (Ελληνικά)' },
'af': { flag: 'flags/af.svg', name: 'Afrikaans' },
'zu': { flag: 'flags/zu.svg', name: 'Zulu (isiZulu)' },
'xh': { flag: 'flags/xh.svg', name: 'Xhosa (isiXhosa)' },
'cs': { flag: 'flags/cs.svg', name: 'Czech (Čeština)' },
'hu': { flag: 'flags/hu.svg', name: 'Hungarian (Magyar)' },
'he': { flag: 'flags/he.svg', name: 'Hebrew (עברית)' },
'crs': { flag: 'flags/crs.svg', name: 'Seychellois Creole (Seselwa)' },
'se': { flag: 'flags/dsg.svg', name: 'Northern Sami (Davvisámegiella)' },
'fit': { flag: 'flags/fit.svg', name: 'Meänkieli (Tornedalian)' },
'no': { flag: 'flags/no.svg', name: 'Norwegian (Norsk)' },
'fi': { flag: 'flags/fi.svg', name: 'Finnish (Suomi)' },
'da': { flag: 'flags/da.svg', name: 'Danish (Dansk)' },
'is': { flag: 'flags/is.svg', name: 'Icelandic (Íslenska)' },
'fo': { flag: 'flags/fo.svg', name: 'Faroese (Føroyskt)' }
        };

        // Automatisk språkdetektering
        function getPreferredLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && languages[urlLang]) {
                return urlLang;
            }

            const browserLang = navigator.language || navigator.languages?.[0] || 'en';
            const langCode = browserLang.split('-')[0].toLowerCase();

            if (languages[langCode]) {
                return langCode;
            }

            return 'en';
        }

        const lang = getPreferredLanguage();
        const langData = languages[lang];

        document.getElementById('flag-icon').src = langData.flag;
        document.getElementById('flag-icon').alt = langData.name;
        document.getElementById('language-label').textContent = langData.name;

        async function loadText() {
            try {
                const response = await fetch(`lang_texts/${lang}.txt`);
                if (!response.ok) throw new Error('Textfil saknas');
                const text = await response.text();
                
                const lines = text.split('\n').filter(line => line.trim() !== '');
                if (lines.length >= 2) {
                    document.getElementById('book-title').textContent = lines[0].trim();
                    document.getElementById('body-text').innerHTML = lines.slice(1).join('<br>');
                }
            } catch (error) {
                console.error('Fel vid laddning:', error);
                document.getElementById('book-title').textContent = 'The World Manifesto';
                document.getElementById('body-text').textContent = 'Text could not be loaded.';
            }
        }

        loadText();
        if (typeof getAuthorHTML === 'function') {
            document.getElementById('author-container').innerHTML = getAuthorHTML();
        }
    </script>
</body>
</html>
