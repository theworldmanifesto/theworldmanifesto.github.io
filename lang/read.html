<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The World Manifesto</title>
    <link rel="stylesheet" href="css/lang.css">
</head>
<body>
    <div class="page-container">
        <p class="language-name" id="language-name">
            <img id="flag-icon" src="" alt="" class="flag-icon" width="20" height="auto">
            <span id="language-label"></span>
        </p>
        <br><br>
        <h1 class="book-title" id="book-title">The World Manifesto</h1>
        <br>
        <p class="body-text" id="body-text"></p>
        <div id="author-container"></div>
    </div>

    <script src="js/author.js"></script>
    <script>
        // ALLA 42 SPRÅK med korrekta flaggor
        const languages = {
'sv': { flag: 'flags/se.svg', name: 'Svenska (Swedish)' },
'en': { flag: 'flags/en.svg', name: 'English' },
'zh': { flag: 'flags/ch.svg', name: '简体中文 (Chinese)' },
'hi': { flag: 'flags/in.svg', name: 'हिंदी (Hindi)' },
'es': { flag: 'flags/es.svg', name: 'Español (Spanish)' },
'fr': { flag: 'flags/fr.svg', name: 'Français (French)' },
'ar': { flag: 'flags/sa.svg', name: 'العربية (Arabic)' },
'id': { flag: 'flags/id.svg', name: 'Bahasa Indonesia (Indonesian)' },
'bn': { flag: 'flags/bn.svg', name: 'বাংলা (Bengali)' },
'pt': { flag: 'flags/pt.svg', name: 'Português (Portuguese)' },
'ru': { flag: 'flags/ru.svg', name: 'Русский (Russian)' },
'uk': { flag: 'flags/uk.svg', name: 'Українська (Ukrainian)' },
'bg': { flag: 'flags/bg.svg', name: 'Български (Bulgarian)' },
'ur': { flag: 'flags/ur.svg', name: 'اردو (Urdu)' },
'ja': { flag: 'flags/ja.svg', name: '日本語 (Japanese)' },
'tl': { flag: 'flags/tl.svg', name: 'Filipino' },
'de': { flag: 'flags/de.svg', name: 'Deutsch (German)' },
'ko': { flag: 'flags/ko.svg', name: '한국어 (Korean)' },
'th': { flag: 'flags/th.svg', name: 'ภาษาไทย (Thai)' },
'vi': { flag: 'flags/vi.svg', name: 'Tiếng Việt (Vietnamese)' },
'tr': { flag: 'flags/tr.svg', name: 'Türkçe (Turkish)' },
'fa': { flag: 'flags/fa.svg', name: 'فارسی (Persian)' },
'sw': { flag: 'flags/sw.svg', name: 'Swahili' },
'it': { flag: 'flags/it.svg', name: 'Italiano (Italian)' },
'pl': { flag: 'flags/pl.svg', name: 'Polski (Polish)' },
'nl': { flag: 'flags/nl.svg', name: 'Nederlands (Dutch)' },
'ro': { flag: 'flags/ro.svg', name: 'Română (Romanian)' },
'el': { flag: 'flags/el.svg', name: 'Ελληνικά (Greek)' },
'af': { flag: 'flags/af.svg', name: 'Afrikaans' },
'zu': { flag: 'flags/zu.svg', name: 'isiZulu (Zulu)' },
'xh': { flag: 'flags/xh.svg', name: 'isiXhosa (Xhosa)' },
'cs': { flag: 'flags/cs.svg', name: 'Čeština (Czech)' },
'hu': { flag: 'flags/hu.svg', name: 'Magyar (Hungarian)' },
'he': { flag: 'flags/he.svg', name: 'עברית (Hebrew)' },
'crs': { flag: 'flags/crs.svg', name: 'Seselwa (Seychellois Creole)' },
'se': { flag: 'flags/dsg.svg', name: 'Davvisámegiella (Northern Sami)' },
'fit': { flag: 'flags/fit.svg', name: 'Tornedalian (Meänkieli)' },
'no': { flag: 'flags/no.svg', name: 'Norsk (Norwegian)' },
'fi': { flag: 'flags/fi.svg', name: 'Suomi (Finnish)' },
'da': { flag: 'flags/da.svg', name: 'Dansk (Danish)' },
'is': { flag: 'flags/is.svg', name: 'Íslenska (Icelandic)' },
'fo': { flag: 'flags/fo.svg', name: 'Føroyskt (Faroese)' }
        };

        // Automatisk språkdetektering
        function getPreferredLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && languages[urlLang]) {
                return urlLang;
            }

            const browserLang = navigator.language || navigator.languages?.[0] || 'en';
            const langCode = browserLang.split('-')[0].toLowerCase();

            if (languages[langCode]) {
                return langCode;
            }

            return 'en';
        }

        const lang = getPreferredLanguage();
        const langData = languages[lang];

        document.getElementById('flag-icon').src = langData.flag;
        document.getElementById('flag-icon').alt = langData.name;
        document.getElementById('language-label').textContent = langData.name;

        async function loadText() {
            try {
                const response = await fetch(`lang_texts/${lang}.txt`);
                if (!response.ok) throw new Error('Textfil saknas');
                const text = await response.text();
                
                const lines = text.split('\n').filter(line => line.trim() !== '');
                if (lines.length >= 2) {
                    document.getElementById('book-title').textContent = lines[0].trim();
                    document.getElementById('body-text').innerHTML = lines.slice(1).join('<br>');
                }
            } catch (error) {
                console.error('Fel vid laddning:', error);
                document.getElementById('book-title').textContent = 'The World Manifesto';
                document.getElementById('body-text').textContent = 'Text could not be loaded.';
            }
        }

        loadText();
        if (typeof getAuthorHTML === 'function') {
            document.getElementById('author-container').innerHTML = getAuthorHTML();
        }
    </script>
</body>
</html>
