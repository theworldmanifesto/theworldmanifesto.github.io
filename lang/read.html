<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The World Manifesto</title>
    <link rel="icon" href="/pics/favicon.ico" sizes="32x32">
    <link rel="icon" href="/pics/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/lang.css">
    <link rel="stylesheet" href="../menu.css">
    <style>
        .language-name {
            font-family: 'Arimo', 'Arial', sans-serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            text-align: center;
        }
        .body-text {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(11pt, 2.5vw, 13pt);
            line-height: 1.6;
            margin: 10px 0;
            text-align: start;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #1a1a1a;
            white-space: pre-wrap;
        }
        .flag-icon {
            display: inline-block;
            width: clamp(16px, 4vw, 24px);
            height: auto;
            vertical-align: middle;
        }
        #author-container {
            text-align: center;
            margin-top: 30px;
        }
        #author-container .author {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: 12pt;
            font-weight: bold;
            margin: 0;
        }
        .separator-line {
            border: none;
            border-top: 2px solid #ccc;
            max-width: 300px;
            margin: 25px auto;
        }
        .toc-title {
            margin-bottom: 10px;
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(16pt, 3vw, 20pt);
            font-weight: bold;
            text-align: center;
            margin: 30px 0 20px 0;
            color: #1a1a1a;
        }

        @media only screen and (max-width: 768px) {
            .book-title { font-size: 28pt !important; }
            .book-subtitle { font-size: 12pt !important; }
            .language-name { font-size: 9pt !important; }
            .body-text { padding: 0 15px; }
        }
        @media only screen and (max-width: 430px) {
            .book-title { font-size: 22pt !important; }
            .book-subtitle { font-size: 11pt !important; }
            .language-name { font-size: 8pt !important; }
        }
    </style>

    <link rel="stylesheet" href="../background_color.css">
</head>
<body>
    <div id="main-menu"></div>

    <div style="text-align: center; margin: 10px 0 20px 0;">
        <select id="read-select" style="padding: 6px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; font-family: sans-serif; background: rgba(255, 255, 255, 0.9);"></select>
    </div>

    <div class="page-container">
        <p class="language-name" id="language-name">
            <img id="flag-icon" src="" alt="" class="flag-icon" width="20" height="auto">
            <span id="language-label"></span>
        </p>
        <br>
        <h1 id="book-title" class="book-title">The World Manifesto</h1>
        <h2 id="book-subtitle" class="book-subtitle">The Manifesto for Definitive Abundance</h2>
        <br>
        <div id="author-container"></div>
        <br>
        <div id="copyright-container"></div>
        <br>
        <div id="body-content"></div>
    </div>

    <script src="js/author.js"></script>
    <script src="js/copyright.js"></script>
    <script type="module" src="../menu.js"></script>
    <script type="module" src="../footer.js"></script>

    <script type="module">
        import {
            AVAILABLE, RELATED_FALLBACK, pickBestLanguage,
            saveLanguage, populateLangSelect, setDocumentDirection
        } from './js/lang.js';
        import { getLangMeta } from './js/titles.js';

        // ============================================================
        // 1. SPRÅKVAL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const urlLangParam = urlParams.get('lang');

        function getPreferredLanguage() {
            if (urlLangParam) {
                const lc = urlLangParam.toLowerCase();
                const mapped = RELATED_FALLBACK[lc] || lc;
                if (AVAILABLE.includes(mapped)) return mapped;
                if (AVAILABLE.includes(lc)) return lc;
            }
            try {
                const saved = localStorage.getItem('world-manifesto-lang');
                if (saved && AVAILABLE.includes(saved)) return saved;
            } catch(e) {}
            return pickBestLanguage(AVAILABLE);
        }

        const lang = getPreferredLanguage();
        saveLanguage(lang);

        const langData = getLangMeta(lang);
        setDocumentDirection(lang);

        document.getElementById('flag-icon').src = langData.flag;
        document.getElementById('flag-icon').alt = langData.name;
        document.getElementById('language-label').textContent = langData.name;
        document.getElementById('book-title').textContent = langData.title;
        document.getElementById('book-subtitle').textContent = langData.subtitle;

        // ============================================================
        // 2. FYLL DROPDOWN
        // ============================================================
        const select = document.getElementById('read-select');
        populateLangSelect(select, { placeholder: 'Välj språk', selected: lang });

        select.addEventListener('change', function(e) {
            const val = e.target.value;
            if (!val) return;
            saveLanguage(val);
            window.location.href = 'read.html?lang=' + val;
        });

        // ============================================================
        // 3. LADDA TEXT
        // ============================================================
        let authorNameFromText = "";

async function loadText() {
    const bodyContent = document.getElementById('body-content');
    try {
        const response = await fetch('lang_texts/' + lang + '.txt');
        if (!response.ok) throw new Error('Textfil saknas');
        const text = await response.text();

        const lines = text.split('\n');

        // Författarnamnet är tredje icke-tomma raden
        const nonEmptyLines = lines.filter(function(line) { return line.trim() !== ''; });
        if (nonEmptyLines.length >= 3) {
            authorNameFromText = nonEmptyLines[2].trim();
        }

        // Ta bort de tre första icke-tomma raderna (titel, undertitel, författare)
        // och behåll resten med tomrader intakta
        let bodyLines = [];
        let nonEmptyCount = 0;
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].trim() !== '') {
                nonEmptyCount++;
                if (nonEmptyCount <= 3) continue;
            }
            bodyLines.push(lines[i]);
        }

        // Ta bort inledande tomrader
        while (bodyLines.length > 0 && bodyLines[0].trim() === '') {
            bodyLines.shift();
        }

        // Hantera separatorer (=====)
        let separatorsSeen = 0;
        let html = '';
        let buffer = [];

        function flushBuffer() {
            if (buffer.length === 0) return;
            const text = buffer.join('\n');
            html += '<div class="body-text">' + escapeHtml(text) + '</div>';
            buffer = [];
        }

        function escapeHtml(s) {
            return s
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        for (let i = 0; i < bodyLines.length; i++) {
            const line = bodyLines[i];
            const trimmed = line.trim();

            if (trimmed.match(/^=+$/)) {
                separatorsSeen++;
                if (separatorsSeen <= 2) continue;
                flushBuffer();
                html += '<hr class="separator-line">';
                continue;
            }

            if (separatorsSeen === 1) continue;

            // Citat på egen rad
            if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
                flushBuffer();
                html += '<p class="body-text" style="font-style: italic; text-align: center;">' + escapeHtml(trimmed) + '</p>';
                continue;
            }

            buffer.push(line);
        }

        flushBuffer();
        bodyContent.innerHTML = html;

    } catch (error) {
        console.error('Fel vid laddning:', error);
        bodyContent.innerHTML = '<p class="body-text">Text could not be loaded.</p>';
    }
}

        loadText().then(function() {
            if (typeof getAuthorHTML === 'function') {
                document.getElementById('author-container').innerHTML = getAuthorHTML();
            }
        });

        if (typeof getCopyrightHTML === 'function') {
            document.getElementById('copyright-container').innerHTML = getCopyrightHTML();
        }
    </script>

</body>
</html>
