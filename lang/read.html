    <style>
        .language-name {
            font-family: 'Arimo', 'Arial', sans-serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            text-align: center;
        }
        .book-title {
            font-family: 'Dancing Script', cursive;
            font-size: 36pt;
            font-weight: normal;
            margin: 0 0 5px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        .book-subtitle {
            font-family: 'Homemade Apple', cursive;
            font-size: 13pt;
            font-weight: normal;
            margin: 0 0 10px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        .body-text {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(11pt, 2.5vw, 13pt);
            line-height: 1.6;
            margin: 10px 0;
            text-align: start;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #1a1a1a;
        }
        .flag-icon {
            display: inline-block;
            width: clamp(16px, 4vw, 24px);
            height: auto;
            vertical-align: middle;
        }
        #author-container {
            text-align: center;
            margin-top: 30px;
        }
        #author-container .author {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: 12pt;
            font-weight: bold;
            margin: 0;
        }
        .separator-line {
            border: none;
            border-top: 2px solid #ccc;
            max-width: 300px;
            margin: 25px auto;
        }
        .toc-title {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(16pt, 3vw, 20pt);
            font-weight: bold;
            text-align: center;
            margin: 30px 0 20px 0;
            color: #1a1a1a;
        }

.manifesto-table {
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    border-collapse: collapse;
    font-family: 'Gelasio', 'Georgia', serif;
    font-size: clamp(10pt, 2vw, 12pt);
    text-align: start;
    table-layout: fixed;
}
.manifesto-table th {
    font-weight: bold;
    padding: 10px 12px;
    border: 1px solid #ccc;
    text-align: center;
    width: 33.33%;
    word-wrap: break-word;
    white-space: normal;
    overflow-wrap: break-word;
    background-color: #f7f7f7;
}
.manifesto-table td {
    padding: 10px 12px;
    border: 1px solid #ccc;
    vertical-align: top;
    word-wrap: break-word;
    white-space: normal;
    overflow-wrap: break-word;
}
.manifesto-table td:first-child {
    font-weight: bold;
    text-align: center;
    width: 33.33%;
    word-wrap: break-word;
    white-space: normal;
    overflow-wrap: break-word;
}

        @media only screen and (max-width: 768px) {
            .book-title { font-size: 28pt !important; }
            .book-subtitle { font-size: 12pt !important; }
            .language-name { font-size: 9pt !important; }
            .body-text { padding: 0 15px; }
            .manifesto-table td, .manifesto-table th {
                padding: 6px 8px;
                font-size: 9pt;
            }
        }
        @media only screen and (max-width: 430px) {
            .book-title { font-size: 22pt !important; }
            .book-subtitle { font-size: 11pt !important; }
            .language-name { font-size: 8pt !important; }
            .manifesto-table td, .manifesto-table th {
                padding: 4px 6px;
                font-size: 8pt;
            }
        }
    </style>
