<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The World Manifesto</title>
    <link rel="stylesheet" href="css/lang.css">
    <style>
        /* Extra styling för read.html */
        .book-subtitle {
            font-family: 'Dancing Script', cursive !important;
            font-size: clamp(18pt, 5vw, 28pt);
            font-weight: normal;
            margin: 0 0 5px 0;
            line-height: 1.2;
            color: #1a1a1a;
        }
        .chapter-title-special {
            font-family: 'Dancing Script', cursive !important;
            font-size: clamp(20pt, 5vw, 32pt);
            font-weight: normal;
            margin: 40px 0 20px 0;
            text-align: center;
            color: #1a1a1a;
        }
        .body-text {
            font-family: 'Georgia', 'Times New Roman', Times, serif !important;
            font-size: clamp(12pt, 2.5vw, 14pt);
            line-height: 1.6;
            margin: 10px 0;
            text-align: left;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #1a1a1a;
        }
        .body-text.centered {
            text-align: center;
        }
        .separator {
            max-width: 200px;
            margin: 30px auto;
            border: 1px solid #ccc;
        }
        .chapter-title {
            font-family: 'Georgia', 'Times New Roman', Times, serif !important;
            font-size: clamp(18pt, 4vw, 26pt);
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 40px 0 20px 0;
            color: #1a1a1a;
        }
        .section-title {
            font-family: 'Georgia', 'Times New Roman', Times, serif !important;
            font-size: clamp(16pt, 3.5vw, 22pt);
            font-weight: bold;
            text-align: center;
            margin: 30px 0 15px 0;
            color: #1a1a1a;
        }
        .subsection-title {
            font-family: 'Georgia', 'Times New Roman', Times, serif !important;
            font-size: clamp(14pt, 3vw, 18pt);
            font-weight: bold;
            margin: 20px 0 10px 0;
            text-align: left;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #1a1a1a;
        }
        .author-text {
            font-family: 'Georgia', 'Times New Roman', Times, serif !important;
            font-size: clamp(12pt, 2.5vw, 14pt);
            font-weight: bold;
            text-align: center;
            margin: 5px 0;
            color: #1a1a1a;
        }
        .status-text {
            font-family: 'Georgia', 'Times New Roman', Times, serif !important;
            font-size: clamp(11pt, 2.5vw, 13pt);
            font-style: italic;
            text-align: center;
            margin: 10px 0;
            color: #555;
        }
        .body-text strong {
            font-weight: bold;
        }
        .body-text em {
            font-style: italic;
        }
        .language-name {
            font-family: 'Georgia', serif;
            font-size: clamp(11pt, 3vw, 12pt);
            font-weight: normal;
            margin: 0;
            text-align: center;
        }
        .flag-icon {
            display: inline-block;
            width: clamp(16px, 4vw, 24px);
            height: auto;
            vertical-align: middle;
            margin-right: 0;
        }
        .book-title {
            font-family: 'Dancing Script', cursive !important;
            font-size: clamp(28pt, 8vw, 48pt);
            font-weight: normal;
            margin: 0 0 5px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        #author-container {
            text-align: center;
            margin-top: 30px;
        }
        #author-container .author {
            font-family: 'Georgia', serif;
            font-size: clamp(11pt, 3vw, 14pt);
            font-weight: bold;
            margin: 0;
        }
        /* Responsiv design */
        @media only screen and (max-width: 768px) {
            .body-text {
                padding: 0 15px;
            }
            .subsection-title {
                padding: 0 15px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- SPRÅKNAMN med flagga -->
        <p class="language-name" id="language-name">
            <img id="flag-icon" src="" alt="" class="flag-icon" width="20" height="auto">
            <span id="language-label"></span>
        </p>
        <br><br>

        <!-- BOKTITEL – Dancing Script -->
        <h1 class="book-title" id="book-title">The World Manifesto</h1>

        <!-- SUBTITEL – Dancing Script -->
        <h2 class="book-subtitle" id="book-subtitle">The Manifesto for Definitive Abundance</h2>

        <br>

        <!-- FÖRFATTARE – Georgia -->
        <div id="author-container"></div>

        <br>

        <!-- BRÖDTEXT – Georgia -->
        <div id="body-content"></div>

    </div>

    <script src="js/author.js"></script>
    <script>
        // ============================================================
        // 1. SPRÅKDATA
        // ============================================================
        const languages = {
            'sv': { flag: 'flags/se.svg', name: 'Svenska' },
            'en': { flag: 'flags/gb.svg', name: 'English' },
            'zh': { flag: 'flags/cn.svg', name: '简体中文' },
            'hi': { flag: 'flags/in.svg', name: 'हिन्दी' },
            'es': { flag: 'flags/es.svg', name: 'Español' },
            'fr': { flag: 'flags/fr.svg', name: 'Français' },
            'ar': { flag: 'flags/sa.svg', name: 'العربية' },
            'id': { flag: 'flags/id.svg', name: 'Bahasa Indonesia' },
            'bn': { flag: 'flags/bd.svg', name: 'বাংলা' },
            'pt': { flag: 'flags/pt.svg', name: 'Português' },
            'ru': { flag: 'flags/ru.svg', name: 'Русский' },
            'uk': { flag: 'flags/ua.svg', name: 'Українська' },
            'bg': { flag: 'flags/bg.svg', name: 'Български' },
            'ur': { flag: 'flags/pk.svg', name: 'اردو' },
            'ja': { flag: 'flags/jp.svg', name: '日本語' },
            'tl': { flag: 'flags/ph.svg', name: 'Filipino' },
            'de': { flag: 'flags/de.svg', name: 'Deutsch' },
            'ko': { flag: 'flags/kr.svg', name: '한국어' },
            'th': { flag: 'flags/th.svg', name: 'ไทย' },
            'vi': { flag: 'flags/vn.svg', name: 'Tiếng Việt' },
            'tr': { flag: 'flags/tr.svg', name: 'Türkçe' },
            'fa': { flag: 'flags/ir.svg', name: 'فارسی' },
            'sw': { flag: 'flags/tz.svg', name: 'Kiswahili' },
            'it': { flag: 'flags/it.svg', name: 'Italiano' },
            'pl': { flag: 'flags/pl.svg', name: 'Polski' },
            'nl': { flag: 'flags/nl.svg', name: 'Nederlands' },
            'ro': { flag: 'flags/ro.svg', name: 'Română' },
            'el': { flag: 'flags/gr.svg', name: 'Ελληνικά' },
            'af': { flag: 'flags/za.svg', name: 'Afrikaans' },
            'zu': { flag: 'flags/za.svg', name: 'isiZulu' },
            'xh': { flag: 'flags/za.svg', name: 'isiXhosa' },
            'cs': { flag: 'flags/cz.svg', name: 'Čeština' },
            'hu': { flag: 'flags/hu.svg', name: 'Magyar' },
            'he': { flag: 'flags/il.svg', name: 'עברית' },
            'crs': { flag: 'flags/sc.svg', name: 'Seselwa' },
            'se': { flag: 'flags/dsg.svg', name: 'Davvisámegiella' },
            'fit': { flag: 'flags/fit.svg', name: 'Meänkieli' },
            'no': { flag: 'flags/no.svg', name: 'Norsk' },
            'fi': { flag: 'flags/fi.svg', name: 'Suomi' },
            'da': { flag: 'flags/dk.svg', name: 'Dansk' },
            'is': { flag: 'flags/is.svg', name: 'Íslenska' },
            'fo': { flag: 'flags/fo.svg', name: 'Føroyskt' }
        };

        // ============================================================
        // 2. HÄMTA SPRÅK
        // ============================================================
        function getPreferredLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && languages[urlLang]) return urlLang;

            const browserLang = navigator.language || navigator.languages?.[0] || 'en';
            const langCode = browserLang.split('-')[0].toLowerCase();
            if (languages[langCode]) return langCode;

            return 'en';
        }

        const lang = getPreferredLanguage();
        const langData = languages[lang];

        // Sätt flagga och språknamn
        document.getElementById('flag-icon').src = langData.flag;
        document.getElementById('flag-icon').alt = langData.name;
        document.getElementById('language-label').textContent = langData.name;

        // ============================================================
        // 3. LADDA OCH PARSERA TEXT
        // ============================================================
        async function loadText() {
            try {
                const response = await fetch(`lang_texts/${lang}.txt`);
                if (!response.ok) throw new Error('Textfil saknas');
                const text = await response.text();

                // Dela upp texten i rader
                const lines = text.split('\n').filter(line => line.trim() !== '');

                if (lines.length >= 1) {
                    // RAD 1: Huvudtitel – Dancing Script
                    document.getElementById('book-title').textContent = lines[0].trim();
                }

                if (lines.length >= 2) {
                    // RAD 2: Subtitel – Dancing Script
                    document.getElementById('book-subtitle').textContent = lines[1].trim();
                }

                // RESTEN: Brödtext – Georgia
                if (lines.length > 2) {
                    const bodyContent = document.getElementById('body-content');
                    let currentHtml = '';

                    // Bearbeta resterande rader
                    for (let i = 2; i < lines.length; i++) {
                        let line = lines[i].trim();

                        // Kontrollera om raden är en "To Be Done"-rubrik (specialfall)
                        if (line.toLowerCase() === 'to be done') {
                            // Specialrubrik med Dancing Script
                            currentHtml += `<h2 class="chapter-title-special">${line}</h2>`;
                            continue;
                        }

                        // Kontrollera om raden är en kapitelrubrik (versaler)
                        if (line === line.toUpperCase() && line.length > 3 && !line.includes(' ')) {
                            currentHtml += `<h2 class="chapter-title">${line}</h2>`;
                            continue;
                        }

                        // Kontrollera om raden är en sektionsrubrik (innehåller ":" eller "–")
                        if (line.includes(':') || line.includes('–')) {
                            const parts = line.split(/[:–]\s*/);
                            if (parts.length >= 2 && parts[0].length < 50) {
                                currentHtml += `<h3 class="section-title">${line}</h3>`;
                                continue;
                            }
                        }

                        // Kontrollera om raden är en underrubrik (kort, fetstil)
                        if (line.length < 60 && !line.endsWith('.') && !line.endsWith('"') && !line.startsWith('"')) {
                            // Kolla om det är en "status"-text (kursiv)
                            if (line.startsWith('*') || line.endsWith('*')) {
                                currentHtml += `<p class="status-text">${line.replace(/\*/g, '')}</p>`;
                                continue;
                            }
                            // Kolla om det är författare
                            if (line.startsWith('Sven') || line.startsWith('First Edition') || 
                                line.match(/^[A-Z][a-z]+ [A-Z][a-z]+$/)) {
                                currentHtml += `<p class="author-text">${line}</p>`;
                                continue;
                            }
                        }

                        // Om raden innehåller citattecken (citat)
                        if (line.startsWith('"') && line.endsWith('"')) {
                            currentHtml += `<p class="body-text" style="font-style: italic; text-align: center;">${line}</p>`;
                            continue;
                        }

                        // Standard: brödtext med Georgia
                        currentHtml += `<p class="body-text">${line}</p>`;
                    }

                    bodyContent.innerHTML = currentHtml;
                }

            } catch (error) {
                console.error('Fel vid laddning:', error);
                document.getElementById('book-title').textContent = 'The World Manifesto';
                document.getElementById('book-subtitle').textContent = 'The Manifesto for Definitive Abundance';
                document.getElementById('body-content').innerHTML = '<p class="body-text">Text could not be loaded.</p>';
            }
        }

        // ============================================================
        // 4. KÖR
        // ============================================================
        loadText();
        if (typeof getAuthorHTML === 'function') {
            document.getElementById('author-container').innerHTML = getAuthorHTML();
        }
    </script>
</body>
</html>
