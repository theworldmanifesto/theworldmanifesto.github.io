<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The World Manifesto</title>
    <link rel="stylesheet" href="../menu.css">
    <style>
        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            line-height: 1.6;
            color: #1a1a1a;
            background-color: #fcfcfc;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 20px 40px 20px;
        }
        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 20px;
        }
        #main-menu { display: inline-block; }
        h1 { font-size: 32px; font-weight: normal; margin-bottom: 5px; }
        h2 { font-size: 20px; font-weight: normal; color: #555; margin-top: 0; margin-bottom: 5px; }
        .author { font-size: 16px; color: #666; margin-bottom: 5px; }
        .edition { font-size: 14px; color: #888; margin-bottom: 30px; }
        .manifesto-text { font-size: 16px; line-height: 1.8; margin-top: 30px; }
        @media (max-width: 600px) {
            .nav-wrapper { padding: 8px 12px; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="nav-wrapper">
        <div id="main-menu"></div>
    </div>

    <div class="container">

        <!-- RUBRIKER – UPPDATERAS AV JAVASCRIPT -->
        <h1 id="title">The World Manifesto</h1>
        <h2 id="subtitle">The Manifesto for Definitive Abundance</h2>
        <div class="author">Sven Yngerstedt</div>
        <div class="edition">First edition, 2026</div>

        <div id="content" class="manifesto-text">
            <p>Laddar...</p>
        </div>

    </div>

    <script src="../menu.js"></script>

    <script>
        // Läs språk från URL
        const lang = new URLSearchParams(window.location.search).get('lang') || 'en';
        
        // Översättningar
        const titles = {
            'sv': ['Världsmanifestet', 'Manifestet för definitivt överflöd'],
            'en': ['The World Manifesto', 'The Manifesto for Definitive Abundance']
            // Lägg till fler språk här...
        };
        
        const t = titles[lang] || titles['en'];
        document.getElementById('title').textContent = t[0];
        document.getElementById('subtitle').textContent = t[1];
    </script>

    <script src="../footer.js"></script>

</body>
</html>
