<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The World Manifesto</title>
    <link rel="stylesheet" href="css/lang.css">
    <style>
        /* ---------- Första sidan – fast formatering ---------- */
        .language-name {
            font-family: 'Arimo', 'Arial', sans-serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            text-align: center;
        }
        .book-title {
            font-family: 'Dancing Script', cursive;
            font-size: 36pt;
            font-weight: normal;
            margin: 0 0 5px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        .book-subtitle {
            font-family: 'Homemade Apple', cursive;
            font-size: 13pt;
            font-weight: normal;
            margin: 0 0 10px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        /* ---------- Resten av texten ---------- */
        .body-text {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(11pt, 2.5vw, 13pt);
            line-height: 1.6;
            margin: 10px 0;
            text-align: left;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #1a1a1a;
        }
        .flag-icon {
            display: inline-block;
            width: clamp(16px, 4vw, 24px);
            height: auto;
            vertical-align: middle;
        }
        /* ---------- Författare (från author.js) ---------- */
        #author-container {
            text-align: center;
            margin-top: 30px;
        }
        #author-container .author {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: 12pt;
            font-weight: bold;
            margin: 0;
        }
        /* ---------- Separator ---------- */
        .separator-line {
            border: none;
            border-top: 2px solid #ccc;
            max-width: 300px;
            margin: 25px auto;
        }
        /* ---------- Table of Contents rubrik ---------- */
        .toc-title {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(16pt, 3vw, 20pt);
            font-weight: bold;
            text-align: center;
            margin: 30px 0 20px 0;
            color: #1a1a1a;
        }
        /* ---------- TABELL (maxai.co styling) ---------- */
        .manifesto-table {
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
            border-collapse: collapse;
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(10pt, 2vw, 12pt);
            text-align: left;
        }
        .manifesto-table th {
            background-color: #f0f0f0;
            font-weight: bold;
            padding: 10px 12px;
            border: 1px solid #ccc;
            text-align: center;
        }
        .manifesto-table td {
            padding: 10px 12px;
            border: 1px solid #ccc;
            vertical-align: top;
        }
        .manifesto-table tr:nth-child(even) td {
            background-color: #f9f9f9;
        }
        .manifesto-table td:first-child {
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            width: 60px;
        }
        .manifesto-table td.empty-cell {
            background-color: #fff8de;
        }
        /* ---------- Responsiv ---------- */
        @media only screen and (max-width: 768px) {
            .book-title { font-size: 28pt !important; }
            .book-subtitle { font-size: 12pt !important; }
            .language-name { font-size: 9pt !important; }
            .body-text { padding: 0 15px; }
            .manifesto-table td, .manifesto-table th {
                padding: 6px 8px;
                font-size: 9pt;
            }
        }
        @media only screen and (max-width: 430px) {
            .book-title { font-size: 22pt !important; }
            .book-subtitle { font-size: 11pt !important; }
            .language-name { font-size: 8pt !important; }
            .manifesto-table td, .manifesto-table th {
                padding: 4px 6px;
                font-size: 8pt;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- RAD 1: Flagga + språknamn (Arimo 10 pt) -->
        <p class="language-name" id="language-name">
            <img id="flag-icon" src="" alt="" class="flag-icon" width="20" height="auto">
            <span id="language-label"></span>
        </p>

        <br>

        <!-- RAD 2: Huvudtitel (Dancing Script 36 pt) -->
        <h1 class="book-title" id="book-title">The World Manifesto</h1>

        <!-- RAD 3: Subtitel (Homemade Apple 13 pt) -->
        <h2 class="book-subtitle" id="book-subtitle">The Manifesto for Definitive Abundance</h2>

        <br>

        <!-- RAD 4: Författare från author.js -->
        <div id="author-container"></div>

        <br>

        <!-- RESTEN: All övrig text (Gelasio) -->
        <div id="body-content"></div>

    </div>

    <script src="js/author.js"></script>
    <script>
        // ============================================================
        // 1. SPRÅKDATA – 42 språk
        // ============================================================
        const languages = {
            'sv': { flag: 'flags/se.svg', name: 'Svenska' },
            'en': { flag: 'flags/gb.svg', name: 'English' },
            'zh': { flag: 'flags/cn.svg', name: '简体中文' },
            'hi': { flag: 'flags/in.svg', name: 'हिन्दी' },
            'es': { flag: 'flags/es.svg', name: 'Español' },
            'fr': { flag: 'flags/fr.svg', name: 'Français' },
            'ar': { flag: 'flags/sa.svg', name: 'العربية' },
            'id': { flag: 'flags/id.svg', name: 'Bahasa Indonesia' },
            'bn': { flag: 'flags/bd.svg', name: 'বাংলা' },
            'pt': { flag: 'flags/pt.svg', name: 'Português' },
            'ru': { flag: 'flags/ru.svg', name: 'Русский' },
            'uk': { flag: 'flags/ua.svg', name: 'Українська' },
            'bg': { flag: 'flags/bg.svg', name: 'Български' },
            'ur': { flag: 'flags/pk.svg', name: 'اردو' },
            'ja': { flag: 'flags/jp.svg', name: '日本語' },
            'tl': { flag: 'flags/ph.svg', name: 'Filipino' },
            'de': { flag: 'flags/de.svg', name: 'Deutsch' },
            'ko': { flag: 'flags/kr.svg', name: '한국어' },
            'th': { flag: 'flags/th.svg', name: 'ไทย' },
            'vi': { flag: 'flags/vn.svg', name: 'Tiếng Việt' },
            'tr': { flag: 'flags/tr.svg', name: 'Türkçe' },
            'fa': { flag: 'flags/ir.svg', name: 'فارسی' },
            'sw': { flag: 'flags/tz.svg', name: 'Kiswahili' },
            'it': { flag: 'flags/it.svg', name: 'Italiano' },
            'pl': { flag: 'flags/pl.svg', name: 'Polski' },
            'nl': { flag: 'flags/nl.svg', name: 'Nederlands' },
            'ro': { flag: 'flags/ro.svg', name: 'Română' },
            'el': { flag: 'flags/gr.svg', name: 'Ελληνικά' },
            'af': { flag: 'flags/za.svg', name: 'Afrikaans' },
            'zu': { flag: 'flags/za.svg', name: 'isiZulu' },
            'xh': { flag: 'flags/za.svg', name: 'isiXhosa' },
            'cs': { flag: 'flags/cz.svg', name: 'Čeština' },
            'hu': { flag: 'flags/hu.svg', name: 'Magyar' },
            'he': { flag: 'flags/il.svg', name: 'עברית' },
            'crs': { flag: 'flags/sc.svg', name: 'Seselwa' },
            'se': { flag: 'flags/dsg.svg', name: 'Davvisámegiella' },
            'fit': { flag: 'flags/fit.svg', name: 'Meänkieli' },
            'no': { flag: 'flags/no.svg', name: 'Norsk' },
            'fi': { flag: 'flags/fi.svg', name: 'Suomi' },
            'da': { flag: 'flags/dk.svg', name: 'Dansk' },
            'is': { flag: 'flags/is.svg', name: 'Íslenska' },
            'fo': { flag: 'flags/fo.svg', name: 'Føroyskt' }
        };

        // ============================================================
        // 2. HÄMTA SPRÅK
        // ============================================================
        function getPreferredLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && languages[urlLang]) return urlLang;

            const browserLang = navigator.language || navigator.languages?.[0] || 'en';
            const langCode = browserLang.split('-')[0].toLowerCase();
            if (languages[langCode]) return langCode;

            return 'en';
        }

        const lang = getPreferredLanguage();
        const langData = languages[lang];

        document.getElementById('flag-icon').src = langData.flag;
        document.getElementById('flag-icon').alt = langData.name;
        document.getElementById('language-label').textContent = langData.name;

        // ============================================================
        // 3. MAXAI.CO PARSER – hanterar 7 och 12 tabbar automatiskt
        // ============================================================

        // Inställningar för tabb-tolkning (kan justeras vid behov)
        const ONE_EMPTY_TABS = 7;   // 7 tabbar = 1 tom cell
        const TWO_EMPTY_TABS = 12;  // 12 tabbar = 2 tomma celler

        function parseLine(line) {
            if (line === "") {
                return [""];
            }

            const parts = line.split(/(\t+)/);
            const cells = [];

            for (let index = 0; index < parts.length; index++) {
                const part = parts[index];

                if (part === "") {
                    continue;
                }

                const isTabSequence = /^\t+$/.test(part);

                if (!isTabSequence) {
                    cells.push(part);
                    continue;
                }

                const tabCount = part.length;
                const hasContentBefore = index > 0 && parts.slice(0, index).some(p => p !== "" && !/^\t+$/.test(p));
                const hasContentAfter = parts.slice(index + 1).some(p => p !== "" && !/^\t+$/.test(p));

                let emptyCellsToAdd;

                if (tabCount === ONE_EMPTY_TABS) {
                    emptyCellsToAdd = 1;
                } else if (tabCount === TWO_EMPTY_TABS) {
                    emptyCellsToAdd = 2;
                } else {
                    // Standard TSV-logik
                    const isAtLineBoundary = !hasContentBefore || !hasContentAfter;
                    emptyCellsToAdd = Math.max(0, tabCount - 1 + (isAtLineBoundary ? 1 : 0));
                }

                for (let i = 0; i < emptyCellsToAdd; i++) {
                    cells.push("");
                }
            }

            return cells.length > 0 ? cells : [""];
        }

        function getMaximumColumns(rows) {
            return rows.reduce((maximum, row) => Math.max(maximum, row.length), 0);
        }

        function buildTableFromRows(rows) {
            if (rows.length === 0) return '';

            const columnCount = getMaximumColumns(rows);

            let html = `<table class="manifesto-table">`;

            // Rubrikrad (första raden)
            const headers = rows[0] || [];
            html += `<thead><tr><th>#</th>`;
            headers.forEach(h => {
                html += `<th>${h || ''}</th>`;
            });
            html += `</tr></thead><tbody>`;

            // Datarader (från rad 2 och framåt)
            for (let rowIndex = 1; rowIndex < rows.length; rowIndex++) {
                const sourceRow = rows[rowIndex] || [];
                html += `<tr><td>${rowIndex}</td>`;
                for (let col = 0; col < columnCount; col++) {
                    const value = sourceRow[col] ?? '';
                    const emptyClass = value === '' ? ' class="empty-cell"' : '';
                    html += `<td${emptyClass}>${value}</td>`;
                }
                html += `</tr>`;
            }

            html += `</tbody></table>`;
            return html;
        }

        // ============================================================
        // 4. LADDA TEXT MED MAXAI.CO PARSER
        // ============================================================
        async function loadText() {
            try {
                const response = await fetch(`lang_texts/${lang}.txt`);
                if (!response.ok) throw new Error('Textfil saknas');
                const text = await response.text();

                const lines = text.split('\n');
                const bodyContent = document.getElementById('body-content');
                let currentHtml = '';
                let tableRows = [];
                let inTable = false;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();

                    if (line === '') {
                        if (inTable && tableRows.length > 0) {
                            // Använd maxai parsern för tabellrader
                            const parsedRows = tableRows.map(row => parseLine(row));
                            currentHtml += buildTableFromRows(parsedRows);
                            tableRows = [];
                            inTable = false;
                        }
                        continue;
                    }

                    // --- TABELL-START ---
                    if (line === '--- START TABLE ---') {
                        inTable = true;
                        tableRows = [];
                        continue;
                    }

                    // --- TABELL-SLUT ---
                    if (line === '--- END TABLE ---') {
                        inTable = false;
                        if (tableRows.length > 0) {
                            const parsedRows = tableRows.map(row => parseLine(row));
                            currentHtml += buildTableFromRows(parsedRows);
                            tableRows = [];
                        }
                        continue;
                    }

                    if (inTable) {
                        tableRows.push(line);
                        continue;
                    }

                    // --- Övrig formatering ---
                    if (line.match(/^=+$/)) {
                        currentHtml += `<hr class="separator-line">`;
                    } else if (line.toLowerCase() === 'table of contents') {
                        currentHtml += `<h2 class="toc-title">${line}</h2>`;
                    } else if (line.startsWith('"') && line.endsWith('"')) {
                        currentHtml += `<p class="body-text" style="font-style: italic; text-align: center;">${line}</p>`;
                    } else if (line.toLowerCase() === 'to be done') {
                        currentHtml += `<h2 style="font-family: 'Dancing Script', cursive; font-size: clamp(20pt, 5vw, 32pt); font-weight: normal; text-align: center; margin: 40px 0 20px 0; color: #1a1a1a;">${line}</h2>`;
                    } else if (line === line.toUpperCase() && line.length > 3 && !line.includes(' ')) {
                        currentHtml += `<p class="body-text">${line}</p>`;
                    } else {
                        currentHtml += `<p class="body-text">${line}</p>`;
                    }
                }

                if (inTable && tableRows.length > 0) {
                    const parsedRows = tableRows.map(row => parseLine(row));
                    currentHtml += buildTableFromRows(parsedRows);
                }

                bodyContent.innerHTML = currentHtml;

            } catch (error) {
                console.error('Fel vid laddning:', error);
                document.getElementById('body-content').innerHTML = '<p class="body-text">Text could not be loaded.</p>';
            }
        }

        // ============================================================
        // 5. KÖR
        // ============================================================
        loadText();

        if (typeof getAuthorHTML === 'function') {
            document.getElementById('author-container').innerHTML = getAuthorHTML();
        }
    </script>
</body>
</html>
