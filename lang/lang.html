<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The World Manifesto</title>
    <link rel="icon" href="/pics/favicon.ico" sizes="32x32">
    <link rel="icon" href="/pics/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/lang.css">
    <link rel="stylesheet" href="../menu.css">
    <style>
        .language-name {
            font-family: 'Arimo', 'Arial', sans-serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            text-align: center;
        }
        .body-text {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(11pt, 2.5vw, 13pt);
            line-height: 1.6;
            margin: 10px 0;
            text-align: start;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #1a1a1a;
            white-space: pre-wrap;
        }
        .flag-icon {
            display: inline-block;
            width: clamp(16px, 4vw, 24px);
            height: auto;
            vertical-align: middle;
        }
        #author-container {
            text-align: center;
            margin-top: 30px;
        }
        #author-container .author {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: 12pt;
            font-weight: bold;
            margin: 0;
        }
        .separator-line {
            border: none;
            border-top: 2px solid #ccc;
            max-width: 300px;
            margin: 25px auto;
        }
        .toc-title { margin-bottom: 10px;
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(16pt, 3vw, 20pt);
            font-weight: bold;
            text-align: center;
            margin: 30px 0 20px 0;
            color: #1a1a1a;
        }

.manifesto-table {
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    border-collapse: collapse;
    font-family: 'Gelasio', 'Georgia', serif;
    font-size: clamp(10pt, 2vw, 12pt);
    text-align: start;
    table-layout: fixed;
}
.manifesto-table th {
    font-weight: bold;
    padding: 10px 12px;
    border: 1px solid #ccc;
    text-align: center;
    width: 33.33%;
    word-wrap: break-word;
    white-space: normal;
    overflow-wrap: break-word;
    background-color: #f7f7f7;
}
.manifesto-table td {
    padding: 10px 12px;
    border: 1px solid #ccc;
    vertical-align: top;
    word-wrap: break-word;
    white-space: normal;
    overflow-wrap: break-word;
}
.manifesto-table td:first-child {
    font-weight: bold;
    text-align: center;
    width: 33.33%;
    word-wrap: break-word;
    white-space: normal;
    overflow-wrap: break-word;
}

        @media only screen and (max-width: 768px) {
            .book-title { font-size: 28pt !important; }
            .book-subtitle { font-size: 12pt !important; }
            .language-name { font-size: 9pt !important; }
            .body-text { padding: 0 15px; }
            .manifesto-table td, .manifesto-table th {
                padding: 6px 8px;
                font-size: 9pt;
            }
        }
        @media only screen and (max-width: 430px) {
            .book-title { font-size: 22pt !important; }
            .book-subtitle { font-size: 11pt !important; }
            .language-name { font-size: 8pt !important; }
            .manifesto-table td, .manifesto-table th {
                padding: 4px 6px;
                font-size: 8pt;
            }
        }
    </style>

    <link rel="stylesheet" href="../background_color.css">
</head>
<body>
    <div id="main-menu"></div>

    <div style="text-align: center; margin: 10px 0 20px 0;">
        <select id="read-select" style="padding: 6px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; font-family: sans-serif; background: rgba(255, 255, 255, 0.9);"></select>
    </div>

    <div class="page-container">
        <p class="language-name" id="language-name">
            <img id="flag-icon" src="" alt="" class="flag-icon" width="20" height="auto">
            <span id="language-label"></span>
        </p>
        <br>
        <h1 id="book-title" class="book-title">The World Manifesto</h1>
        <h2 id="book-subtitle" class="book-subtitle">The Manifesto for Definitive Abundance</h2>
        <br>
        <div id="author-container"></div>
        <br>
        <div id="copyright-container"></div>
        <br>
        <div id="body-content"></div>
    </div>

    <script src="js/author.js"></script>
    <script src="js/copyright.js"></script>
    <script type="module" src="../menu.js"></script>
    <script type="module" src="../footer.js"></script>

    <script type="module">
        import {
            AVAILABLE, RELATED_FALLBACK, pickBestLanguage,
            saveLanguage, populateLangSelect, setDocumentDirection
        } from './js/lang.js';
        import { getLangMeta } from './js/titles.js';

        // ============================================================
        // 1. SPRÅKVAL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const urlLangParam = urlParams.get('lang');

        function getPreferredLanguage() {
            if (urlLangParam) {
                const lc = urlLangParam.toLowerCase();
                const mapped = RELATED_FALLBACK[lc] || lc;
                if (AVAILABLE.includes(mapped)) return mapped;
                if (AVAILABLE.includes(lc)) return lc;
            }
            try {
                const saved = localStorage.getItem('world-manifesto-lang');
                if (saved && AVAILABLE.includes(saved)) return saved;
            } catch(e) {}
            return pickBestLanguage(AVAILABLE);
        }

        const lang = getPreferredLanguage();
        saveLanguage(lang);

        const langData = getLangMeta(lang);
        setDocumentDirection(lang);

        document.getElementById('flag-icon').src = langData.flag;
        document.getElementById('flag-icon').alt = langData.name;
        document.getElementById('language-label').textContent = langData.name;
        document.getElementById('book-title').textContent = langData.title;
        document.getElementById('book-subtitle').textContent = langData.subtitle;

        // ============================================================
        // 2. FYLL DROPDOWN
        // ============================================================
        const select = document.getElementById('read-select');
        populateLangSelect(select, { placeholder: 'Välj språk', selected: lang });

        select.addEventListener('change', function(e) {
            const val = e.target.value;
            if (!val) return;
            saveLanguage(val);
            window.location.href = 'read.html?lang=' + val;
        });

        // ============================================================
        // 3. HJÄLPFUNKTIONER
        // ============================================================
        function splitRow(row) {
            if (row.includes('\t')) {
                return row.split(/\t+/).map(function(c) { return c.trim(); }).filter(function(c) { return c !== ''; });
            }
            return row.split(/\s*\|\s*/).map(function(c) { return c.trim(); }).filter(function(c) { return c !== ''; });
        }

        function buildTable(rows) {
            if (rows.length === 0) return '';

            const splitRows = rows.map(function(row) { return splitRow(row); });
            const maxCols = Math.max.apply(null, splitRows.map(function(r) { return r.length; }));
            const normalizedRows = splitRows.map(function(r) {
                while (r.length < maxCols) r.push('');
                return r;
            });

            let html = '<table class="manifesto-table">';
            const headers = normalizedRows[0];
            html += '<thead><tr>';
            headers.forEach(function(h) { html += '<th>' + h + '</th>'; });
            html += '</tr></thead><tbody>';

            for (let r = 1; r < normalizedRows.length; r++) {
                const cells = normalizedRows[r];
                html += '<tr>';
                cells.forEach(function(c) { html += '<td>' + c + '</td>'; });
                html += '</tr>';
            }

            html += '</tbody></table>';
            return html;
        }

        // ============================================================
        // 4. LADDA TEXT
        // ============================================================
        let authorNameFromText = "";

async function loadText() {
    try {
        const response = await fetch('lang_texts/' + lang + '.txt');
        if (!response.ok) throw new Error('Textfil saknas');
        const text = await response.text();

        const lines = text.split('\n');
        const nonEmptyLines = lines.filter(function(line) { return line.trim() !== ''; });
        const bodyContent = document.getElementById('body-content');
        let currentHtml = '';

        let tableRows = [];
        let inTable = false;
        let separatorsSeen = 0;

        if (nonEmptyLines.length >= 3) {
            authorNameFromText = nonEmptyLines[2].trim();
        }

        // Loopen börjar på rad 4 (index 3) = separator 1
        for (let i = 3; i < nonEmptyLines.length; i++) {
            const rawLine = nonEmptyLines[i];
            const line = rawLine.trim();

            // Separatorhantering
            if (line.match(/^=+$/)) {
                separatorsSeen++;
                if (separatorsSeen <= 2) continue;
                currentHtml += '<hr class="separator-line">';
                continue;
            }

            // Hoppa över allt mellan separator 1 och separator 2
            // (First Edition, ©-raden och eventuella andra rader)
            if (separatorsSeen === 1) continue;

            // Tabelldetektering
            const pipeCount = (line.match(/\|/g) || []).length;
            const tabCount = (line.match(/\t/g) || []).length;
            const isTableRow = (pipeCount >= 2 || tabCount >= 2);

            if (isTableRow) {
                if (!inTable) {
                    inTable = true;
                    tableRows = [];
                }
                tableRows.push(line);
                continue;
            }

            if (inTable && tableRows.length > 0) {
                currentHtml += buildTable(tableRows);
                tableRows = [];
                inTable = false;
            }

            // Innehållsförteckning
            const lower = line.toLowerCase();
            const tocKeywords = ['table of contents', 'innehållsförteckning', 'innholdsfortegnelse', 'indholdsfortegnelse', 'sisällysluettelo', 'table des matières', 'inhaltsverzeichnis', 'índice', 'indice', 'contenidos', 'sommario', 'περιεχόμενα', 'содержание', 'содржина', 'spis treści', 'obsah', 'tartalomjegyzék', 'cuprins', 'inhoudsopgave', 'sisukord', 'saturs', 'turinys', 'kazalo', 'sadržaj', 'зміст', 'fihirist', 'toc', 'daftar isi', '목차', '目次', '目录', '目錄', 'สารบัญ', 'mục lục', 'içindekiler', 'فهرست', 'محتويات', 'תוכן עניינים', 'अनुक्रमणिका', 'সূচিপত্র', 'taaloga', 'dilolo', 'okuqukethwe', 'yandikimo', 'efnisyfirlit', 'innihaldsyvirlit'];
            let isToc = false;
            for (let k = 0; k < tocKeywords.length; k++) {
                if (lower.includes(tocKeywords[k])) { isToc = true; break; }
            }
            if (isToc) {
                currentHtml += '<h2 class="toc-title">' + line + '</h2><div style="height:0.8em"></div>';
                continue;
            }

            // Citat
            if (line.startsWith('"') && line.endsWith('"')) {
                currentHtml += '<p class="body-text" style="font-style: italic; text-align: center;">' + line + '</p>';
                continue;
            }

            // Rubriker i versaler utan mellanslag
            if (line === line.toUpperCase() && line.length > 3 && !line.includes(' ')) {
                currentHtml += '<p class="body-text">' + line + '</p>';
                continue;
            }

            // Vanlig text
            currentHtml += '<p class="body-text">' + line + '</p>';
        }

        if (inTable && tableRows.length > 0) {
            currentHtml += buildTable(tableRows);
        }

        bodyContent.innerHTML = currentHtml;

    } catch (error) {
        console.error('Fel vid laddning:', error);
        document.getElementById('body-content').innerHTML = '<p class="body-text">Text could not be loaded.</p>';
    }
}

        loadText().then(function() {
            if (typeof getAuthorHTML === 'function') {
                document.getElementById('author-container').innerHTML = getAuthorHTML();
            }
        });

        if (typeof getCopyrightHTML === 'function') {
            document.getElementById('copyright-container').innerHTML = getCopyrightHTML();
        }
    </script>

</body>
</html>
