<!DOCTYPE html>

<head>

    <style>
        .language-name { font-family: 'Arimo', 'Arial', sans-serif; font-size: 10pt; font-weight: normal; margin: 0; text-align: center; }
        .book-title { font-family: 'Dancing Script', cursive; font-size: 36pt; font-weight: normal; margin: 0 0 5px 0; line-height: 1.2; text-align: center; color: #1a1a1a; }
        .book-subtitle { font-family: 'Homemade Apple', cursive; font-size: 13pt; font-weight: normal; margin: 0 0 10px 0; line-height: 1.2; text-align: center; color: #1a1a1a; }
        .body-text { font-family: 'Gelasio', 'Georgia', serif; font-size: clamp(11pt, 2.5vw, 13pt); line-height: 1.6; margin: 10px 0; text-align: start; max-width: 700px; margin-left: auto; margin-right: auto; color: #1a1a1a; }
        .flag-icon { display: inline-block; width: clamp(16px, 4vw, 24px); height: auto; vertical-align: middle; border: 1px solid #ccc; filter: saturate(140%) contrast(110%); }
        #author-container { text-align: center; margin-top: 30px; }
        #author-container .author { font-family: 'Gelasio', 'Georgia', serif; font-size: 12pt; font-weight: bold; margin: 0; }
        .separator-line { border: none; border-top: 2px solid #ccc; max-width: 300px; margin: 25px auto; }
        .toc-title { font-family: 'Gelasio', 'Georgia', serif; font-size: clamp(16pt, 3vw, 20pt); font-weight: bold; text-align: center; margin: 30px 0 20px 0; color: #1a1a1a; }
        .manifesto-table { width: 100%; max-width: 700px; margin: 20px auto; border-collapse: collapse; font-family: 'Gelasio', 'Georgia', serif; font-size: clamp(10pt, 2vw, 12pt); text-align: start; }
        .manifesto-table th { background-color: #f0f0f0; font-weight: bold; padding: 10px 12px; border: 1px solid #ccc; text-align: center; }
        .manifesto-table td { padding: 10px 12px; border: 1px solid #ccc; vertical-align: top; }
        .manifesto-table tr:nth-child(even) td { background-color: #f9f9f9; }
        .manifesto-table td:first-child { font-weight: bold; text-align: center; white-space: nowrap; width: 60px; }
        .nav-wrapper { display: flex; align-items: center; justify-content: flex-start; gap: 16px; max-width: 800px; margin: 0 auto; padding: 12px 20px; background: transparent; position: sticky; top: 0; z-index: 500; flex-wrap: wrap; }
        .read-menu { display: inline-block; font-family: sans-serif; font-size: 14px; flex-shrink: 0; }
        .read-menu select { padding: 6px 12px; border-radius: 8px; border: 1px solid #ccc; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(4px); font-size: 13px; cursor: pointer; transition: border-color 0.2s; font-family: sans-serif; }
        .read-menu select:hover { border-color: #888; }
        .read-menu select:focus { outline: none; border-color: #555; }
        #main-menu { display: inline-block; }
        @media (max-width: 600px) { .nav-wrapper { padding: 8px 12px; gap: 10px; } .read-menu select { font-size: 12px; padding: 4px 8px; } }
        @media only screen and (max-width: 768px) { .book-title { font-size: 28pt !important; } .book-subtitle { font-size: 12pt !important; } .language-name { font-size: 9pt !important; } .body-text { padding: 0 15px; } .manifesto-table td, .manifesto-table th { padding: 6px 8px; font-size: 9pt; } }
        @media only screen and (max-width: 430px) { .book-title { font-size: 22pt !important; } .book-subtitle { font-size: 11pt !important; } .language-name { font-size: 8pt !important; } .manifesto-table td, .manifesto-table th { padding: 4px 6px; font-size: 8pt; } }
    </style>

window.languages = languages;

    <script type="module">
        import { pickBestLanguage, saveLanguage, getSavedLanguage } from './js/lang.js';

        // Fyll rullgardinen och hantera val
        function setupSelect(currentLang) {
            const select = document.getElementById('read-select');
            if (!select) return;
            // Sortera språk efter namn
            const sortedLangs = Object.keys(languages).sort((a,b) => languages[a].name.localeCompare(languages[b].name));
            // Rensa och fyll på nytt (behåll första "Välj språk")
            const first = select.options[0];
            select.innerHTML = '';
            select.appendChild(first);
            sortedLangs.forEach(code => {
                const option = document.createElement('option');
                option.value = code;
                option.textContent = languages[code].name;
                if (code === currentLang) option.selected = true;
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                const val = e.target.value;
                if (!val) return;
                saveLanguage(val); // Kom ihåg utan cookies!
                window.location.href = 'read.html?lang=' + val;
            });
        }

        // FIXAD: Baskiska eu -> es, galiciska gl -> es osv. även via ?lang=eu
        const urlParams = new URLSearchParams(window.location.search);
        const rawUrlLang = urlParams.get('lang');
        let lang;
        if (rawUrlLang) {
            // Använd pickBestLanguage för att mappa eu->es, ca->es, gl->es, sv-ax->sv osv.
            const mapped = pickBestLanguage(Object.keys(languages), [rawUrlLang]);
            lang = mapped;
            saveLanguage(lang);
        } else {
            lang = pickBestLanguage(); // kollar localStorage först, sedan webbläsare + fallback
        }

        // 2. Hitta data
        const langData = languages[lang] || languages['en'];

        // 3. Uppdatera sidan
        document.documentElement.lang = lang;
        document.documentElement.dir = ['ar','he','fa','ur'].includes(lang) ? 'rtl' : 'ltr';
        const flagIcon = document.getElementById('flag-icon');
        const langLabel = document.getElementById('language-label');
        const langTitle = document.getElementById('lang-title');
        const langSubtitle = document.getElementById('lang-subtitle');
        if (flagIcon) { flagIcon.src = langData.flag; flagIcon.alt = langData.name; }
        if (langLabel) langLabel.textContent = langData.name;
        if (langTitle) langTitle.textContent = langData.title;
        if (langSubtitle) langSubtitle.textContent = langData.subtitle;

        setupSelect(lang);

        // 4. Hjälpfunktioner för tabell
        function splitRow(row) {
            if (row.includes('\t')) return row.split(/\t+/).map(c => c.trim()).filter(c => c !== '');
            return row.split(/\s*\|\s*/).map(c => c.trim()).filter(c => c !== '');
        }
        function buildTable(rows) {
            if (rows.length === 0) return '';
            const splitRows = rows.map(row => splitRow(row));
            const maxCols = Math.max(...splitRows.map(r => r.length));
            const normalizedRows = splitRows.map(r => { while (r.length < maxCols) r.push(''); return r; });
            let html = `<table class="manifesto-table"><thead><tr>`;
            normalizedRows[0].forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;
            for (let r = 1; r < normalizedRows.length; r++) {
                html += `<tr>`;
                normalizedRows[r].forEach(c => html += `<td>${c}</td>`);
                html += `</tr>`;
            }
            html += `</tbody></table>`;
            return html;
        }
        async function loadText() {
            try {
                const response = await fetch(`lang_texts/${lang}.txt`);
                if (!response.ok) throw new Error('Textfil saknas');
                const text = await response.text();
                const lines = text.split('\n');
                const nonEmptyLines = lines.filter(line => line.trim() !== '');
                const bodyContent = document.getElementById('body-content');
                let currentHtml = '';
                let tableRows = []; let inTable = false;
                for (let i = 3; i < nonEmptyLines.length; i++) {
                    let line = nonEmptyLines[i].trim();
                    if (line === '') {
                        if (inTable && tableRows.length > 0) { currentHtml += buildTable(tableRows); tableRows = []; inTable = false; }
                        continue;
                    }
                    const pipeCount = (line.match(/\|/g) || []).length;
                    const tabCount = (line.match(/\t/g) || []).length;
                    const isTableRow = (pipeCount >= 2 || tabCount >= 2);
                    if (isTableRow) { if (!inTable) { inTable = true; tableRows = []; } tableRows.push(line); continue; }
                    if (inTable && tableRows.length > 0) { currentHtml += buildTable(tableRows); tableRows = []; inTable = false; }
                    if (line.match(/^=+$/)) { currentHtml += `<hr class="separator-line">`; continue; }
                    if (line.toLowerCase() === 'table of contents') { currentHtml += `<h2 class="toc-title">${line}</h2>`; continue; }
                    if (line.startsWith('"') && line.endsWith('"')) { currentHtml += `<p class="body-text" style="font-style: italic; text-align: center;">${line}</p>`; continue; }
                    if (line.toLowerCase() === 'to be done') { currentHtml += `<h2 style="font-family: 'Dancing Script', cursive; font-size: clamp(20pt, 5vw, 32pt); font-weight: normal; text-align: center; margin: 40px 0 20px 0; color: #1a1a1a;">To be done</h2>`; continue; }
                    if (line === line.toUpperCase() && line.length > 3 && !line.includes(' ')) { currentHtml += `<p class="body-text">${line}</p>`; continue; }
                    currentHtml += `<p class="body-text">${line}</p>`;
                }
                if (inTable && tableRows.length > 0) currentHtml += buildTable(tableRows);
                if (bodyContent) bodyContent.innerHTML = currentHtml;
            } catch (error) {
                console.error('Fel vid laddning:', error);
                const bc = document.getElementById('body-content');
                if (bc) bc.innerHTML = '<p class="body-text">Text could not be loaded.</p>';
            }
        }
        loadText();

        if (typeof getAuthorHTML === 'function') {
            document.getElementById('author-container').innerHTML = getAuthorHTML();
        }
        if (typeof getCopyrightHTML === 'function') {
            document.getElementById('copyright-container').innerHTML = getCopyrightHTML();
        }
    </script>
