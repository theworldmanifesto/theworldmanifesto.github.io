<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The World Manifesto</title>
    <link rel="stylesheet" href="../menu.css">
    <link rel="stylesheet" href="css/lang.css">
    <style>
        /* ---------- Första sidan – fast formatering ---------- */
        .language-name {
            font-family: 'Arimo', 'Arial', sans-serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            text-align: center;
        }
        .book-title {
            font-family: 'Dancing Script', cursive;
            font-size: 36pt;
            font-weight: normal;
            margin: 0 0 5px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        .book-subtitle {
            font-family: 'Homemade Apple', cursive;
            font-size: 13pt;
            font-weight: normal;
            margin: 0 0 10px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        /* ---------- Resten av texten ---------- */
        .body-text {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(11pt, 2.5vw, 13pt);
            line-height: 1.6;
            margin: 10px 0;
            text-align: start;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #1a1a1a;
        }
        .flag-icon {
            display: inline-block;
            width: clamp(16px, 4vw, 24px);
            height: auto;
            vertical-align: middle;
            border: 1px solid #ccc;
            filter: saturate(140%) contrast(110%);
        }
        /* ---------- Författare (från author.js) ---------- */
        #author-container {
            text-align: center;
            margin-top: 30px;
        }
        #author-container .author {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: 12pt;
            font-weight: bold;
            margin: 0;
        }
        /* ---------- Separator ---------- */
        .separator-line {
            border: none;
            border-top: 2px solid #ccc;
            max-width: 300px;
            margin: 25px auto;
        }
        /* ---------- Table of Contents rubrik ---------- */
        .toc-title {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(16pt, 3vw, 20pt);
            font-weight: bold;
            text-align: center;
            margin: 30px 0 20px 0;
            color: #1a1a1a;
        }
        /* ---------- TABELL ---------- */
        .manifesto-table {
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
            border-collapse: collapse;
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(10pt, 2vw, 12pt);
            text-align: start;
        }
        .manifesto-table th {
            background-color: #f0f0f0;
            font-weight: bold;
            padding: 10px 12px;
            border: 1px solid #ccc;
            text-align: center;
        }
        .manifesto-table td {
            padding: 10px 12px;
            border: 1px solid #ccc;
            vertical-align: top;
        }
        .manifesto-table tr:nth-child(even) td {
            background-color: #f9f9f9;
        }
        .manifesto-table td:first-child {
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            width: 60px;
        }

        /* ---------- NAV-WRAPPER (för meny) ---------- */
        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 20px;
            background: transparent;
            position: sticky;
            top: 0;
            z-index: 500;
            flex-wrap: wrap;
        }

        /* READ – språkvalsrullgardin (utan label) */
        .read-menu {
            display: inline-block;
            font-family: sans-serif;
            font-size: 14px;
            flex-shrink: 0;
        }

        .read-menu select {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s;
            font-family: sans-serif;
        }

        .read-menu select:hover {
            border-color: #888;
        }

        .read-menu select:focus {
            outline: none;
            border-color: #555;
        }

        /* MENY – INJECTAS AV MENU.JS */
        #main-menu {
            display: inline-block;
        }

        @media (max-width: 600px) {
            .nav-wrapper {
                padding: 8px 12px;
                gap: 10px;
            }
            .read-menu select {
                font-size: 12px;
                padding: 4px 8px;
            }
        }

        /* ---------- Responsiv ---------- */
        @media only screen and (max-width: 768px) {
            .book-title { font-size: 28pt !important; }
            .book-subtitle { font-size: 12pt !important; }
            .language-name { font-size: 9pt !important; }
            .body-text { padding: 0 15px; }
            .manifesto-table td, .manifesto-table th {
                padding: 6px 8px;
                font-size: 9pt;
            }
        }
        @media only screen and (max-width: 430px) {
            .book-title { font-size: 22pt !important; }
            .book-subtitle { font-size: 11pt !important; }
            .language-name { font-size: 8pt !important; }
            .manifesto-table td, .manifesto-table th {
                padding: 4px 6px;
                font-size: 8pt;
            }
        }
    </style>
</head>
<body>

    <!-- ======================================== -->
    <!-- NAVIGATION: MENY                         -->
    <!-- ======================================== -->

    <div class="nav-wrapper">

        <!-- Språkvalsrullgardin (utan label) -->
        <div class="read-menu">
            <select id="read-select" onchange="if(this.value) window.location.href='read.html?lang=' + this.value">
                <option value="">Välj språk</option>
                <option value="af">Afrikaans</option>
                <option value="ar">العربية</option>
                <option value="bg">Български</option>
                <option value="bn">বাংলা</option>
                <option value="crs">Kreol seselwa</option>
                <option value="cs">Čeština</option>
                <option value="da">Dansk</option>
                <option value="de">Deutsch</option>
                <option value="el">Ελληνικά</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fa">فارسی</option>
                <option value="fi">Suomi</option>
                <option value="fit">Meänkieli</option>
                <option value="fo">Føroyskt</option>
                <option value="fr">Français</option>
                <option value="he">עברית</option>
                <option value="hi">हिंदी</option>
                <option value="hu">Magyar</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="is">Íslenska</option>
                <option value="it">Italiano</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="nl">Nederlands</option>
                <option value="no">Norsk</option>
                <option value="pl">Polski</option>
                <option value="pt">Português</option>
                <option value="ro">Română</option>
                <option value="ru">Русский</option>
                <option value="se">Davvisámegiella</option>
                <option value="sv">Svenska</option>
                <option value="sw">Kiswahili</option>
                <option value="th">ภาษาไทย</option>
                <option value="fil">Filipino</option>
                <option value="tr">Türkçe</option>
                <option value="uk">Українська</option>
                <option value="ur">اردو</option>
                <option value="vi">Tiếng Việt</option>
                <option value="xh">isiXhosa</option>
                <option value="zh">中文</option>
                <option value="zu">isiZulu</option>
            </select>
        </div>

        <!-- MENY – INJECTAS AV MENU.JS -->
        <div id="main-menu"></div>

    </div>

    <!-- ======================================== -->
    <!-- HUVUDINNEHÅLL                             -->
    <!-- ======================================== -->

    <div class="page-container">
        <p class="language-name" id="language-name">
            <img id="flag-icon" src="" alt="" class="flag-icon" width="20" height="auto">
            <span id="language-label"></span>
        </p>
        <br>
        <h1 id="lang-title">The World Manifesto</h1>
        <h2 id="lang-subtitle"></h2>
        <br>
        <div id="author-container"></div>
        <br>
        <div id="copyright-container"></div>
        <br>
        <div id="body-content"></div>
    </div>

    <!-- ======================================== -->
    <!-- JAVASCRIPT                               -->
    <!-- ======================================== -->

    <!-- Dessa script laddas först -->
    <script src="js/author.js"></script>
    <script src="js/copyright.js"></script>

    <!-- HUVUD-SKRIPTET (modul) – laddas sist -->
    <script type="module">
        // Importera Metas språkhanterare
        import { pickBestLanguage, saveLanguage } from './js/lang.js';

        // 1. Välj bästa språk
        const lang = pickBestLanguage();

        // 2. Spara valet (kommer ihåg användaren)
        saveLanguage(lang);

        // 3. Hitta språkdata
        const langData = window.languages[lang];

        // 4. Uppdatera sidan
        if (langData) {
            document.documentElement.lang = lang;
            document.documentElement.dir = ['ar', 'he', 'fa', 'ur'].includes(lang) ? 'rtl' : 'ltr';
            document.getElementById('flag-icon').src = langData.flag;
            document.getElementById('flag-icon').alt = langData.name;
            document.getElementById('language-label').textContent = langData.name;
            document.getElementById('lang-title').textContent = langData.title;
            document.getElementById('lang-subtitle').textContent = langData.subtitle;
        }

        // 5. Ladda manifesttexten
        if (typeof loadText === 'function') {
            loadText();
        } else {
            console.warn('loadText() är inte definierad – kontrollera att den finns i ditt script.');
        }

        // 6. Ladda författare och copyright
        if (typeof getAuthorHTML === 'function') {
            document.getElementById('author-container').innerHTML = getAuthorHTML();
        }
        if (typeof getCopyrightHTML === 'function') {
            document.getElementById('copyright-container').innerHTML = getCopyrightHTML();
        }
    </script>

    <!-- ======================================== -->
    <!-- MENY + FOOTER                            -->
    <!-- ======================================== -->

    <script src="../menu.js"></script>
    <script src="../footer.js"></script>

</body>
</html>
