<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The World Manifesto</title>
    <link rel="stylesheet" href="../menu.css">
    <link rel="stylesheet" href="css/lang.css">
    <style>
        /* ---------- Första sidan – fast formatering ---------- */
        .language-name {
            font-family: 'Arimo', 'Arial', sans-serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            text-align: center;
        }
        .book-title {
            font-family: 'Dancing Script', cursive;
            font-size: 36pt;
            font-weight: normal;
            margin: 0 0 5px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        .book-subtitle {
            font-family: 'Homemade Apple', cursive;
            font-size: 13pt;
            font-weight: normal;
            margin: 0 0 10px 0;
            line-height: 1.2;
            text-align: center;
            color: #1a1a1a;
        }
        /* ---------- Resten av texten ---------- */
        .body-text {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(11pt, 2.5vw, 13pt);
            line-height: 1.6;
            margin: 10px 0;
            text-align: left;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #1a1a1a;
        }
        .flag-icon {
            display: inline-block;
            width: clamp(16px, 4vw, 24px);
            height: auto;
            vertical-align: middle;
            border: 1px solid #ccc;
            filter: saturate(140%) contrast(110%);
        }
        /* ---------- Författare (från author.js) ---------- */
        #author-container {
            text-align: center;
            margin-top: 30px;
        }
        #author-container .author {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: 12pt;
            font-weight: bold;
            margin: 0;
        }
        /* ---------- Separator ---------- */
        .separator-line {
            border: none;
            border-top: 2px solid #ccc;
            max-width: 300px;
            margin: 25px auto;
        }
        /* ---------- Table of Contents rubrik ---------- */
        .toc-title {
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(16pt, 3vw, 20pt);
            font-weight: bold;
            text-align: center;
            margin: 30px 0 20px 0;
            color: #1a1a1a;
        }
        /* ---------- TABELL ---------- */
        .manifesto-table {
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
            border-collapse: collapse;
            font-family: 'Gelasio', 'Georgia', serif;
            font-size: clamp(10pt, 2vw, 12pt);
            text-align: left;
        }
        .manifesto-table th {
            background-color: #f0f0f0;
            font-weight: bold;
            padding: 10px 12px;
            border: 1px solid #ccc;
            text-align: center;
        }
        .manifesto-table td {
            padding: 10px 12px;
            border: 1px solid #ccc;
            vertical-align: top;
        }
        .manifesto-table tr:nth-child(even) td {
            background-color: #f9f9f9;
        }
        .manifesto-table td:first-child {
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            width: 60px;
        }

        /* ---------- NAV-WRAPPER (för meny + READ) ---------- */
        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 20px;
            background: transparent;
            position: sticky;
            top: 0;
            z-index: 500;
            flex-wrap: wrap;
        }

        /* READ – språkvalsrullgardin */
        .read-menu {
            display: inline-block;
            font-family: sans-serif;
            font-size: 14px;
            flex-shrink: 0;
        }

        .read-menu label {
            margin-right: 4px;
            font-weight: bold;
            color: #1a1a1a;
        }

        .read-menu select {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s;
            font-family: sans-serif;
        }

        .read-menu select:hover {
            border-color: #888;
        }

        .read-menu select:focus {
            outline: none;
            border-color: #555;
        }

        /* MENY – INJECTAS AV MENU.JS */
        #main-menu {
            display: inline-block;
        }

        @media (max-width: 600px) {
            .nav-wrapper {
                padding: 8px 12px;
                gap: 10px;
            }
            .read-menu select {
                font-size: 12px;
                padding: 4px 8px;
            }
            .read-menu label {
                font-size: 12px;
            }
        }

        /* ---------- Responsiv ---------- */
        @media only screen and (max-width: 768px) {
            .book-title { font-size: 28pt !important; }
            .book-subtitle { font-size: 12pt !important; }
            .language-name { font-size: 9pt !important; }
            .body-text { padding: 0 15px; }
            .manifesto-table td, .manifesto-table th {
                padding: 6px 8px;
                font-size: 9pt;
            }
        }
        @media only screen and (max-width: 430px) {
            .book-title { font-size: 22pt !important; }
            .book-subtitle { font-size: 11pt !important; }
            .language-name { font-size: 8pt !important; }
            .manifesto-table td, .manifesto-table th {
                padding: 4px 6px;
                font-size: 8pt;
            }
        }
    </style>
</head>
<body>

    <!-- ======================================== -->
    <!-- NAVIGATION: READ + MENY                   -->
    <!-- ======================================== -->

    <div class="nav-wrapper">

        <!-- READ – språkvalsrullgardin -->
        <div class="read-menu">
            <label for="read-select">LÄS:</label>
            <select id="read-select" onchange="if(this.value) window.location.href='read.html?lang=' + this.value">
                <!-- DYNAMISKA SPRÅK LÄGGS TILL HÄR -->
            </select>
        </div>

        <!-- MENY – INJECTAS AV MENU.JS -->
        <div id="main-menu"></div>

    </div>

    <!-- ======================================== -->
    <!-- HUVUDINNEHÅLL                             -->
    <!-- ======================================== -->

    <div class="page-container">
        <p class="language-name" id="language-name">
            <img id="flag-icon" src="" alt="" class="flag-icon" width="20" height="auto">
            <span id="language-label"></span>
        </p>
        <br>
        <h1 id="lang-title">The World Manifesto</h1>
        <h2 id="lang-subtitle"></h2>
        <br>
        <div id="author-container"></div>
        <br>
        <div id="body-content"></div>
    </div>

    <!-- ======================================== -->
    <!-- JAVASCRIPT                               -->
    <!-- ======================================== -->

    <script src="js/author.js"></script>
    <script>
        // ============================================================
        // 1. SPRÅKDATA – 42 språk (med titlar och undertitlar)
        // ============================================================
        const languages = {
            'sv': { flag: 'flags/se.svg', name: 'Svenska', title: 'Världsmanifestet', subtitle: 'Manifestet för definitivt överflöd' },
            'en': { flag: 'flags/gb.svg', name: 'English', title: 'The World Manifesto', subtitle: 'The Manifesto for Definitive Abundance' },
            'zh': { flag: 'flags/cn.svg', name: '简体中文', title: '世界宣言', subtitle: '终极丰裕宣言' },
            'hi': { flag: 'flags/in.svg', name: 'हिन्दी', title: 'विश्व घोषणापत्र', subtitle: 'निश्चित प्रचुरता के लिए घोषणापत्र' },
            'es': { flag: 'flags/es.svg', name: 'Español', title: 'El Manifiesto Mundial', subtitle: 'El Manifiesto para la Abundancia Definitiva' },
            'fr': { flag: 'flags/fr.svg', name: 'Français', title: 'Le Manifeste Mondial', subtitle: 'Le Manifeste pour l\'Abondance Définitive' },
            'ar': { flag: 'flags/sa.svg', name: 'العربية', title: 'البيان العالمي', subtitle: 'بيان الوفرة النهائية' },
            'id': { flag: 'flags/id.svg', name: 'Bahasa Indonesia', title: 'Manifesto Dunia', subtitle: 'Manifesto untuk Kelimpahan Definitif' },
            'bn': { flag: 'flags/bd.svg', name: 'বাংলা', title: 'বিশ্ব ইশতেহার', subtitle: 'চূড়ান্ত প্রাচুর্যের ইশতেহার' },
            'pt': { flag: 'flags/pt.svg', name: 'Português', title: 'O Manifesto Mundial', subtitle: 'O Manifesto para a Abundância Definitiva' },
            'ru': { flag: 'flags/ru.svg', name: 'Русский', title: 'Всемирный манифест', subtitle: 'Манифест окончательного изобилия' },
            'uk': { flag: 'flags/ua.svg', name: 'Українська', title: 'Всесвітній маніфест', subtitle: 'Маніфест остаточного багатства' },
            'bg': { flag: 'flags/bg.svg', name: 'Български', title: 'Световен манифест', subtitle: 'Манифест за окончателно изобилие' },
            'ur': { flag: 'flags/pk.svg', name: 'اردو', title: 'عالمی منشور', subtitle: 'حتمی فراوانی کا منشور' },
            'ja': { flag: 'flags/jp.svg', name: '日本語', title: '世界宣言', subtitle: '究極の豊かさのための宣言' },
            'tl': { flag: 'flags/ph.svg', name: 'Filipino', title: 'Ang Pandaigdigang Manipesto', subtitle: 'Ang Manipesto para sa Tiyak na Kasaganaan' },
            'de': { flag: 'flags/de.svg', name: 'Deutsch', title: 'Das Weltmanifest', subtitle: 'Das Manifest für den definitiven Überfluss' },
            'ko': { flag: 'flags/kr.svg', name: '한국어', title: '세계 선언문', subtitle: '최종적 풍요를 위한 선언문' },
            'th': { flag: 'flags/th.svg', name: 'ไทย', title: 'แถลงการณ์โลก', subtitle: 'แถลงการณ์เพื่อความอุดมสมบูรณ์ขั้นสุดท้าย' },
            'vi': { flag: 'flags/vn.svg', name: 'Tiếng Việt', title: 'Tuyên ngôn Thế giới', subtitle: 'Tuyên ngôn cho Sự phong phú Cuối cùng' },
            'tr': { flag: 'flags/tr.svg', name: 'Türkçe', title: 'Dünya Manifestosu', subtitle: 'Nihai Bolluk Manifestosu' },
            'fa': { flag: 'flags/ir.svg', name: 'فارسی', title: 'مانیفست جهانی', subtitle: 'مانیفست فراوانی نهایی' },
            'sw': { flag: 'flags/tz.svg', name: 'Kiswahili', title: 'Ilani ya Dunia', subtitle: 'Ilani ya Wingi wa Mwisho' },
            'it': { flag: 'flags/it.svg', name: 'Italiano', title: 'Il Manifesto Mondiale', subtitle: 'Il Manifesto per l\'Abbondanza Definitiva' },
            'pl': { flag: 'flags/pl.svg', name: 'Polski', title: 'Manifest Światowy', subtitle: 'Manifest Ostatecznej Obfitości' },
            'nl': { flag: 'flags/nl.svg', name: 'Nederlands', title: 'Het Wereldmanifest', subtitle: 'Het Manifest voor Definitieve Overvloed' },
            'ro': { flag: 'flags/ro.svg', name: 'Română', title: 'Manifestul Mondial', subtitle: 'Manifestul pentru Abundența Definitivă' },
            'el': { flag: 'flags/gr.svg', name: 'Ελληνικά', title: 'Παγκόσμιο Μανιφέστο', subtitle: 'Μανιφέστο για την Οριστική Αφθονία' },
            'af': { flag: 'flags/za.svg', name: 'Afrikaans', title: 'Die Wêreldmanifest', subtitle: 'Die Manifest vir Definitiewe Oorvloed' },
            'zu': { flag: 'flags/za.svg', name: 'isiZulu', title: 'Umbhalo Wezwe', subtitle: 'Umbhalo Wokuchichima Okuphelele' },
            'xh': { flag: 'flags/za.svg', name: 'isiXhosa', title: 'Isibhengezo Sehlabathi', subtitle: 'Isibhengezo Sobuninzi Obugqibeleleyo' },
            'cs': { flag: 'flags/cz.svg', name: 'Čeština', title: 'Světový manifest', subtitle: 'Manifest pro konečnou hojnost' },
            'hu': { flag: 'flags/hu.svg', name: 'Magyar', title: 'Világkiáltvány', subtitle: 'A végső bőség manifesztuma' },
            'he': { flag: 'flags/il.svg', name: 'עברית', title: 'המניפסט העולמי', subtitle: 'המניפסט לשפע המוחלט' },
            'crs': { flag: 'flags/sc.svg', name: 'Seselwa', title: 'Manifest Lemonn', subtitle: 'Manifest pour Labondans Definitif' },
            'se': { flag: 'flags/dsg.svg', name: 'Davvisámegiella', title: 'Máilmmi Manifesta', subtitle: 'Manifesta buot viimma gollu várás' },
            'fit': { flag: 'flags/fit.svg', name: 'Meänkieli', title: 'Mailmanmanifesti', subtitle: 'Manifesti lopullisen yltäkylläisyyden puolesta' },
            'no': { flag: 'flags/no.svg', name: 'Norsk', title: 'Verdensmanifestet', subtitle: 'Manifestet for det definitive overflødet' },
            'fi': { flag: 'flags/fi.svg', name: 'Suomi', title: 'Maailmanmanifesti', subtitle: 'Manifesti lopulliselle yltäkylläisyydelle' },
            'da': { flag: 'flags/dk.svg', name: 'Dansk', title: 'Verdensmanifestet', subtitle: 'Manifestet for det definitive overflod' },
            'is': { flag: 'flags/is.svg', name: 'Íslenska', title: 'Heimsmanifestið', subtitle: 'Manifestið fyrir endanlegt gnægð' },
            'fo': { flag: 'flags/fo.svg', name: 'Føroyskt', title: 'Heimsmanifestið', subtitle: 'Manifestið fyri endaliga nógv' }
        };

        function getPreferredLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && languages[urlLang]) return urlLang;
            const browserLang = navigator.language || navigator.languages?.[0] || 'en';
            const langCode = browserLang.split('-')[0].toLowerCase();
            if (languages[langCode]) return langCode;
            return 'en';
        }

        const lang = getPreferredLanguage();
        const langData = languages[lang];

        // Sätt flagga och språknamn
        document.getElementById('flag-icon').src = langData.flag;
        document.getElementById('flag-icon').alt = langData.name;
        document.getElementById('language-label').textContent = langData.name;

        // Uppdatera rubriker
        document.getElementById('lang-title').textContent = langData.title;
        document.getElementById('lang-subtitle').textContent = langData.subtitle;

        // ============================================================
        // 2. LADDA SPRÅKVÄLJAREN (READ-rullgardinen)
        // ============================================================
        const select = document.getElementById('read-select');
        // Sortera språk efter namn
        const sortedLangs = Object.keys(languages).sort((a, b) => languages[a].name.localeCompare(languages[b].name));
        sortedLangs.forEach(code => {
            const option = document.createElement('option');
            option.value = code;
            option.textContent = languages[code].name;
            if (code === lang) option.selected = true;
            select.appendChild(option);
        });

        // ============================================================
        // 3. HJÄLPFUNKTION: DELA EN RAD PÅ SEPARATOR
        // ============================================================
        function splitRow(row) {
            if (row.includes('\t')) {
                return row.split(/\t+/).map(cell => cell.trim()).filter(cell => cell !== '');
            }
            return row.split(/\s*\|\s*/).map(cell => cell.trim()).filter(cell => cell !== '');
        }

        // ============================================================
        // 4. BYGG EN HTML-TABELL FRÅN TABELLRADER
        // ============================================================
        function buildTable(rows) {
            if (rows.length === 0) return '';

            const splitRows = rows.map(row => splitRow(row));
            const maxCols = Math.max(...splitRows.map(r => r.length));
            const normalizedRows = splitRows.map(r => {
                while (r.length < maxCols) r.push('');
                return r;
            });

            let html = `<table class="manifesto-table">`;
            const headers = normalizedRows[0];
            html += `<thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;

            for (let r = 1; r < normalizedRows.length; r++) {
                const cells = normalizedRows[r];
                html += `<tr>`;
                cells.forEach(c => html += `<td>${c}</td>`);
                html += `</tr>`;
            }

            html += `</tbody></table>`;
            return html;
        }

        // ============================================================
        // 5. LADDA TEXT – HOPPAR ÖVER DE 3 FÖRSTA ICKE-TOMMA RADERNA
        // ============================================================
        async function loadText() {
            try {
                const response = await fetch(`lang_texts/${lang}.txt`);
                if (!response.ok) throw new Error('Textfil saknas');
                const text = await response.text();

                const lines = text.split('\n');
                const nonEmptyLines = lines.filter(line => line.trim() !== '');
                const bodyContent = document.getElementById('body-content');
                let currentHtml = '';
                
                let tableRows = [];
                let inTable = false;

                for (let i = 3; i < nonEmptyLines.length; i++) {
                    let rawLine = nonEmptyLines[i];
                    let line = rawLine.trim();

                    if (line === '') {
                        if (inTable && tableRows.length > 0) {
                            currentHtml += buildTable(tableRows);
                            tableRows = [];
                            inTable = false;
                        }
                        continue;
                    }

                    const pipeCount = (line.match(/\|/g) || []).length;
                    const tabCount = (line.match(/\t/g) || []).length;
                    const isTableRow = (pipeCount >= 2 || tabCount >= 2);

                    if (isTableRow) {
                        if (!inTable) {
                            inTable = true;
                            tableRows = [];
                        }
                        tableRows.push(line);
                        continue;
                    }

                    if (inTable && tableRows.length > 0) {
                        currentHtml += buildTable(tableRows);
                        tableRows = [];
                        inTable = false;
                    }

                    if (line.match(/^=+$/)) {
                        currentHtml += `<hr class="separator-line">`;
                        continue;
                    }

                    if (line.toLowerCase() === 'table of contents') {
                        currentHtml += `<h2 class="toc-title">${line}</h2>`;
                        continue;
                    }

                    if (line.startsWith('"') && line.endsWith('"')) {
                        currentHtml += `<p class="body-text" style="font-style: italic; text-align: center;">${line}</p>`;
                        continue;
                    }

                    if (line.toLowerCase() === 'to be done') {
                        currentHtml += `<h2 style="font-family: 'Dancing Script', cursive; font-size: clamp(20pt, 5vw, 32pt); font-weight: normal; text-align: center; margin: 40px 0 20px 0; color: #1a1a1a;">To be done</h2>`;
                        continue;
                    }

                    if (line === line.toUpperCase() && line.length > 3 && !line.includes(' ')) {
                        currentHtml += `<p class="body-text">${line}</p>`;
                        continue;
                    }

                    currentHtml += `<p class="body-text">${line}</p>`;
                }

                if (inTable && tableRows.length > 0) {
                    currentHtml += buildTable(tableRows);
                }

                bodyContent.innerHTML = currentHtml;

            } catch (error) {
                console.error('Fel vid laddning:', error);
                document.getElementById('body-content').innerHTML = '<p class="body-text">Text could not be loaded.</p>';
            }
        }

        // ============================================================
        // 6. KÖR
        // ============================================================
        loadText();

        if (typeof getAuthorHTML === 'function') {
            document.getElementById('author-container').innerHTML = getAuthorHTML();
        }
    </script>

    <!-- ======================================== -->
    <!-- MENY + FOOTER                            -->
    <!-- ======================================== -->

    <script src="../menu.js"></script>
    <script src="../footer.js"></script>

</body>
</html>
