<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>El Manifiesto Mundial</title>

    <!-- Google Fonts (BORTTAGEN – använder lokala fonter från GitHub) -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Homemade+Apple&family=EB+Garamond&family=Roboto:wght@400;700&display=swap" rel="stylesheet"> -->

    <!-- Lang CSS -->
    <link rel="stylesheet" href="css/lang.css">
</head>
<body>

    <div class="page-container">

        <!-- SPRÅKNAMN med SVG-flagga -->
        <p class="language-name">
            <img src="flags/es.svg" alt="Bandera de España" class="flag-icon" width="20" height="auto">&nbsp;&nbsp;Español
        </p>

        <br><br>

        <!-- BOKTITEL (laddas från textfil) -->
        <h1 class="book-title" id="book-title">El Manifiesto Mundial</h1>

        <br>

        <!-- BRÖDTEXT (laddas från textfil) -->
        <p class="body-text" id="body-text">
            El Manifiesto por la<br>
            Abundancia Definitiva
        </p>

        <!-- FÖRFATTARE (laddas från author.js) -->
        <div id="author-container"></div>

    </div>

    <!-- JavaScript -->
    <script src="js/author.js"></script>
    <script>
        // Ladda text från språkfil
        async function loadLanguageText() {
            try {
                const response = await fetch('lang_texts/es.txt');
                if (!response.ok) throw new Error('Kunde inte ladda textfil');
                const text = await response.text();
                
                // Parsa textfilen (förutsätter format: TITLE|BODY)
                const lines = text.split('\n').filter(line => line.trim() !== '');
                if (lines.length >= 2) {
                    document.getElementById('book-title').textContent = lines[0].trim();
                    document.getElementById('body-text').innerHTML = lines[1].trim().replace(/\n/g, '<br>');
                }
            } catch (error) {
                console.error('Fel vid laddning av text:', error);
                // Fallback till hårdkodad text
            }
        }

        // Ladda text och författare
        loadLanguageText();
        document.getElementById('author-container').innerHTML = getAuthorHTML();
    </script>

</body>
</html>
