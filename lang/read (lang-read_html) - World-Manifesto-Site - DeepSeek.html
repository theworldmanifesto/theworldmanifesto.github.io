    <script type="module">
      import { pickBestLanguage, saveLanguage, getSavedLanguage, AVAILABLE, RELATED_FALLBACK } from './js/lang.js';

      window._available = AVAILABLE;
      window._related = RELATED_FALLBACK;
      window._pick = () => pickBestLanguage(AVAILABLE);
      window._saveLang = saveLanguage;
      window._getSaved = getSavedLanguage;

      const urlParams = new URLSearchParams(window.location.search);
      const urlLangParam = urlParams.get('lang');

      if (urlLangParam) {
          const lc = urlLangParam.toLowerCase();
          const mapped = RELATED_FALLBACK[lc] || lc;
          if (AVAILABLE.includes(mapped)) {
              saveLanguage(mapped);
          } else if (AVAILABLE.includes(lc)) {
              saveLanguage(lc);
          }
      }

      window.addEventListener('DOMContentLoaded', () => {
          const select = document.getElementById('read-select');
          if (!select) return;

          const current = urlLangParam ? urlLangParam.toLowerCase() : pickBestLanguage(AVAILABLE);
          const mappedCurrent = RELATED_FALLBACK[current] || current;
          if (select.querySelector(`option[value="${mappedCurrent}"]`)) {
              select.value = mappedCurrent;
          } else if (select.querySelector(`option[value="${current}"]`)) {
              select.value = current;
          }

          select.addEventListener('change', (e) => {
              const val = e.target.value;
              if (!val) return;
              saveLanguage(val);
              window.location.href = 'read.html?lang=' + val;
          });
      });
    </script>

function replaceCities(text, lang) {
    const map = CITY_REPLACEMENTS[lang];
    if (!map) return text;
    let out = text;
    for (const [city, country] of Object.entries(map)) {
        // Global ersättning, skiftlägeskänslig på första bokstaven
        out = out.split(city).join(country);
    }
    return out;
}

// 3. SPRÅKVAL (samma som tidigare)

function getPreferredLanguage() {
    const urlParams = new URLSearchParams(window.location.search);
    const urlLang = urlParams.get('lang');
    if (urlLang) {
        const lc = urlLang.toLowerCase();
        if (window._available && window._available.includes(lc)) {
            try { localStorage.setItem('world-manifesto-lang', lc); } catch(e){}
            return lc;
        }
        if (window._related && window._related[lc]) {
            const mapped = window._related[lc];
            try { localStorage.setItem('world-manifesto-lang', mapped); } catch(e){}
            return mapped;
        }
        if (languages[lc]) return lc;
    }
    try {
        const saved = localStorage.getItem('world-manifesto-lang');
        if (saved && languages[saved]) return saved;
    } catch(e){}
    if (window._pick) {
        const best = window._pick();
        if (languages[best]) return best;
    }
    const browserLang = navigator.language || (navigator.languages && navigator.languages[0]) || 'en';
    const langCode = browserLang.split('-')[0].toLowerCase();
    if (languages[langCode]) return langCode;
    return 'en';
}

// ============================================================
// 4. HJÄLPFUNKTIONER (tabeller, rader)
// ============================================================
function escapeHtml(s) {
    return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function splitRow(row) {
    if (row.includes('\t')) {
        return row.split(/\t+/).map(c => c.trim()).filter(c => c !== '');
    }
    return row.split(/\s*\|\s*/).map(c => c.trim()).filter(c => c !== '');
}

function buildTable(rows) {
    if (rows.length === 0) return '';
    const splitRows = rows.map(r => splitRow(r));
    const maxCols = Math.max(...splitRows.map(r => r.length));
    const normalized = splitRows.map(r => {
        while (r.length < maxCols) r.push('');
        return r;
    });

    let html = '<table class="manifesto-table">';
    const headers = normalized[0];
    html += '<thead><tr>';
    headers.forEach(h => html += `<th>${escapeHtml(h)}</th>`);
    html += '</tr></thead><tbody>';
    for (let r = 1; r < normalized.length; r++) {
        html += '<tr>';
        normalized[r].forEach(c => html += `<td>${escapeHtml(c)}</td>`);
        html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
}

// ============================================================
// 5. KAPITELPARSER
//    Delar upp texten i block på rader som bara består av "=" (minst 3).
//    De tre första blocken (metadata, gammal TOC, status) hoppas över.
// ============================================================
function parseChapters(text) {
    const rawLines = text.split('\n');

    // Bygg "block" – varje block är en array av rader mellan två =====-rader.
    const blocks = [];
    let current = [];
    let separatorCount = 0;

    for (const rawLine of rawLines) {
        const trimmed = rawLine.trim();
        // Separator: endast '='-tecken, minst 3
        if (/^=+$/.test(trimmed) && trimmed.length >= 3) {
            blocks.push(current);
            current = [];
            separatorCount++;
            continue;
        }
        current.push(rawLine);
    }
    // Sista blocket (efter sista separatorn)
    blocks.push(current);

    // blocks[0] = titel + författare
    // blocks[1] = "Första utgåvan" + status-text
    // blocks[2] = gammal innehållsförteckning
    // blocks[3..] = kapitel
    // Vi hoppar över 0,1,2.

    const chapters = [];
    for (let i = 3; i < blocks.length; i++) {
        const block = blocks[i];
        // Hitta första icke-tomma raden = rubriken
        let titleIdx = -1;
        for (let j = 0; j < block.length; j++) {
            if (block[j].trim() !== '') { titleIdx = j; break; }
        }
        if (titleIdx === -1) continue; // helt tomt block
        const title = block[titleIdx].trim();
        const bodyLines = block.slice(titleIdx + 1);
        chapters.push({ title, bodyLines });
    }
    return chapters;
}

    let html = '';
    let tableRows = [];
    let inTable = false;

    const flushTable = () => {
        if (inTable && tableRows.length > 0) {
            html += buildTable(tableRows);
            tableRows = [];
        }
        inTable = false;
    };

    for (let i = 0; i < lines.length; i++) {
        const raw = lines[i];
        const line = raw.trim();

        if (line === '') {
            flushTable();
            continue;
        }

        // "====="-liknande rader inuti ett block (borde inte hända, men säkert)
        if (/^=+$/.test(line) && line.length >= 3) {
            flushTable();
            html += '<hr class="separator-line">';
            continue;
        }

        // Tabellrad?
        const pipeCount = (line.match(/\|/g) || []).length;
        const tabCount = (line.match(/\t/g) || []).length;
        const isTableRow = (pipeCount >= 2 || tabCount >= 2);

        if (isTableRow) {
            if (!inTable) {
                inTable = true;
                tableRows = [];
            }
            tableRows.push(line);
            continue;
        }

        flushTable();

        // Citat (rad som börjar och slutar med ")
        if (line.startsWith('"') && line.endsWith('"') && line.length > 2) {
            html += `<p class="body-text" style="font-style: italic; text-align: center;">${escapeHtml(replaceCities(line, lang))}</p>`;
            continue;
        }

        // Rubrik inuti kapitlet? (VERSALER, ett ord, minst 4 tecken) – som förr
        if (line === line.toUpperCase() && line.length > 3 && !line.includes(' ')) {
            html += `<p class="body-text">${escapeHtml(replaceCities(line, lang))}</p>`;
            continue;
        }

        // Vanligt stycke
        html += `<p class="body-text">${escapeHtml(replaceCities(line, lang))}</p>`;
    }
    flushTable();
    return html;
}

// ============================================================
// 7. HUVUDFUNKTION
// ============================================================
async function loadText() {
    const bodyContent = document.getElementById('body-content');
    try {
        const response = await fetch(`lang_texts/${lang}.txt`);
        if (!response.ok) throw new Error('Textfil saknas');
        const text = await response.text();

        const chapters = parseChapters(text);
        if (chapters.length === 0) {
            bodyContent.innerHTML = '<p class="body-text">Inga kapitel hittades.</p>';
            return;
        }

        // Bygg TOC
        let tocHtml = '<nav class="toc-nav" aria-label="Innehållsförteckning"><ol>';
        chapters.forEach((ch, idx) => {
            const id = 'kap-' + (idx + 1);
            const safeTitle = escapeHtml(replaceCities(ch.title, lang));
            tocHtml += `<li><a class="toc-link" href="#${id}">${safeTitle}</a></li>`;
        });
        tocHtml += '</ol></nav>';

        // Bygg kapitelinnehåll
        let contentHtml = '';
        chapters.forEach((ch, idx) => {
            const id = 'kap-' + (idx + 1);
            const safeTitle = escapeHtml(replaceCities(ch.title, lang));
            contentHtml += `<section class="chapter" id="${id}">`;
            contentHtml += `<h2 class="toc-title chapter-heading">${safeTitle}</h2>`;
            contentHtml += renderChapterBody(ch.bodyLines, lang);
            contentHtml += '</section>';
            contentHtml += '<hr class="separator-line">';
        });

        // "Tillbaka till toppen"
        const backToTop = '<a class="back-to-top" href="#book-title">↑ ' +
            (lang === 'sv' ? 'Tillbaka till toppen' :
             lang === 'de' ? 'Zurück nach oben' :
             lang === 'fr' ? 'Retour en haut' :
             lang === 'es' ? 'Volver arriba' :
             lang === 'zh' ? '返回顶部' :
             'Back to top') + '</a>';

        bodyContent.innerHTML = tocHtml + contentHtml + backToTop;

        // Mjuk scroll vid klick (för webbläsare som inte stödjer scroll-behavior)
        bodyContent.querySelectorAll('.toc-link').forEach(a => {
            a.addEventListener('click', (e) => {
                const href = a.getAttribute('href');
                if (!href || !href.startsWith('#')) return;
                const target = document.querySelector(href);
                if (!target) return;
                e.preventDefault();
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                history.replaceState(null, '', href);
            });
        });

    } catch (error) {
        console.error('Fel vid laddning:', error);
        bodyContent.innerHTML = '<p class="body-text">Text could not be loaded.</p>';
    }
}

loadText();

if (typeof getAuthorHTML === 'function') {
    document.getElementById('author-container').innerHTML = getAuthorHTML();
}
if (typeof getCopyrightHTML === 'function') {
    document.getElementById('copyright-container').innerHTML = getCopyrightHTML();
}
