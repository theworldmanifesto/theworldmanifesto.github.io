    <!-- ======================================== -->
    <!-- SLOGAN-LOGIK + SPRÅK                     -->
    <!-- ======================================== -->

    <script>
        const PAGE = "https://sites.google.com/view/worldmanifesto/";
        const MANIFESTO = "The World Manifesto";
        const COPIED = "Copied!";

        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = (urlParams.get('lang') || navigator.language || 'sv').split('-')[0].toLowerCase();

        const pageTranslations = {
            'en': { title: 'The World Manifesto' },
            'zh': { title: '世界宣言' },
            'hi': { title: 'विश्व घोषणापत्र' },
            'es': { title: 'El Manifiesto Mundial' },
            'fr': { title: 'Le Manifeste Mondial' },
            'ar': { title: 'البيان العالمي' },
            'bn': { title: 'বিশ্ব ইশতেহার' },
            'pt': { title: 'O Manifesto Mundial' },
            'ru': { title: 'Всемирный манифест' },
            'ur': { title: 'عالمی منشور' },
            'id': { title: 'Manifest Dunia' },
            'de': { title: 'Weltmanifest' },
            'ja': { title: '世界宣言' },
            'sw': { title: 'Ilani ya Dunia' },
            'tl': { title: 'Manipesto ng Mundo' },
            'tr': { title: 'Dünya Manifestosu' },
            'vi': { title: 'Tuyên ngôn Thế giới' },
            'ko': { title: '세계 선언문' },
            'fa': { title: 'مانیفست جهانی' },
            'it': { title: 'Manifesto Mondiale' },
            'th': { title: 'แถลงการณ์โลก' },
            'pl': { title: 'Manifest Światowy' },
            'uk': { title: 'Всесвітній маніфест' },
            'nl': { title: 'Wereldmanifest' },
            'ro': { title: 'Manifestul Mondial' },
            'el': { title: 'Παγκόσμιο Μανιφέστο' },
            'hu': { title: 'Világkiáltvány' },
            'cs': { title: 'Světový manifest' },
            'sv': { title: 'Världsmanifestet' },
            'bg': { title: 'Световен манифест' },
            'no': { title: 'Verdensmanifestet' },
            'da': { title: 'Verdensmanifestet' },
            'fi': { title: 'Maailmanmanifesti' },
            'he': { title: 'מניפוסט העולם' },
            'af': { title: 'Wêreldmanifest' },
            'zu': { title: 'IManifesto Yomhlaba' },
            'xh': { title: 'IManifesto Yehlabathi' },
            'is': { title: 'Heimsmanifestið' },
            'fo': { title: 'Heimsskráin' },
            'crs': { title: 'Manifest lemonn' },
            'se': { title: 'Máilmmi Manifesta' },
            'fit': { title: 'Mailmanmanifesti' }
        };

        const titleText = pageTranslations[currentLang]?.title || pageTranslations['en'].title;
        document.getElementById('main-title').textContent = titleText;
        document.title = titleText;

        // ---------- SLOGAN-LOGIK ----------
        let slogans = [];
        let i = 0, paused = false;

        const btnX = document.getElementById('btn-x');
        const btnFb = document.getElementById('btn-fb');
        const btnWa = document.getElementById('btn-wa');
        const btnTg = document.getElementById('btn-tg');
        const btnEm = document.getElementById('btn-em');
        const btnCopy = document.getElementById('btn-copy');
        const q = document.getElementById('slogan-text');
        const dots = document.getElementById('dots');

        function openNew(u) { window.open(u, '_blank', 'noopener'); }

        function show() {
            q.style.opacity = 0;
            setTimeout(() => {
                const t = slogans[i];
                const share = '"' + t + '" ' + PAGE;
                q.textContent = '"' + t + '"';
                q.style.opacity = 1;

                const uX = 'https://x.com/intent/tweet?text=' + encodeURIComponent(share);
                const uF = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(PAGE) + '&quote=' + encodeURIComponent(t);
                const uW = 'https://wa.me/?text=' + encodeURIComponent(share);
                const uT = 'https://t.me/share/url?url=' + encodeURIComponent(PAGE) + '&text=' + encodeURIComponent('"' + t + '"');
                const uM = 'mailto:?subject=' + encodeURIComponent(MANIFESTO) + '&body=' + encodeURIComponent(share);

                btnX.onclick = (e) => { e.preventDefault(); openNew(uX); };
                btnFb.onclick = (e) => { e.preventDefault(); openNew(uF); };
                btnWa.onclick = (e) => { e.preventDefault(); openNew(uW); };
                btnTg.onclick = (e) => { e.preventDefault(); openNew(uT); };
                btnEm.onclick = (e) => { e.preventDefault(); window.location.href = uM; };
                btnCopy.onclick = (e) => {
                    e.preventDefault();
                    navigator.clipboard.writeText(share);
                    const old = btnCopy.textContent;
                    btnCopy.textContent = COPIED;
                    setTimeout(() => btnCopy.textContent = old, 1200);
                };

                [...dots.children].forEach((a, b) => a.className = b === i ? 'dot on' : 'dot');
            }, 200);
        }

        document.getElementById('slogan-box').onmouseenter = () => paused = true;
        document.getElementById('slogan-box').onmouseleave = () => paused = false;

        function next() {
            if (!paused && slogans.length > 0) {
                i = (i + 1) % slogans.length;
                show();
            }
        }

        fetch('slogans.json')
            .then(response => {
                if (!response.ok) throw new Error('Kunde inte läsa JSON');
                return response.json();
            })
            .then(data => {
                const slogansData = data[currentLang.toUpperCase()] || data['SV'] || data['EN'] || {};
                slogans = Object.values(slogansData);

                if (slogans.length > 0) {
                    slogans.forEach((_, idx) => {
                        const d = document.createElement('span');
                        d.className = 'dot' + (idx === 0 ? ' on' : '');
                        d.onclick = () => { i = idx; show(); };
                        dots.appendChild(d);
                    });
                    show();
                    setInterval(next, 10000);
                }
            })
            .catch(err => console.error('Fel:', err));

        // ---------- ÖVERSÄTT MENY + LÄS ----------
        const menuTranslations = {
            'en': { menu: 'MENU', read: 'READ:' },
            'sv': { menu: 'MENY', read: 'LÄS:' },
            'es': { menu: 'MENÚ', read: 'LEER:' },
            'fr': { menu: 'MENU', read: 'LIRE:' },
            'de': { menu: 'MENÜ', read: 'LESEN:' },
            'zh': { menu: '菜单', read: '阅读:' },
            'hi': { menu: 'मेनू', read: 'पढ़ें:' },
            'ar': { menu: 'القائمة', read: 'اقرأ:' },
            'bn': { menu: 'মেনু', read: 'পড়ুন:' },
            'pt': { menu: 'MENU', read: 'LER:' },
            'ru': { menu: 'МЕНЮ', read: 'ЧИТАТЬ:' },
            'ur': { menu: 'مینو', read: 'پڑھیں:' },
            'id': { menu: 'MENU', read: 'BACA:' },
            'ja': { menu: 'メニュー', read: '読む:' },
            'sw': { menu: 'MENU', read: 'SOMA:' },
            'tl': { menu: 'MENU', read: 'BASAHIN:' },
            'tr': { menu: 'MENÜ', read: 'OKU:' },
            'vi': { menu: 'MENU', read: 'ĐỌC:' },
            'ko': { menu: '메뉴', read: '읽기:' },
            'fa': { menu: 'منو', read: 'خواندن:' },
            'it': { menu: 'MENU', read: 'LEGGI:' },
            'th': { menu: 'เมนู', read: 'อ่าน:' },
            'pl': { menu: 'MENU', read: 'CZYTAJ:' },
            'uk': { menu: 'МЕНЮ', read: 'ЧИТАТИ:' },
            'nl': { menu: 'MENU', read: 'LEES:' },
            'ro': { menu: 'MENIU', read: 'CITEȘTE:' },
            'el': { menu: 'ΜΕΝΟΥ', read: 'ΔΙΑΒΑΣΤΕ:' },
            'hu': { menu: 'MENÜ', read: 'OLVASS:' },
            'cs': { menu: 'MENU', read: 'ČTĚTE:' },
            'bg': { menu: 'МЕНЮ', read: 'ЧЕТЕТЕ:' },
            'no': { menu: 'MENY', read: 'LES:' },
            'da': { menu: 'MENU', read: 'LÆS:' },
            'fi': { menu: 'VALIKKO', read: 'LUE:' },
            'he': { menu: 'תפריט', read: 'קרא:' },
            'af': { menu: 'MENU', read: 'LEES:' },
            'zu': { menu: 'IMENU', read: 'FUNDA:' },
            'xh': { menu: 'IMENU', read: 'FUNDA:' },
            'is': { menu: 'VALMYND', read: 'LESA:' },
            'fo': { menu: 'MENU', read: 'LES:' },
            'crs': { menu: 'MENI', read: 'LIR:' },
            'se': { menu: 'MENU', read: 'LOHKKA:' },
            'fit': { menu: 'VALIKKO', read: 'LUVE:' }
        };

        const menuT = menuTranslations[currentLang] || menuTranslations['sv'];

        const menuBtn = document.querySelector('.menu-btn');
        if (menuBtn) {
            menuBtn.textContent = '📋 ' + menuT.menu;
        }

        const readLabel = document.querySelector('.read-menu label');
        if (readLabel) {
            readLabel.textContent = menuT.read;
        }
    </script>
