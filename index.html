<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The World Manifesto</title>
    <link rel="stylesheet" href="menu.css">
    <style>
        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            line-height: 1.25;
            color: #1a1a1a;
            background-color: #fcfcfc;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
            justify-content: space-between;
        }
        main { text-align: center; }

        /* ======================================== */
        /* NAVIGATION – READ + MENY                 */
        /* ======================================== */

        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 20px;
            background: transparent;
            position: sticky;
            top: 0;
            z-index: 500;
            flex-wrap: wrap;
        }

        .read-menu {
            display: inline-block;
            font-family: sans-serif;
            font-size: 14px;
            flex-shrink: 0;
        }

        .read-menu label {
            margin-right: 4px;
            font-weight: bold;
            color: #1a1a1a;
        }

        .read-menu select {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s;
            font-family: sans-serif;
        }

        .read-menu select:hover { border-color: #888; }
        .read-menu select:focus { outline: none; border-color: #555; }

        #main-menu { display: inline-block; }

        @media (max-width: 600px) {
            .nav-wrapper { padding: 8px 12px; gap: 10px; }
            .read-menu select { font-size: 12px; padding: 4px 8px; }
            .read-menu label { font-size: 12px; }
        }

        /* ======================================== */
        /* QUOTE-RUTAN                               */
        /* ======================================== */

        #quote-box {
            max-width: 680px;
            margin: 30px auto;
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
        }

        #quote-text {
            font-size: 22px;
            line-height: 1.45;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s;
            font-style: italic;
            color: #444;
        }

        .dots { display: flex; gap: 7px; justify-content: center; margin: 14px 0; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: #ddd; cursor: pointer; }
        .dot.on { background: #111; }

        .btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; font-family: sans-serif; }
        .b { padding: 7px 12px; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: bold; cursor: pointer; }
        .bx { background: #000; color: #fff; }
        .bf { background: #1877F2; color: #fff; }
        .bw { background: #25D366; color: #fff; }
        .bt { background: #26A5E4; color: #fff; }
        .bm { background: #666; color: #fff; }
        .bc { background: #fff; color: #000; border: 1px solid #ccc; }

        /* ======================================== */
        /* FLAGGOR                                  */
        /* ======================================== */

        .lang-flags {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
            align-items: center;
        }

        .lang-flags > div { display: flex; flex-direction: column; align-items: center; }
        .lang-flags .lang-label { font-size: 12px; color: #666; display: block; margin-top: 2px; }
        .lang-flags a { text-decoration: none; transition: transform 0.2s; display: inline-block; line-height: 0; }
        .lang-flags a:hover { transform: scale(1.2); }
        .lang-flag-img { width: 30px; height: 20px; object-fit: cover; display: block; background: transparent; border: 1px solid #CCC; box-sizing: border-box; }
        .lang-flag-img[src$="kr.svg"] { width: 33.5px; height: 22px; object-fit: cover; }
        
        #steps-section {
            max-width: 680px;
            margin: 40px auto 20px auto;
            padding: 20px;
            border: 2px solid #8B0000;
            border-radius: 12px;
            background-color: #FFF8F8;
            text-align: left;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
