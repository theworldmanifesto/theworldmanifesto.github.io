<!DOCTYPE html>
<html lang="sv">
<head>

    <link rel="stylesheet" href="menu.css">
    <style>
        body {

            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .about-text span {

        @media only screen and (max-width: 768px) {

            }

    <!-- HEADER: Meny (laddas från menu.js) -->

    <!-- FOOTER (laddas från footer.js) -->
