    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function loadQuotes(langCode) {
        console.log('loadQuotes anropad med språk:', langCode);
        const container = document.getElementById('quotes-container');
        
        if (!container) {
            console.error('ERROR: Elementet "quotes-container" hittades inte i HTML!');
            return;
        }
        
        container.innerHTML = '<p>Laddar citat...</p>';

        fetch('quotes.json')
            .then(response => {
                console.log('Response status:', response.status);
                if (!response.ok) throw new Error('Kunde inte läsa JSON');
                return response.json();
            })
            .then(data => {
                console.log('JSON-data laddad. Nycklar:', Object.keys(data));
                
                const langKey = langCode.toUpperCase();
                console.log('Söker efter nyckel:', langKey);
                
                let quotesData = data[langKey];
                if (!quotesData) {
                    console.log('Språket ' + langKey + ' saknas, använder engelska istället');
                    quotesData = data['EN'] || data['SV'] || {};
                }
                
                const quotes = Object.values(quotesData);
                console.log('Antal citat:', quotes.length);
                container.innerHTML = '';

                if (quotes.length === 0) {
                    container.innerHTML = '<p style="color:#888;">Inga citat tillgängliga på detta språk.</p>';
                    return;
                }

                    const escText = escapeHtml(text);
                    const shareText = '"' + text + '" — The World Manifesto ' + PAGE;
                    const encText = encodeURIComponent(shareText);
                    const encQuote = encodeURIComponent(text);

                    const card = document.createElement('div');
                    card.className = 'quote-card';
                    card.innerHTML = `
                        <div class="quote-text">"${escText}"</div>
                        <div class="share-row">
                            <a class="btn btn-x" href="https://x.com/intent/tweet?text=${encText}" target="_blank">Share on X</a>
                            <a class="btn btn-fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(PAGE)}&quote=${encQuote}" target="_blank">Facebook</a>
                            <a class="btn btn-wa" href="https://wa.me/?text=${encText}" target="_blank">WhatsApp</a>
                            <a class="btn btn-tg" href="https://t.me/share/url?url=${encodeURIComponent(PAGE)}&text=${encQuote}" target="_blank">Telegram</a>
                            <a class="btn btn-em" href="mailto:?subject=${encodeURIComponent(MANIFESTO)}&body=${encText}" target="_blank">Email</a>
                            <a class="btn btn-copy" href="#" data-text="${encText}">Copy Link</a>
                        </div>
                    `;
                    container.appendChild(card);
                });

                container.querySelectorAll('.btn-copy').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const text = decodeURIComponent(btn.dataset.text);
                        navigator.clipboard.writeText(text);
                        const old = btn.textContent;
                        btn.textContent = 'Copied!';
                        setTimeout(() => btn.textContent = old, 1200);
                    });
                });

                document.getElementById('lang-select').value = langCode;
                console.log('Citat visade!');
            })
            .catch(err => {
                console.error('Fel vid laddning:', err);
                container.innerHTML = '<p style="color:#cc0000;">Kunde inte ladda citat. Försök igen senare.</p>';
            });
    }

    // --- LADDA CITAT VID SIDLADDNING ---
    const urlParams = new URLSearchParams(window.location.search);
    const browserLang2 = (navigator.language || 'en').split('-')[0].toLowerCase();
    const urlLang = urlParams.get('lang') || browserLang2 || 'en';
    console.log('Slutligt språk som används:', urlLang);
    document.getElementById('lang-select').value = urlLang;
    loadQuotes(urlLang);
</script>
