        };

        const urlParams = new URLSearchParams(window.location.search);
        const rawUrlLang = urlParams.get('lang');
        let currentLang = rawUrlLang ? pickBestLanguage(AVAILABLE, [rawUrlLang]) : pickBestLanguage();

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function switchLanguage(newLang) {
            if (!AVAILABLE.includes(newLang)) newLang = 'en';
            currentLang = newLang;
            const ui = uiTranslations[newLang] || uiTranslations['en'];

            const scrollY = window.scrollY;

            document.getElementById('page-title').textContent = ui.title;
            document.getElementById('page-subtitle').textContent = ui.subtitle;
            document.getElementById('lang-bar').textContent = ui.langBar;
            document.getElementById('read-more-text').innerHTML = '<a href="../lang/lang.html">' + ui.readMore + '</a>';

            setDocumentDirection(newLang);
            document.getElementById('lang-select').value = newLang;

            loadQuotes(newLang).then(function() {
                window.scrollTo(0, scrollY);
            });
        }

        function loadQuotes(langCode) {
            const container = document.getElementById('quotes-container');
            if (!container) return Promise.resolve();

            container.innerHTML = '<p>Laddar citat...</p>';

            return fetch('quotes.json')
                .then(function(response) {
                    if (!response.ok) throw new Error('Kunde inte läsa JSON');
                    return response.json();
                })
                .then(function(data) {
                    const langKey = langCode.toUpperCase();
                    let quotesData = data[langKey];
                    if (!quotesData) {
                        quotesData = data['EN'] || data['SV'] || {};
                    }

                    const quotes = Object.values(quotesData);
                    container.innerHTML = '';

                    if (quotes.length === 0) {
                        container.innerHTML = '<p style="color:#888;">Inga citat tillgängliga på detta språk.</p>';
                        return;
                    }

                    quotes.forEach(function(text, idx) {
                        const escText = escapeHtml(text);
                        const shareText = '"' + text + '" — The World Manifesto ' + PAGE;
                        const encText = encodeURIComponent(shareText);
                        const encQuote = encodeURIComponent(text);

                        const card = document.createElement('div');
                        card.className = 'quote-card';
                        card.innerHTML =
                            '<span class="quote-num">' + (idx + 1) + '</span>' +
                            '<div class="quote-text">"' + escText + '"</div>' +
                            '<div class="share-row">' +
                                '<a class="btn btn-x" href="https://x.com/intent/tweet?text=' + encText + '" target="_blank">Share on X</a>' +
                                '<a class="btn btn-fb" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(PAGE) + '&quote=' + encQuote + '" target="_blank">Facebook</a>' +
                                '<a class="btn btn-wa" href="https://wa.me/?text=' + encText + '" target="_blank">WhatsApp</a>' +
                                '<a class="btn btn-tg" href="https://t.me/share/url?url=' + encodeURIComponent(PAGE) + '&text=' + encQuote + '" target="_blank">Telegram</a>' +
                                '<a class="btn btn-em" href="mailto:?subject=' + encodeURIComponent(MANIFESTO) + '&body=' + encText + '" target="_blank">Email</a>' +
                                '<a class="btn btn-copy" href="#" data-text="' + encText + '">Copy Link</a>' +
                            '</div>';
                        container.appendChild(card);
                    });

                    container.querySelectorAll('.btn-copy').forEach(function(btn) {
                        btn.addEventListener('click', function(e) {
                            e.preventDefault();
                            const text = decodeURIComponent(btn.dataset.text);
                            navigator.clipboard.writeText(text);
                            const old = btn.textContent;
                            btn.textContent = 'Copied!';
                            setTimeout(function() { btn.textContent = old; }, 1200);
                        });
                    });
                })
                .catch(function(err) {
                    console.error('Fel vid laddning:', err);
                    container.innerHTML = '<p style="color:#cc0000;">Kunde inte ladda citat. Försök igen senare.</p>';
                });
        }

        document.getElementById('lang-select').addEventListener('change', function() {
            const newLang = this.value;
            if (newLang === currentLang) return;

            const url = new URL(window.location);
            url.searchParams.set('lang', newLang);
            history.pushState({ lang: newLang }, null, url.href);

            switchLanguage(newLang);
        });

        window.addEventListener('popstate', function() {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || pickBestLanguage();
            switchLanguage(lang);
        });

        switchLanguage(currentLang);
    </script>

    <script type="module" src="../menu.js"></script>
    <script type="module" src="../footer.js"></script>

</body>
</html>
