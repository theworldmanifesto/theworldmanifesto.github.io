<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The World Manifesto — Share Quotes</title>

    <!-- LÄNK TILL DEN SEPARERADE MENY-CSS:EN (ETT STEG UPP) -->
    <link rel="stylesheet" href="../menu.css">

    <style>
        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            line-height: 1.25;
            color: #1a1a1a;
            background-color: #fcfcfc;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
            justify-content: space-between;
        }

        main { text-align: center; }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            font-size: 32px;
            font-weight: normal;
            margin: 0 0 8px 0;
        }

        header p {
            color: #555;
            font-size: 16px;
            margin: 0;
        }

        .lang-bar {
            text-align: center;
            font-size: 12px;
            color: #888;
            padding: 8px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            margin: 20px 0;
        }

        .lang-select {
            margin: 8px 0 24px 0;
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 13px;
            font-family: sans-serif;
        }

        .quote-card {
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .quote-text {
            font-size: 20px;
            line-height: 1.5;
            margin-bottom: 18px;
            font-style: italic;
            color: #333;
        }

        .share-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            font-family: sans-serif;
            cursor: pointer;
        }

        .btn-x { background: #000; color: #fff; }
        .btn-fb { background: #1877F2; color: #fff; }
        .btn-wa { background: #25D366; color: #fff; }
        .btn-tg { background: #26A5E4; color: #fff; }
        .btn-em { background: #555; color: #fff; }
        .btn-copy { background: #fff; color: #000; border: 1px solid #ccc; }

        .read-more {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #555;
        }

        .read-more a {
            color: #555;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            font-family: Georgia, serif;
        }

        .webmaster { font-size: 16px; margin-bottom: 15px; }
        .webmaster a { color: #1a1a1a; text-decoration: none; }
        .copyright { font-size: 14px; color: #666; }
    </style>
</head>
<body>

    <!-- HÄR INJECTAS DEN SEPARERADE MENYN AUTOMATISKT -->
    <div id="main-menu"></div>

    <div class="container">
        <main>
            <header>
                <h1 id="page-title">Share with others on the Internet</h1>
                <p id="page-subtitle">Refer to this manifesto by leaving quotes on various social media.</p>
            </header>

            <div class="lang-bar" id="lang-bar">Below are shown 24 quotes that are taken from The World Manifesto</div>

            <select id="lang-select" class="lang-select" onchange="if(this.value)window.location.href='?lang='+this.value">
                <option value="en">English</option>
                <option value="zh">中文</option>
                <option value="hi">हिन्दी</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
                <option value="bn">বাংলা</option>
                <option value="pt">Português</option>
                <option value="ru">Русский</option>
                <option value="ur">اردو</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="de">Deutsch</option>
                <option value="ja">日本語</option>
                <option value="sw">Kiswahili</option>
                <option value="tl">Filipino</option>
                <option value="tr">Türkçe</option>
                <option value="vi">Tiếng Việt</option>
                <option value="ko">한국어</option>
                <option value="fa">فارسی</option>
                <option value="th">ไทย</option>
                <option value="it">Italiano</option>
                <option value="pl">Polski</option>
                <option value="uk">Українська</option>
                <option value="nl">Nederlands</option>
                <option value="ro">Română</option>
                <option value="el">Ελληνικά</option>
                <option value="hu">Magyar</option>
                <option value="cs">Čeština</option>
                <option value="sv">Svenska</option>
                <option value="bg">Български</option>
                <option value="no">Norsk</option>
                <option value="da">Dansk</option>
                <option value="fi">Suomi</option>
                <option value="he">עברית</option>
                <option value="af">Afrikaans</option>
                <option value="zu">isiZulu</option>
                <option value="xh">isiXhosa</option>
                <option value="is">Íslenska</option>
                <option value="fo">Føroyskt</option>
                <option value="crs">Seselwa</option>
                <option value="se">Davvisámegiella</option>
                <option value="fit">Meänkieli</option>
            </select>

            <div id="quotes-container"></div>

            <p class="read-more" id="read-more-text">
                <a href="../lang/lang.html">Read the full manifesto in 42 languages →</a>
            </p>
        </main>

    </div>

    <!-- CITAT HÄMTNINGS SKRIPT -->
    <script>
        const PAGE = "/";
        const MANIFESTO = "The World Manifesto";

        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = (urlParams.get('lang') || 'sv').toLowerCase();

        document.getElementById('lang-select').value = currentLang;

        // --- ÖVERSÄTTNINGAR FÖR RUBRIKER ---
        const uiTranslations = {
            'sv': {
                title: 'Dela med andra på Internet',
                subtitle: 'Hänvisa till detta manifest genom att lämna citat på olika sociala medier.',
                langBar: 'Nedan visas 24 citat som är hämtade från Världsmanifestet',
                readMore: 'Läs hela manifestet på 42 språk →'
            },
            'en': {
                title: 'Share with others on the Internet',
                subtitle: 'Refer to this manifesto by leaving quotes on various social media.',
                langBar: 'Below are shown 24 quotes that are taken from The World Manifesto',
                readMore: 'Read the full manifesto in 42 languages →'
            },
            'zh': {
                title: '在互联网上与他人分享',
                subtitle: '通过在社交媒体上留下引文来引用本宣言。',
                langBar: '以下显示的是取自《世界宣言》的24条引文',
                readMore: '阅读完整宣言，共42种语言 →'
            },
            'es': {
                title: 'Compartir con otros en Internet',
                subtitle: 'Haga referencia a este manifiesto dejando citas en varias redes sociales.',
                langBar: 'A continuación se muestran 24 citas tomadas de El Manifiesto Mundial',
                readMore: 'Leer el manifiesto completo en 42 idiomas →'
            },
            'fr': {
                title: 'Partager avec d\'autres sur Internet',
                subtitle: 'Référez-vous à ce manifeste en laissant des citations sur divers médias sociaux.',
                langBar: 'Voici 24 citations tirées du Manifeste Mondial',
                readMore: 'Lire le manifeste complet en 42 langues →'
            },
            'de': {
                title: 'Mit anderen im Internet teilen',
                subtitle: 'Beziehen Sie sich auf dieses Manifest, indem Sie Zitate in sozialen Medien hinterlassen.',
                langBar: 'Nachfolgend werden 24 Zitate aus dem Weltmanifest gezeigt',
                readMore: 'Das vollständige Manifest in 42 Sprachen lesen →'
            }
            // Lägg till fler språk här efter behov
        };

        // Hämta översättning eller fallback till engelska
        const ui = uiTranslations[currentLang] || uiTranslations['en'];

        // Uppdatera rubrikerna
        document.getElementById('page-title').textContent = ui.title;
        document.getElementById('page-subtitle').textContent = ui.subtitle;
        document.getElementById('read-more-text').innerHTML = '<a href="../lang/lang.html">' + ui.readMore + '</a>';

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        fetch('quotes.json')
            .then(response => {
                if (!response.ok) throw new Error('Kunde inte läsa JSON');
                return response.json();
            })
            .then(data => {
                const langKey = currentLang.toUpperCase();
                const quotesData = data[langKey] || data['SV'] || data['EN'] || {};
                const quotes = Object.values(quotesData);
                const container = document.getElementById('quotes-container');

                // Uppdatera lang-bar med antal citat
                document.getElementById('lang-bar').textContent = ui.langBar.replace('24', quotes.length);

                quotes.forEach((text, idx) => {
                    const escText = escapeHtml(text);
                    const shareText = '"' + text + '" — The World Manifesto ' + PAGE;
                    const encText = encodeURIComponent(shareText);
                    const encQuote = encodeURIComponent(text);

                    const card = document.createElement('div');
                    card.className = 'quote-card';
                    card.innerHTML = `
                        <div class="quote-text">"${escText}"</div>
                        <div class="share-row">
                            <a class="btn btn-x" href="https://x.com/intent/tweet?text=${encText}" target="_blank">Share on X</a>
                            <a class="btn btn-fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(PAGE)}&quote=${encQuote}" target="_blank">Facebook</a>
                            <a class="btn btn-wa" href="https://wa.me/?text=${encText}" target="_blank">WhatsApp</a>
                            <a class="btn btn-tg" href="https://t.me/share/url?url=${encodeURIComponent(PAGE)}&text=${encQuote}" target="_blank">Telegram</a>
                            <a class="btn btn-em" href="mailto:?subject=${encodeURIComponent(MANIFESTO)}&body=${encText}" target="_blank">Email</a>
                            <a class="btn btn-copy" href="#" data-text="${encText}">Copy Link</a>
                        </div>
                    `;
                    container.appendChild(card);
                });

                // Copy button functionality
                container.querySelectorAll('.btn-copy').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const text = decodeURIComponent(btn.dataset.text);
                        navigator.clipboard.writeText(text);
                        const old = btn.textContent;
                        btn.textContent = 'Copied!';
                        setTimeout(() => btn.textContent = old, 1200);
                    });
                });
            })
            .catch(err => console.error('Fel:', err));
    </script>

    <!-- Meny LÄNK TILL DEN SEPARERADE MENY-JS:EN (ETT STEG UPP) -->
    <script src="../menu.js"></script>

    <!-- Sidfot LÄNK TILL DEN SEPARERADE FOTNOT-JS:EN (ETTS STEG NER) -->
    <script src="../footer.js"></script>

</body>
</html>
