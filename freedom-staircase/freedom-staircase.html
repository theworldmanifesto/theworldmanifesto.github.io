<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The World Manifesto</title>
    <style>
        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            line-height: 1.25;
            color: #1a1a1a;
            background-color: #fcfcfc;
            margin: 0;
            padding: 0;
        }

        /* --- MENY --- */
        .site-nav {
            width: 100%;
            background-color: #f7f7f7;
            border-bottom: 1px solid #e5e5e5;
            padding: 10px 0;
            position: relative;
            z-index: 100;
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            display: inline-block;
        }

        .dropbtn:hover {
            background: #fff;
            border-color: #999;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            left: 0;
            top: 100%;
            margin-top: 6px;
            background-color: #fff;
            min-width: 240px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            overflow: hidden;
            z-index: 999;
        }

        .dropdown-content a {
            color: #1a1a1a;
            padding: 11px 16px;
            text-decoration: none;
            display: block;
            font-size: 15px;
            font-family: system-ui, sans-serif;
            border-bottom: 1px solid #f0f0f0;
        }

        .dropdown-content a:last-child {
            border-bottom: none;
        }

        .dropdown-content a:hover {
            background-color: #f7f7f7;
        }

        @media (min-width: 601px) {
            .dropdown:hover .dropdown-content {
                display: block;
            }
        }

        @media (max-width: 600px) {
            .nav-container { justify-content: center; }
            .dropdown-content {
                position: static;
                margin-top: 10px;
                box-shadow: none;
                width: 100vw;
                max-width: 320px;
            }
            .dropdown.active .dropdown-content {
                display: block;
            }
        }

        /* --- SIDLAYOUT --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
            justify-content: space-between;
        }

        main { text-align: center; }

        footer {
            margin-top: 60px;
            text-align: center;
            font-family: Georgia, serif;
        }

        .webmaster { font-size: 16px; margin-bottom: 15px; }
        .webmaster a { color: #1a1a1a; text-decoration: none; }
        .copyright { font-size: 14px; color: #666; }
    </style>

    <!-- Kina-säker meny: dölj Robotel för zh-besökare -->
    <script>
    (function(){
        try {
            var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || navigator.userLanguage || ''];
            var isZh = langs.some(function(l){ return l && l.toLowerCase().startsWith('zh'); });
            if(isZh){
                document.addEventListener('DOMContentLoaded', function(){
                    document.querySelectorAll('a[href*="robotel"]').forEach(function(el){ el.remove(); });
                });
            }
        } catch(e){}
    })();
    </script>
</head>
<body>

    <!-- MENY -->
    <div class="site-nav">
        <div class="nav-container">
            <div class="dropdown" id="homeDropdown">
                <a href="../index.html" class="dropbtn" id="homeBtn">🌐HOME</a>
                <div class="dropdown-content">
                    <a href="../lang/en.html">🇬🇧 ENGLISH</a>
                    <a href="../lang/zh.html">🇨🇳 简体中文</a>
                    <a href="../lang/sv.html">🇸🇪 SVENSKA</a>
                    <a href="../lang.html">🌐 More Languages</a>
                    <a href="../freedom-staircase.html">🪜 Freedom Staircase</a>
                    <a href="../tropics.html">🌎 The Tropics</a>
                    <a href="../robotel.html" id="robotel-menu-item">👄 Robotel</a>
                    <a href="../share/share.html">🗨 Share</a>
                </div>
            </div>
        </div>
    </div>


        <main>
            <!-- Huvudtitel -->
            <h1 style="font-size: 36px; font-weight: normal; margin-bottom: 25px;">The World Manifesto</h1>

            <!-- Rubriker för bilden -->
            <h2 style="font-size: 26px; font-weight: normal; margin-bottom: 8px; color: #1a1a1a;">The Freedom Staircase:</h2>
            <h3 style="font-size: 18px; font-weight: normal; font-style: italic; color: #555; margin-top: 0; margin-bottom: 25px;">All resources and services are generated for free by machines</h3>

            <!-- Bild -->
<div style="text-align: center; margin-bottom: 25px; width: 100%; overflow: hidden;">
    <img src="https://theworldmanifesto.github.io/freedom-staircase/Freedom_Staircase_2.png" alt="Freedom Staircase 2" style="width: 75%; max-width: 100%; height: auto; display: block; margin: 0 auto;">
</div>
        </main>

        <div class="container">
        <!-- Sidfot -->
        <footer>
            <div class="webmaster">
                <a href="mailto:theworldmanifesto@outlook.com">✉ &nbsp;E-mail webbmaster</a>
            </div>
            <div class="copyright">
                The World Manifesto &nbsp; &nbsp; – &nbsp; &nbsp; Published 2026
            </div>
        </footer>
    </div>

    <script>
        // --- MENY LOGIK: Hover på desktop, klick på mobil ---
        (function(){
            const dropdown = document.getElementById('homeDropdown');
            const btn = document.getElementById('homeBtn');
            let isOpen = false;

            btn.addEventListener('click', function(e){
                if(window.innerWidth <= 600){
                    if(!isOpen){
                        e.preventDefault();
                        dropdown.classList.add('active');
                        isOpen = true;
                    }
                }
            });

            document.addEventListener('click', function(e){
                if(!dropdown.contains(e.target)){
                    dropdown.classList.remove('active');
                    isOpen = false;
                }
            });
        })();
    </script>

</body>
</html>
